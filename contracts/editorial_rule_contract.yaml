# editorial-rule-contract.yaml
# Universal editorial doctrine for rule-making across any domain.
# Defines the narrative, rationale, and interpretative context for rules.
# Context-free: applies to laws, corporate policies, engineering standards, and social norms.
# Agents use this to generate the policy document. Humans use it to review structure.

contract:
  name: universal-editorial-doctrine
  version: "4.0.0"
  jurisdiction: []
  maintainers: []
  description: >
    Universal editorial doctrine for rule-making documents.
    Context-free: applies to international law, corporate policies,
    engineering standards, scientific protocols, and AI governance frameworks.
    This is NOT a data schema — it defines how the document looks,
    what sections it contains, and how content should be written.
    Covers both rules (specific, executable) and standards (principle-based, flexible).

# ─── GLOBAL DRAFTING PRINCIPLES (Universally Applicable) ──────────
# How to write the editorial document. Agents follow these when generating.

writing_principles:
  - id: DP-001
    title: "Principle over Precedent"
    description: "State the underlying principle before listing specific obligations."
  - id: DP-002
    title: "Layered Definitions"
    description: "Define atomic terms first. Only use defined terms in subsequent definitions."
  - id: DP-003
    title: "Cross-reference, don't duplicate"
    description: >
      The editorial document explains WHY. The evaluative schema defines WHAT.
      Link to the evaluative schema for specifics — don't repeat directive IDs or parameters in prose.
  - id: DP-004
    title: "One section, one concern"
    description: >
      Each major section addresses a single concern.
      If a section grows beyond 3 subsections, split it.
  - id: DP-005
    title: "Actionable language"
    description: >
      Write imperatively and precisely: e.g., "The driver must stop" not "Stopping is recommended".
      Every statement should be checkable — can an evaluator verify it?
  - id: DP-006
    title: "No orphan directives"
    description: >
      Every directive in the evaluative schema must appear in the editorial document.
      Every substantive paragraph in the editorial must have at least one directive referencing it.
      This bidirectional traceability bond is verified by a universal resolver, not file paths.
  - id: DP-007
    title: "Distinguish rules from standards"
    description: >
      Rules are specific: "All payments must be processed within 48 hours." Standards are principle-based:
      "Choose processing timelines that balance speed and accuracy."
      Mark each explicitly. Rules require an evaluator; standards require interpretation guidance.
  - id: DP-008
    title: "State essential attributes"
    description: >
      Every definition must state the essential attributes of the concept being defined.
      Include what it IS and what it is NOT.
  - id: DP-009
    title: "Avoid circularity"
    description: >
      Definitions must not be circular. Don't define a rule as "that which follows rules."
      Each term should be defined in terms of more fundamental concepts.
  - id: DP-010
    title: "Neither too broad nor too narrow"
    description: >
      Definitions must cover all instances of the concept and exclude everything else.
      A rule for "employees" should not accidentally cover "contractors."
  - id: DP-011
    title: "No artificial meaning"
    description: >
      Don't give words unnatural or counter-intuitive meanings within the doctrine.
      If a term has a standard meaning in its domain, use that meaning.
  - id: DP-012
    title: "Embed directive IDs in tables"
    description: >
      Any table describing a specific rule must include the Directive ID column (e.g., `CRT-001`).
      This enables readers to trace from prose to evaluative check.
      The Directive ID column is mandatory for rules_list and standards_list tables.
  - id: DP-013
    title: "Section depth limits"
    description: >
      Maximum section nesting depth is 3 levels (## major, ### minor, #### patch).
      If a section needs deeper nesting, split it into separate sections.

# ─── RULE CLASSIFICATION TAXONOMY ──────────────────────────────────
# Universal classification system so every section is understood globally.
# Every section in the editorial must map to one of these classifications.

rule_classification_taxonomy:
  - id: preamble
    title: "Preamble"
    description: "Intent and existential need — what problem does this solve?"
  - id: definitions
    title: "Definitions"
    description: "Authoritative thesaurus — the atomic vocabulary of the doctrine."
  - id: rights_obligations
    title: "Rights & Obligations"
    description: "What actors must do or refrain from doing."
  - id: standards_of_proof
    title: "Standards of Proof"
    description: "How to judge adherence — the rubric of evaluation."
  - id: sanctions_remedies
    title: "Sanctions & Remedies"
    description: "Consequences of deviation — corrective and punitive measures."

# ─── UNIVERSAL SECTION LAYOUT ──────────────────────────────────────
# Major (##), minor (###), patch (table rows / list items).
# max_depth enforced: 3 levels maximum.

sections:
  - id: preamble
    title: "Preamble & Context"
    classification: preamble
    required: true
    content_type: normative_statement
    minors:
      - id: existential_need
        title: "Existential Need"
        required: true
        content_type: normative_statement
        guidance: "State the existential need. What problem does this solve for humanity/the system?"
      - id: jurisdiction
        title: "Jurisdiction"
        required: false
        content_type: prose
        guidance: "Define boundaries — who is subject to this doctrine, and under what conditions."
      - id: audience
        title: "Audience"
        required: false
        content_type: prose
        guidance: "Who consumes these policies — humans, machines, or hybrid evaluators."

  - id: definitions
    title: "Authoritative Thesaurus"
    classification: definitions
    required: true
    content_type: table
    columns: ["Atomic Term", "Essential Attributes (IS)", "Exclusions (IS NOT)"]
    minors:
      - id: terminology
        title: "Terminology"
        required: false
        content_type: table
        columns: ["Term", "Meaning", "Context"]
        guidance: >
          Clarify key terms early. Especially distinguish between rule-type and standard-type
          policies when the domain uses both. Only include if the domain has jargon that needs defining.

  - id: principles
    title: "Foundational Principles"
    classification: rights_obligations
    required: true
    content_type: table
    columns: ["Principle", "Description"]
    guidance: "Each row is a foundational principle that specific rules and standards derive from."

  - id: standards
    title: "Standards of Judgment"
    classification: standards_of_proof
    required: true
    content_type: mixed
    minors:
      - id: standards_overview
        title: null
        required: false
        content_type: normative_statement
        guidance: >
          Brief overview of what standards are in this domain and how they differ from rules.
          Standards are principle-based guidelines that allow interpretation — they define
          relevant considerations rather than prescribing exact behavior.
      - id: standards_list
        title: null
        required: true
        content_type: table
        columns: ["Standard", "Directive ID", "Principle", "Interpretation Guidance"]
        machine_id_column: "Directive ID"
        guidance: >
          Each row is a flexible guideline. The Directive ID column must contain the directive ID
          from the evaluative schema (e.g., `STD-001`). The Interpretation Guidance column should list
          factors to consider and examples of correct application.

  - id: substantive_rules
    title: "Substantive Obligations & Prohibitions"
    classification: rights_obligations
    required: true
    content_type: mixed
    minors:
      - id: rules_overview
        title: null
        required: false
        content_type: normative_statement
        guidance: >
          Brief overview of what rules are in this domain and how they differ from standards.
          Rules are specific, evaluatable obligations with clear triggers and consequences.
      - id: rules_list
        title: null
        required: true
        content_type: table
        columns: ["Rule", "Directive ID", "Standard", "Evaluator Type", "Enforcement Weight"]
        machine_id_column: "Directive ID"
        guidance: >
          Each row is a specific, machine-evaluable rule. The Directive ID column must contain
          the directive ID from the evaluative schema (e.g., `CRT-001`). Link to the governing standard
          via the Standard column. Evaluator Type indicates who or what evaluates compliance.

  - id: conventions
    title: "Conventions"
    classification: standards_of_proof
    required: true
    minors:
      - id: naming
        title: "Naming"
        required: true
        content_type: mixed
        guidance: "Use examples or pattern templates to illustrate the format."
      - id: structure
        title: "Structure"
        required: false
        content_type: mixed
        guidance: "How artifacts are organized."

  - id: compliance_mechanics
    title: "Compliance & Evaluator Mechanics"
    classification: standards_of_proof
    required: false
    content_type: mixed
    minors:
      - id: evaluator_protocols
        title: "Evaluator Protocols"
        required: false
        content_type: prose
        guidance: "Execution protocols for the evaluator (agent, human, or machine)."
      - id: human_judgment_rubric
        title: "Human Judgment Rubric"
        required: false
        content_type: table
        columns: ["Factor", "Weight", "How to Assess"]
        guidance: "Only used when evaluator_type is human_reviewer or llm_judge. Gives judges/agents a scoring framework."
      - id: manual_review
        title: "Manual Review Checklist"
        required: false
        content_type: checklist
        guidance: "Group by concern. Each item must be checkable."

  - id: sanctions
    title: "Sanctions & Remedies"
    classification: sanctions_remedies
    required: false
    minors:
      - id: violation_consequences
        title: "Violation Consequences"
        required: false
        content_type: table
        columns: ["Enforcement Weight", "Consequence", "Remedy"]
        guidance: "Map each enforcement weight to its corresponding consequence and remedy."
      - id: remediation
        title: "Remediation Procedures"
        required: false
        content_type: prose
        guidance: "How deviations are corrected — corrective actions, timelines, escalation."

  - id: references
    title: "References"
    classification: preamble
    required: false
    minors:
      - id: references_table
        title: null
        required: false
        content_type: table
        columns: ["Reference", "Description"]

# ─── CROSS-REFERENCE RULES ────────────────────────────────────────
# How to link between this editorial document and the evaluative schema.
# Uses URI-based logical address space, not filesystem paths.

cross_references:
  - id: XR-001
    rule: "Every table with a Directive ID column must use the exact directive ID from the evaluative schema."
    enforcement: "Universal resolver validates that all Directive ID values exist in the evaluative schema."
  - id: XR-002
    rule: "Every directive in the evaluative schema must have an anchor_ref pointing to a valid section URI in this editorial document."
    enforcement: "Universal resolver validates that all anchor_ref values resolve to a section defined above."
  - id: XR-003
    rule: "Use backtick formatting for directive IDs in prose (e.g., `CRT-001`)."
    enforcement: "Agent generation rule."
  - id: XR-004
    rule: "Never duplicate directive parameters in prose — link to the evaluative schema instead."
    enforcement: "Agent generation rule."
  - id: XR-005
    rule: "Every substantive paragraph in the editorial must be invoked by at least one directive."
    enforcement: "Universal resolver verifies semantic overlap between editorial prose and directive anchors."
  - id: XR-006
    rule: "anchor_ref uses URI templates (e.g., urn:doctrine:section:/principles/fairness), not relative file paths."
    enforcement: "Universal resolver validates URI format and resolution."

# ─── ARCHITECTURE LAYERS ──────────────────────────────────────────
# Explicit layered architecture: Doctrine Core → Project Manifest → Operational Runtime.
# This contract defines the Doctrine Core. The Project Manifest (doctrine-manifest.yaml)
# instantiates jurisdiction, version pins, and deployment bindings per project.
# The Operational Runtime is the actual evaluator (script, human, LLM, or court).

architecture:
  layers:
    - layer: "Doctrine Core"
      description: "The universal Editorial (WHY) and Evaluative (WHAT) schemas. Immutable across projects."
    - layer: "Project Manifest"
      description: "The instantiation file (doctrine-manifest.yaml). Holds jurisdiction, version pins, and deployment bindings. Changes per project."
    - layer: "Operational Runtime"
      description: "The actual scripts, databases, or human courts that execute the evaluation."

# ─── FOOTER ───────────────────────────────────────────────────────

footer:
  required: true
  template: >
    *This file is the universal editorial doctrine for {jurisdiction}.
    It defines the WHY — the rationale, context, and interpretative framework.
    The evaluative schema defines the WHAT — the executable directives.
    For this doctrine to be valid, every directive must anchor to a section here,
    and every substantive section must be invoked by at least one directive.
    This bidirectional traceability bond is the foundation of rule integrity.*

# ─── DOCUMENT RULES ───────────────────────────────────────────────
# Structural rules about the document itself.
# These are enforced by agents and the universal resolver.

document_rules:
  - id: DOC-001
    rule: "Every section with required:true must be present."
    severity: absolute_veto
  - id: DOC-002
    rule: "Sections must appear in the order defined in this contract."
    severity: rebuttable_presumption
  - id: DOC-003
    rule: "Tables must have headers. No headerless data."
    severity: best_effort
  - id: DOC-004
    rule: "Examples and templates must be clearly labeled with their context."
    severity: informative
  - id: DOC-005
    rule: "Every directive in the evaluative schema must have kind=obligation or kind=prohibition and reference a standard."
    severity: absolute_veto
  - id: DOC-006
    rule: "Every directive with kind=standard must include interpretation guidance."
    severity: absolute_veto
  - id: DOC-007
    rule: "Definitions must not be circular and must state essential attributes."
    severity: best_effort
  - id: DOC-008
    rule: "Tables with machine_id_column must include the Directive ID column as defined in the section."
    severity: rebuttable_presumption
  - id: DOC-009
    rule: "No section may exceed max_depth nesting levels."
    severity: best_effort
  - id: DOC-010
    rule: "Every Directive ID in a table must match a directive ID in the evaluative schema (bidirectional traceability)."
    severity: absolute_veto
