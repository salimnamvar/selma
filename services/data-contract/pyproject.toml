[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-contract"
version = "0.1.0"
description = "ODCS data contract design knowledge service"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Salim" }]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ct_data"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
