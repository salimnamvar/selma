[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "usecase-diagram"
version = "0.1.0"
description = "Use case diagram design knowledge service"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Salim" }]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
usecase-diagram = "usecase_diagram.__main__:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/usecase_diagram"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
