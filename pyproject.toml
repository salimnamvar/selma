[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selma"
version = "0.1.0"
description = "A universal governance steward that maintains a perfect, bidirectional bond between human-readable policies and machine-executable rules"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
authors = [
  { name = "Salim Namvar", email = "salim.namvar@gmail.com" }
]
keywords = [
  "selma",
  "governance",
  "compliance",
  "rules",
  "policies",
  "regulation",
  "audit",
  "policy-as-code",
  "rule-engine",
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.0",
  "tree-sitter>=0.21",
  "tree-sitter-python>=0.21",
  "jsonpath-ng>=1.6",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "pyright",
  "pre-commit",
  "httpx",
  "PyYAML",
]

[project.scripts]
selma = "selma.cli:main"

[project.urls]
Homepage = "https://github.com/salimnamvar/selma"
Repository = "https://github.com/salimnamvar/selma"
Issues = "https://github.com/salimnamvar/selma/issues"
Documentation = "https://github.com/salimnamvar/selma/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

# ──────────────────────────────────────────────────────────────────────────────
# Ruff — Universal Linter & Formatter
# ──────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 88                    # Google / Black standard
target-version = "py313"
src = ["src", "tests", "scripts"]   # All source roots
show-fixes = true
exclude = [
  ".git",
  ".venv",
  ".ruff_cache",
  "__pycache__",
  "build",
  "dist",
  "*.egg-info",
]

# ── Lint Rules ────────────────────────────────────────────────────────────────
[tool.ruff.lint]
select = [
  # ── Core ──
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "I",      # isort
  "N",      # pep8-naming
  "UP",     # pyupgrade
  "B",      # flake8-bugbear
  "SIM",    # flake8-simplify
  "C4",     # flake8-comprehensions
  "RET",    # flake8-return
  "ARG",    # flake8-unused-arguments
  "PTH",    # flake8-use-pathlib
  "TRY",    # tryceratops
  "RUF",    # Ruff-specific rules

  # ── Documentation ──
  "D",      # pydocstyle (Google convention)

  # ── Type Safety ──
  "ANN",    # flake8-annotations (type hints required)
  "TCH",    # flake8-type-checking

  # ── Security ──
  "S",      # flake8-bandit

  # ── Code Quality ──
  "FBT",    # flake8-boolean-trap
  "PT",     # flake8-pytest-style
  "PLC",    # Pylint conventions
  "PLE",    # Pylint errors
  "PLW",    # Pylint warnings
  "ICN",    # flake8-import-conventions
  "PIE",    # flake8-pie
  "Q",      # flake8-quotes
  "COM",    # flake8-commas
  "BLE",    # flake8-blind-except
  "EM",     # flake8-errmsg
  "T10",    # flake8-debugger
  "FIX",    # flake8-fixme
  "SLF",    # flake8-self
  "RSE",    # flake8-raise
  "PGH",    # pygrep-hooks
  "FURB",   # refurb
  "C90",    # mccabe complexity
  "TD",     # flake8-todos
  "TID",    # flake8-tidy-imports

  # ── Modern Python ──
  "A",      # flake8-builtins (avoid shadowing builtins)
  "FLY",    # flynt (prefer f-strings over .format())
  "G",      # flake8-logging-format (lazy logging)
  "INP",    # flake8-no-pep420 (implicit namespace packages)
  "NPY",    # NumPy-specific rules
  "PERF",   # perflint (performance anti-patterns)
  "YTT",    # flake8-2020 (sys.version checks)
  "RUF100", # unused noqa directives

  # ── Print & Debug ──
  "T20",    # flake8-print (no print in src)
]

ignore = [
  # ── Formatter conflicts (must ignore) ──
  "COM812",  # trailing comma — conflicts with formatter
  "ISC001",  # implicit string concat — conflicts with formatter

  # ── Justified ignores ──
  "TRY003",  # long messages — meaningful exceptions allowed
  "D102",    # missing docstring in public method — enforced at class level
  "D105",    # missing docstring in magic method — self-explanatory
  "D107",    # missing docstring in __init__ — class docstring suffices
  "TD003",   # missing issue link — handled by custom check
  "EXE001",  # shebang — handled by clean.sh

  # ── Pydantic / typing compatibility ──
  "TC001",   # type-checking import — breaks pydantic with from __future__ import annotations
  "TC003",   # type-checking stdlib import — same reason

  # ── Pyright TypeVar inference ──
  "UP046",   # Generic subclass — required for pyright TypeVar inference in staticmethods
  "UP047",   # Generic function — same reason as UP046

  # ── Safe Coding Doctrine ──
  "S101",    # assert — required by Safe Coding Doctrine (SC-003) for postcondition checks
]

# ── isort (Google Style) ─────────────────────────────────────────────────────
[tool.ruff.lint.isort]
known-first-party = ["selma"]
force-single-line = true           # Google style: one import per line
force-sort-within-sections = true  # Alphabetical within each group
lines-between-types = 0            # No blank between import types

# ── pydocstyle (Google) ──────────────────────────────────────────────────────
[tool.ruff.lint.pydocstyle]
convention = "google"

# ── flake8-unused-arguments ──────────────────────────────────────────────────
[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

# ── flake8-tidy-imports ──────────────────────────────────────────────────────
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ── flake8-quotes ────────────────────────────────────────────────────────────
[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"

# ── mccabe ───────────────────────────────────────────────────────────────────
[tool.ruff.lint.mccabe]
max-complexity = 8  # Stricter than 10, Google recommends simple functions

# ── Formatter ────────────────────────────────────────────────────────────────
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

# ──────────────────────────────────────────────────────────────────────────────
# Pytest
# ──────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
  "-v",
]
filterwarnings = [
  "error",
]
markers = [
  "unit: Fast, isolated unit tests with no I/O",
  "integration: Tests that load real project artifacts (YAML, schema, etc.)",
  "slow: Slow-running tests (deselect with -m 'not slow')",
  "domain: Domain layer tests (entities, value objects, aggregates)",
  "repository: Repository layer tests",
  "api: API layer tests",
  "service: Service layer tests",
]

# ──────────────────────────────────────────────────────────────────────────────
# Coverage
# ──────────────────────────────────────────────────────────────────────────────
[tool.coverage.run]
branch = true
source = ["selma"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0

# ──────────────────────────────────────────────────────────────────────────────
# Pyright — Static Type Checker
# ──────────────────────────────────────────────────────────────────────────────
[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
pythonPlatform = "Linux"
include = ["src"]
extraPaths = ["src"]
reportMissingTypeStubs = false
reportUntypedFunctionDecorator = true
reportUntypedClassDecorator = true
reportPrivateUsage = false
reportImplicitStringConcatenation = true

# ──────────────────────────────────────────────────────────────────────────────
# Selma Custom Linter — Python AST rules
# ──────────────────────────────────────────────────────────────────────────────
[tool.selma.lint]
paths = ["src", "tests", "scripts"]

[tool.selma.lint.runner]
ruff = "ruff"
pylint = "pylint"
pyright = "pyright"

[tool.selma.lint.exclude]
paths = []
codes = []

[tool.selma.lint.rules]
# All enabled by default; disable specific codes here
disabled = []

[tool.selma.lint.rules.complexity]
max-lines = 60

[tool.selma.lint.rules.resources]
calls = [
  "open", "Popen", "Lock", "RLock", "connect",
  "NamedTemporaryFile", "TemporaryFile", "TemporaryDirectory",
  "socket", "urlopen",
]

[tool.selma.lint.rules.determinism]
forbidden = [
  "datetime.now", "datetime.utcnow",
  "time.time", "time.monotonic", "time.localtime", "time.gmtime",
  "random.random", "random.randint", "random.choice", "random.sample",
  "random.shuffle", "random.gauss",
  "uuid.uuid4",
]

[tool.selma.lint.rules.security]
secret-patterns = [
  "password", "secret", "api_key", "apikey", "token",
  "private_key", "access_key", "auth_token",
]
