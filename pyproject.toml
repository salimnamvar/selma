[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selma"
version = "0.1.0"
description = "A universal governance steward that maintains a perfect, bidirectional bond between human-readable policies and machine-executable rules"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
authors = [
  { name = "Salim Namvar", email = "salim.namvar@gmail.com" }
]
keywords = [
  "selma",
  "governance",
  "compliance",
  "rules",
  "policies",
  "regulation",
  "audit",
  "policy-as-code",
  "rule-engine",
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
dependencies = [
  "pydantic",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "pyright",
  "pre-commit",
  "httpx",
  "PyYAML",
]

[project.urls]
Homepage = "https://github.com/salimnamvar/selma"
Repository = "https://github.com/salimnamvar/selma"
Issues = "https://github.com/salimnamvar/selma/issues"
Documentation = "https://github.com/salimnamvar/selma/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]
show-fixes = true

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "I",      # isort
  "N",      # pep8-naming
  "UP",     # pyupgrade
  "B",      # flake8-bugbear
  "SIM",    # flake8-simplify
  "C4",     # flake8-comprehensions
  "RET",    # flake8-return
  "ARG",    # flake8-unused-arguments
  "PTH",    # flake8-use-pathlib
  "TRY",    # tryceratops
  "RUF",    # Ruff-specific rules
  "D",      # pydocstyle (Google)
  "ANN",    # flake8-annotations (type hints required)
  "T20",    # flake8-print (no print in src)
  "S",      # flake8-bandit (security)
  "FBT",    # flake8-boolean-trap
  "PT",     # flake8-pytest-style
  "PLC",    # Pylint conventions
  "PLE",    # Pylint errors
  "PLW",    # Pylint warnings
  "ICN",    # flake8-import-conventions
  "PIE",    # flake8-pie
  "TCH",    # flake8-type-checking
  "Q",      # flake8-quotes
  "COM",    # flake8-commas
  "BLE",    # flake8-blind-except
  "EM",     # flake8-errmsg
  "T10",    # flake8-debugger
  "FIX",    # flake8-fixme
  # "DOC",  # pydoclint — requires preview mode
  "SLF",    # flake8-self
  "RSE",    # flake8-raise
  "PGH",    # pygrep-hooks
  "FURB",   # refurb
  "C90",    # mccabe complexity
  "TD",     # flake8-todos
  "TID",    # flake8-tidy-imports
]
ignore = [
  "E501",    # line-too-long — handled by formatter
  "TRY003",  # long messages — meaningful exceptions
  "D102",    # missing docstring in public method — enforced at class level
  "D105",    # missing docstring in magic method — self-explanatory
  "D107",    # missing docstring in __init__ — class docstring suffices
  "ANN401",  # dynamically typed expressions — too strict
  "FBT003",  # boolean positional in function call — sometimes needed
  "COM812",  # trailing comma — conflicts with formatter
  "ISC001",  # implicit string concat — conflicts with formatter
  "TD003",   # missing issue link — handled by custom check
  "EXE001",  # shebang — handled by clean.sh
  "PLR0913", # too many arguments — sometimes necessary
  "PLR0912", # too many branches — sometimes necessary
  "PLR0915", # too many statements — sometimes necessary
  "SLF001",  # private member access — needed in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG001",
    "ARG002",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D106",
    "D107",
    "D415",
]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["domain", "infrastructure"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
  "-v",
]
filterwarnings = [
  "error",
]
markers = [
  "unit: Fast, isolated unit tests with no I/O",
  "integration: Tests that load real project artifacts (YAML, schema, etc.)",
  "slow: Slow-running tests (deselect with -m 'not slow')",
  "domain: Domain layer tests (entities, value objects, aggregates)",
  "repository: Repository layer tests",
  "api: API layer tests",
  "service: Service layer tests",
]

[tool.coverage.run]
branch = true
source = ["domain"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
pythonPlatform = "Linux"
extraPaths = ["src", "tests"]
reportMissingTypeStubs = false
