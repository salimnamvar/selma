[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selma"
version = "0.1.0"
description = "A universal governance steward that maintains a perfect, bidirectional bond between human-readable policies and machine-executable rules"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
authors = [
  { name = "Salim Namvar", email = "salim.namvar@gmail.com" }
]
keywords = [
  "selma",
  "governance",
  "compliance",
  "rules",
  "policies",
  "regulation",
  "audit",
  "policy-as-code",
  "rule-engine",
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.0",
  "tree-sitter>=0.21",
  "tree-sitter-python>=0.21",
  "jsonpath-ng>=1.6",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "pyright",
  "pre-commit",
  "httpx",
  "PyYAML",
]

[project.scripts]
selma = "selma.interfaces.cli.main:main"

[project.urls]
Homepage = "https://github.com/salimnamvar/selma"
Repository = "https://github.com/salimnamvar/selma"
Issues = "https://github.com/salimnamvar/selma/issues"
Documentation = "https://github.com/salimnamvar/selma/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

# ──────────────────────────────────────────────────────────────────────────────
# Ruff — Universal Linter & Formatter
# ──────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 88                    # Google / Black standard
target-version = "py313"
src = ["src", "tests", "scripts"]   # All source roots
show-fixes = true
exclude = [
  ".git",
  ".venv",
  ".ruff_cache",
  "__pycache__",
  "build",
  "dist",
  "*.egg-info",
]

# ── Lint Rules ────────────────────────────────────────────────────────────────
[tool.ruff.lint]
select = [
  # ── Core ──
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "I",      # isort
  "N",      # pep8-naming
  "UP",     # pyupgrade
  "B",      # flake8-bugbear
  "SIM",    # flake8-simplify
  "C4",     # flake8-comprehensions
  "RET",    # flake8-return
  "ARG",    # flake8-unused-arguments
  "PTH",    # flake8-use-pathlib
  "TRY",    # tryceratops
  "RUF",    # Ruff-specific rules

  # ── Documentation ──
  "D",      # pydocstyle (Google convention)

  # ── Type Safety ──
  "ANN",    # flake8-annotations (type hints required)
  "TCH",    # flake8-type-checking

  # ── Security ──
  "S",      # flake8-bandit

  # ── Code Quality ──
  "FBT",    # flake8-boolean-trap
  "PT",     # flake8-pytest-style
  "PLC",    # Pylint conventions
  "PLE",    # Pylint errors
  "PLW",    # Pylint warnings
  "ICN",    # flake8-import-conventions
  "PIE",    # flake8-pie
  "Q",      # flake8-quotes
  "COM",    # flake8-commas
  "BLE",    # flake8-blind-except
  "EM",     # flake8-errmsg
  "T10",    # flake8-debugger
  "FIX",    # flake8-fixme
  "SLF",    # flake8-self
  "RSE",    # flake8-raise
  "PGH",    # pygrep-hooks
  "FURB",   # refurb
  "C90",    # mccabe complexity
  "TD",     # flake8-todos
  "TID",    # flake8-tidy-imports

  # ── Modern Python ──
  "A",      # flake8-builtins (avoid shadowing builtins)
  "FLY",    # flynt (prefer f-strings over .format())
  "G",      # flake8-logging-format (lazy logging)
  "INP",    # flake8-no-pep420 (implicit namespace packages)
  "NPY",    # NumPy-specific rules
  "PERF",   # perflint (performance anti-patterns)
  "YTT",    # flake8-2020 (sys.version checks)
  "RUF100", # unused noqa directives

  # ── Print & Debug ──
  "T20",    # flake8-print (no print in src)
]

ignore = [
  # ── Formatter conflicts (must ignore) ──
  "COM812",  # trailing comma — conflicts with formatter
  "ISC001",  # implicit string concat — conflicts with formatter

  # ── Justified ignores ──
  "TRY003",  # long messages — meaningful exceptions allowed
  "D102",    # missing docstring in public method — enforced at class level
  "D105",    # missing docstring in magic method — self-explanatory
  "D107",    # missing docstring in __init__ — class docstring suffices
  "D104",    # missing docstring in public package — not needed for every __init__
  "TD003",   # missing issue link — handled by custom check
  "EXE001",  # shebang — handled by clean.sh
  "S603",    # subprocess call — inputs are controlled, shell=False

  # ── Pydantic / typing compatibility ──
  "TC001",   # type-checking import — breaks pydantic with from __future__ import annotations
  "TC003",   # type-checking stdlib import — same reason

  # ── Pyright TypeVar inference ──
  "UP046",   # Generic subclass — required for pyright TypeVar inference in staticmethods
  "UP047",   # Generic function — same reason as UP046

  # ── Project coding conventions (b_continue pattern) ──
  "S101",    # assert in tests — expected in test files
  "C901",    # function complexity — b_continue pattern is verbose but simple
  "SIM102",  # nested if — b_continue pattern uses guarded nesting
  "SIM108",  # ternary — b_continue pattern is clearer
  "F821",    # undefined name 'self' — b_continue pattern in static methods
  "F841",    # unused variable — b_continue pattern intermediate vars
  "ARG002",  # unused method argument — interface methods have required signatures
  "ARG004",  # unused method argument — b_continue pattern
  "PERF401", # list.extend — b_continue pattern uses append in loops
  "EM101",   # string literal in exception — project convention
  "EM102",   # f-string in exception — project convention
  "BLE001",  # blind exception — b_continue pattern catches Exception for SC-002
  "RET504",  # unnecessary assignment before return — b_continue pattern
  "INP001",  # implicit namespace package — not applicable
  "N818",    # exception naming — project convention uses descriptive names
  "E501",    # line too long — ruff formatter handles this
  "ANN401",  # dynamically typed Any — used in type annotations
  "PTH123",  # pathlib vs open — not always appropriate
  "D415",    # docstring first line punctuation — not enforced
  "FBT001",  # boolean positional argument — project convention
  "FBT002",  # boolean keyword argument — project convention
  "B011",    # assert False — used in tests
  "B017",    # assert Exception — used in tests
  "PT011",   # pytest.raises too broad — used in tests
  "PT015",   # assert False — used in tests
  "S110",    # try-except-pass — used in tests for expected exceptions
]

# ── isort (Google Style) ─────────────────────────────────────────────────────
[tool.ruff.lint.isort]
known-first-party = ["selma"]
force-single-line = true           # Google style: one import per line
force-sort-within-sections = true  # Alphabetical within each group
lines-between-types = 0            # No blank between import types

# ── pydocstyle (Google) ──────────────────────────────────────────────────────
[tool.ruff.lint.pydocstyle]
convention = "google"

# ── flake8-unused-arguments ──────────────────────────────────────────────────
[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

# ── flake8-tidy-imports ──────────────────────────────────────────────────────
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ── flake8-quotes ────────────────────────────────────────────────────────────
[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"

# ── mccabe ───────────────────────────────────────────────────────────────────
[tool.ruff.lint.mccabe]
max-complexity = 8  # Stricter than 10, Google recommends simple functions

# ── Formatter ────────────────────────────────────────────────────────────────
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

# ──────────────────────────────────────────────────────────────────────────────
# Pytest
# ──────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
  "-v",
]
filterwarnings = [
  "error",
]
markers = [
  "unit: Fast, isolated unit tests with no I/O",
  "integration: Tests that load real project artifacts (YAML, schema, etc.)",
  "slow: Slow-running tests (deselect with -m 'not slow')",
  "domain: Domain layer tests (entities, value objects, aggregates)",
  "repository: Repository layer tests",
  "api: API layer tests",
  "service: Service layer tests",
]

# ──────────────────────────────────────────────────────────────────────────────
# Coverage
# ──────────────────────────────────────────────────────────────────────────────
[tool.coverage.run]
branch = true
source = ["selma"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0

# ──────────────────────────────────────────────────────────────────────────────
# Pyright — Static Type Checker
# ──────────────────────────────────────────────────────────────────────────────
[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
pythonPlatform = "Linux"
include = ["src"]
extraPaths = ["src"]
reportMissingTypeStubs = false
reportUntypedFunctionDecorator = true
reportUntypedClassDecorator = true
reportPrivateUsage = false
reportImplicitStringConcatenation = true

# ──────────────────────────────────────────────────────────────────────────────
# Selma Configuration — Zero Hardcoding
# ──────────────────────────────────────────────────────────────────────────────
[tool.selma]
version = "0.1.0"
name = "selma"

# ─── Paths ──────────────────────────────────────────────────────────────────
[tool.selma.paths]
include = ["src", "tests"]
exclude = ["__pycache__", "*.pyc", ".git", ".venv", "build", "dist", "*.egg-info"]
extensions = [".py"]

# ─── Output ─────────────────────────────────────────────────────────────────
[tool.selma.output]
format = "default"
guide = false
# file = null (stdout by default)
color = true

# ─── Execution ──────────────────────────────────────────────────────────────
[tool.selma.execution]
skip_tools = false
skip_ast = false
only = ""  # null equivalent: run all checks
max_workers = 4
file_timeout = 30

# ─── Rules (top-level filtering) ───────────────────────────────────────────
[tool.selma.rules]
disabled = ["SC-033", "SC-114"]
codes = []
exclude_codes = []

# ─── Rule: SC-001 Single Exit ──────────────────────────────────────────────
[tool.selma.rules.sc001]
enabled = true
severity = "critical"
exempt_dunders = true
exempt_generators = true
exempt_names = []

# ─── Rule: SC-002 Zero Raise ───────────────────────────────────────────────
[tool.selma.rules.sc002]
enabled = true
severity = "critical"
exempt_dunders = true
exempt_adapters = true
adapter_keywords = ["exception", "error", "http"]

# ─── Rule: SC-003 Result Return ────────────────────────────────────────────
[tool.selma.rules.sc003]
enabled = true
severity = "critical"
exempt_dunders = true
exempt_properties = true
exempt_abstract = true

# ─── Rule: SC-004 INVALID_RESULT Sentinel ──────────────────────────────────
[tool.selma.rules.sc004]
enabled = true
severity = "critical"
sentinel_name = "INVALID_RESULT"
exempt_pure = true

# ─── Rule: SC-005 No Tuple Returns ─────────────────────────────────────────
[tool.selma.rules.sc005]
enabled = true
severity = "high"
exempt_dunders = true

# ─── Rule: SC-007 No Assert for Validation ─────────────────────────────────
[tool.selma.rules.sc007]
enabled = true
severity = "critical"
exempt_tests = true
test_patterns = ["test_*.py", "*_test.py"]

# ─── Rule: SC-010 Function Length ──────────────────────────────────────────
[tool.selma.rules.sc010]
enabled = true
severity = "medium"
max_lines = 60
count_nested = true
exclude_non_executable = true

# ─── Rule: SC-011 b_continue ───────────────────────────────────────────────
[tool.selma.rules.sc011]
enabled = true
severity = "critical"
exempt_dunders = true
require_all = false
require_result_functions = true
warn_multi_false = true
flag_alias = true
flag_delete = true
flag_parameter = true
flag_global = true
flag_attribute = true

# ─── Rule: SC-013 Function Contracts ───────────────────────────────────────
[tool.selma.rules.sc013]
enabled = true
severity = "high"
exempt_dunders = true
exempt_properties = true
required_sections = ["preconditions", "postconditions", "side effect", "resource", "failure"]

# ─── Rule: SC-022 No Input Mutation ────────────────────────────────────────
[tool.selma.rules.sc022]
enabled = true
severity = "high"
exempt_dunders = true
read_only_methods = ["get", "copy", "items", "keys", "values", "iter", "len", "str", "repr"]
mutation_methods = [
  "append", "extend", "insert", "remove", "pop", "clear", "sort", "reverse",
  "update", "setdefault", "popitem", "add", "discard", "remove",
]

# ─── Rule: SC-024 Explicit Return Types ────────────────────────────────────
[tool.selma.rules.sc024]
enabled = true
severity = "high"
exempt_dunders = true
exempt_abstract = true

# ─── Rule: SC-025 No Star Imports ──────────────────────────────────────────
[tool.selma.rules.sc025]
enabled = true
severity = "medium"
allowed_modules = []

# ─── Rule: SC-031 Type Validation ──────────────────────────────────────────
[tool.selma.rules.sc031]
enabled = true
severity = "warning"
exempt_dunders = true
skip_params = ["self", "cls"]
framework_types = ["BaseModel", "BaseSettings", "dataclass"]

# ─── Rule: SC-033 Nullability Validation ────────────────────────────────────
[tool.selma.rules.sc033]
enabled = true
severity = "warning"
exempt_dunders = true
inherently_nullable = ["None"]
skip_with_default = true

# ─── Rule: SC-041 Specific Exception Handling ──────────────────────────────
[tool.selma.rules.sc041]
enabled = true
severity = "critical"
allow_broad_last = true
allow_bare_except = false
allow_base_exception = false

# ─── Rule: SC-042 No Silent Failures ──────────────────────────────────────
[tool.selma.rules.sc042]
enabled = true
severity = "critical"
flag_empty = true
flag_pass_only = true

# ─── Rule: SC-052 No Re-Raising ────────────────────────────────────────────
[tool.selma.rules.sc052]
enabled = true
severity = "critical"
allow_in_finally = false

# ─── Rule: SC-060 Log at First Detection Layer ─────────────────────────────
[tool.selma.rules.sc060]
enabled = true
severity = "warning"
flag_duplicate = true

# ─── Rule: SC-061 Structured Logging ──────────────────────────────────────
[tool.selma.rules.sc061]
enabled = true
severity = "warning"
exempt_methods = ["debug"]
flag_printf = true
flag_fstring = true
flag_percent = true

# ─── Rule: SC-062 No Sensitive Data in Logs ───────────────────────────────
[tool.selma.rules.sc062]
enabled = true
severity = "critical"
sensitive_patterns = [
  "password", "secret", "api_key", "apikey", "token",
  "private_key", "access_key", "auth_token", "credential",
]

# ─── Rule: SC-065 Mandatory Failure Logging ────────────────────────────────
[tool.selma.rules.sc065]
enabled = true
severity = "high"
exempt_dunders = true
exempt_safe_decorator = true
log_levels = { validation = "warning", computation = "error", system = "critical" }

# ─── Rule: SC-070 No Module-Level Mutable State ───────────────────────────
[tool.selma.rules.sc070]
enabled = true
severity = "critical"
exempt_constants = true
exempt_dunders = ["__all__", "__version__"]
exempt_context_var = true
exempt_frozen_dataclass = true
framework_globals = ["logger", "log", "app", "router", "db", "engine", "session", "config", "settings", "base", "Base", "metadata"]

# ─── Rule: SC-071 Deterministic Execution ──────────────────────────────────
[tool.selma.rules.sc071]
enabled = true
severity = "critical"
forbidden_calls = [
  "datetime.now", "datetime.utcnow",
  "time.time", "time.monotonic", "time.localtime", "time.gmtime",
  "random.random", "random.randint", "random.choice", "random.sample",
  "random.shuffle", "random.gauss",
  "uuid.uuid4",
]
exempt_injection = true
injection_params = ["timestamp", "a_timestamp", "a_time", "seed", "a_seed", "a_clock"]
exempt_crypto = true
exempt_infrastructure = ["logging", "structlog", "prometheus", "statsd"]

# ─── Rule: SC-080 Context Managers ─────────────────────────────────────────
[tool.selma.rules.sc080]
enabled = true
severity = "critical"
resource_calls = [
  "open", "Popen", "Lock", "RLock", "connect",
  "NamedTemporaryFile", "TemporaryFile", "TemporaryDirectory",
  "socket", "urlopen", "sqlite3.connect",
]

# ─── Rule: SC-090 Shared State Protection ──────────────────────────────────
[tool.selma.rules.sc090]
enabled = true
severity = "critical"
detect_global = true
detect_nonlocal = true
strict_async = true

# ─── Rule: SC-092 No Shared Mutable State Without Sync ────────────────────
[tool.selma.rules.sc092]
enabled = true
severity = "critical"
sync_primitives = ["Lock", "RLock", "asyncio.Lock", "Semaphore", "asyncio.Semaphore"]

# ─── Rule: SC-100 No Secrets ──────────────────────────────────────────────
[tool.selma.rules.sc100]
enabled = true
severity = "critical"
secret_patterns = [
  "password", "secret", "api_key", "apikey", "token",
  "private_key", "access_key", "auth_token", "credential",
]
min_length = 8

# ─── Rule: SC-101 Parameterized Queries ────────────────────────────────────
[tool.selma.rules.sc101]
enabled = true
severity = "critical"
execute_methods = ["execute", "executemany", "executescript"]
sql_keywords = ["SELECT", "INSERT", "UPDATE", "DELETE", "DROP", "ALTER", "CREATE", "FROM", "WHERE", "JOIN", "INTO", "VALUES"]

# ─── Rule: SC-104 No eval/exec ────────────────────────────────────────────
[tool.selma.rules.sc104]
enabled = true
severity = "critical"
forbidden_functions = ["eval", "exec", "compile"]

# ─── Rule: SC-114 Recursion Limits ────────────────────────────────────────
[tool.selma.rules.sc114]
enabled = true
severity = "critical"
max_depth = 10
depth_param = "a_depth"
exempt_names = []

# ─── Rule: SC-115 Configurable Timeouts ────────────────────────────────────
[tool.selma.rules.sc115]
enabled = true
severity = "high"
io_calls = [
  "requests.get", "requests.post", "requests.put", "requests.delete",
  "requests.patch", "requests.head", "requests.options",
  "httpx.get", "httpx.post", "httpx.put", "httpx.delete",
  "aiohttp.ClientSession.get", "aiohttp.ClientSession.post",
  "urlopen", "socket.connect",
  "subprocess.run", "subprocess.Popen",
]
timeout_param = "timeout"
default_timeout = 30

# ─── Rule: No print() in src/ ──────────────────────────────────────────────
[tool.selma.rules.no_print]
enabled = true
severity = "warning"
exempt_tests = true
test_patterns = ["test_*.py", "*_test.py"]

# ─── Rule: TODO Format ─────────────────────────────────────────────────────
[tool.selma.rules.todo_format]
enabled = true
severity = "info"
require_bug_ref = true
valid_format = "TODO(bugref): description"

# ─── Rule: a-prefix ────────────────────────────────────────────────────────
[tool.selma.rules.a_prefix]
enabled = true
severity = "error"
exempt_params = ["self", "cls", "args", "kwargs"]
exempt_prefixes = ["_", "__"]
inherited_methods = [
  "filter", "emit", "format", "formatTime", "formatException",
  "write", "read", "close", "flush", "seek", "tell",
  "readline", "readlines", "writelines",
]
exempt_decorated = true

# ─── Rule: mutable-default ─────────────────────────────────────────────────
[tool.selma.rules.mutable_default]
enabled = true
severity = "error"
mutable_types = ["list", "dict", "set"]

# ─── External Tools ────────────────────────────────────────────────────────
[tool.selma.tools.ruff]
enabled = true
binary = "ruff"
args = []

[tool.selma.tools.pylint]
enabled = true
binary = "pylint"
rcfile = "pylintrc"
fail_under = 8
args = ["--recursive=y"]

[tool.selma.tools.pyright]
enabled = true
binary = "pyright"
args = ["--strict"]

# ─── Logging ───────────────────────────────────────────────────────────────
[tool.selma.logging]
level = "WARNING"
format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
file = ""
