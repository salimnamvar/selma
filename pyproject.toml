[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selma"
version = "0.1.0"
description = "A universal governance steward that maintains a perfect, bidirectional bond between human-readable policies and machine-executable rules"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
authors = [
  { name = "Salim Namvar", email = "salim.namvar@gmail.com" }
]
keywords = [
  "selma",
  "governance",
  "compliance",
  "rules",
  "policies",
  "regulation",
  "audit",
  "policy-as-code",
  "rule-engine",
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
dependencies = [
  "pydantic",
  "packaging",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "pyright",
  "pre-commit",
  "httpx",
  "PyYAML",
]

[project.urls]
Homepage = "https://github.com/salimnamvar/selma"
Repository = "https://github.com/salimnamvar/selma"
Issues = "https://github.com/salimnamvar/selma/issues"
Documentation = "https://github.com/salimnamvar/selma/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]
show-fixes = true

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "F",      # pyflakes
  "I",      # import sorting
  "N",      # naming conventions
  "UP",     # pyupgrade
  "B",      # bugbear
  "SIM",    # simplify
  "C4",     # comprehensions
  "RET",    # return statement improvements
  "ARG",    # unused function arguments
  "PTH",    # pathlib over os.path
  "TRY",    # exception handling
  "RUF",    # Ruff-specific rules
  "D",      # pydocstyle / Google-style docstrings
  "PLC0415",  # import-outside-top-level — enforce import.md (no in-function imports)
]
ignore = [
  "E501",   # line-too-long — Google allows long URLs/examples in docs
  "B008",   # do not perform function calls in argument defaults
  "UP006",  # keep typing.Dict/List/Tuple per project coding rules
  "UP007",  # keep Union[X, Y] instead of X | Y per project coding rules
  "UP035",  # keep typing imports used by project style
  "UP045",  # keep Optional[X] instead of X | None per project coding rules
  "TRY003", # too strict for domain exceptions with meaningful messages
  "D105",   # magic methods are self-describing; avoid noise on __str__/__iter__/etc.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG001",
    "ARG002",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D106",
    "D107",
    "D415",
]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["domain"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
  "-v",
]
filterwarnings = [
  "error",
]
markers = [
  "unit: Fast, isolated unit tests with no I/O",
  "integration: Tests that load real project artifacts (YAML, schema, etc.)",
  "slow: Slow-running tests (deselect with -m 'not slow')",
  "domain: Domain layer tests (entities, value objects, aggregates)",
  "repository: Repository layer tests",
  "api: API layer tests",
  "service: Service layer tests",
]

[tool.coverage.run]
branch = true
source = ["domain"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
pythonPlatform = "Linux"
extraPaths = ["src", "tests"]
reportMissingTypeStubs = false
