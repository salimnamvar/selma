# policy_doctrine.yaml
# Human governance document. Describes HOW humans write and manage rules.
# Contains NO machine-executable logic. Priority hierarchy and conflict
# resolution are DECLARATIVE DESCRIPTIONS of governance intent, not
# executable algorithms. The machine implementation lives in the
# Compilation Engine, not here.
#
# NORMATIVE SOURCE: SPECIFICATION.md 1.0.0
# This file is a governance intent layer, not a structural or behavioral source.
#
# BREAKING CHANGE: Version 1.0.0 introduces universal vocabulary abstraction.
# All policy text MUST use canonical vocabulary terms, never domain-specific terms.
# Migration required from 8.2.4: domain-specific terms must be moved to
# vocabulary.domain_mappings.

doctrine:
  name: universal-policy-doctrine
  version: "1.0.0"
  description: >
    Defines how to structure and write a rule document.
    Describes governance intent, not executable logic.
    Uses universal vocabulary for domain-agnostic policy expression.
  spec_version: "1.0.0"
  schema_version: "1.0.0"
  schema_id: "universal-rule-schema"

# ─── CROSS-LAYER BINDING RULE ──────────────────────────────────
# This policy is the governance intent layer.
# SPECIFICATION.md is the normative behavioral source.
# rule_schema.json is the structural projection of spec invariants.
# Policy MUST NOT contain elements that contradict spec invariants.
cross_layer_binding:
  normative_source: "SPECIFICATION.md"
  policy_purpose: "Governance intent description"
  schema_purpose: "Structural projection of spec invariants"
  enforcement: "Governance intent is enforced indirectly: compile-time validators check schema field legality against spec invariants"
  conflict_resolution_binding:
    policy_layer: "Declares computed-factor intent (priority, specificity, recency). No override fields."
    schema_layer: "Optional conflict_resolution field is structural override data only."
    spec_layer: "Normative resolve_conflict algorithm defined in SPECIFICATION.md §2.15"
    precedence: "explicit override → compatible_overrides (symmetric pairs) → priority → specificity → recency → Conflict Artifact"
  runtime_prohibition: >
    This file MUST NOT be read during inspection, evaluation, finding FSM
    transitions, or conflict resolution at runtime. Policy influences execution
    only indirectly: authors use it when writing directives, and compile-time
    validators check schema field legality against spec — never by interpreting
    policy prose as executable logic.
  field_legality:
    policy_layer: "Descriptive only. No executable fields."
    schema_layer: "Executable fields only. No prose governance."
    spec_layer: "System behavior. Defines invariants for both other layers."

# ─── IDENTITY RESOLUTION ────────────────────────────────────────
# Selma uses a dual identity model:
# - Lineage ID: immutable root for audit trail (assigned once, never changes)
# - Execution ID: active node identity (changes on fork/merge/split)
# The canonical identifier in policy is "Machine ID" which maps to lineage_id.
identity_resolution:
  canonical_field: "Machine ID"
  policy_location: "directive_tables[].Machine ID"
  schema_lineage_location: "rules[].lineage_id"
  schema_execution_location: "rules[].id"
  spec_lineage_location: "CG-IR nodes[].lineage_id"
  spec_execution_location: "CG-IR nodes[].directive_id"
  identity_mapping: >
    Machine ID maps exclusively to lineage_id (immutable root).
    Execution ID is NOT represented in policy tables; it is assigned
    at schema compilation time as rule.id and may diverge after fork/merge/split.
  machine_id_semantics:
    definition: "Stable external lineage identifier assigned at directive authoring time"
    exclusions: ["execution ID", "compile-time artifact", "runtime lookup key"]
    assignment: "Assigned once at first authoring; never reassigned"
    governance_intent: >
      Machine ID is the human-facing identity root. It provides a stable
      reference point for audit trails, cross-referencing between policy
      and machine rules, and governance discussions. It must never change
      because governance processes (amendments, sanctions, reviews) depend
      on stable identity references. Implementation mapping to
      rule.lineage_id and compile-time binding details are defined in
      SPECIFICATION.md §2.3.
  uniqueness: "Lineage IDs must be unique within a domain. Pattern: ^[A-Z]{2,5}-\\d{3}[A-Z]?$"
  taxonomy_prefixes:
    GOV: "Cross-cutting governance"
    COD: "Coding rules"
    SEC: "Security rules"
    INF: "Infrastructure rules"
    AIG: "AI governance rules"
    PROC: "Process rules"
    DAT: "Data governance rules"
    ACC: "Access control rules"
    DOC: "Documentation rules"
  lifecycle_reference: >
    Identity lifecycle operations (fork, merge, split) are defined in
    SPECIFICATION.md Section 2.2 and encoded in rule_schema.json lineage field.
    This policy describes governance intent for when to use each operation.

# ─── IDENTITY LIFECYCLE INTENT ──────────────────────────────────
# Describes WHEN to use each lifecycle operation. Implementation details
# are in SPECIFICATION.md and rule_schema.json.
lifecycle_definition:
  revision: "Use when changing description, parameters, scope, or detection within same semantic intent."
  fork: "Use when one directive must become two distinct directives with separate semantic intent."
  merge: >
    Use when two directives combine into one with unified semantic intent.
    The governing body intends that the lexicographically smaller parent
    Machine ID becomes the merged lineage root (see SPECIFICATION.md §2.2.2).
    NOTE: The lexicographic minimum approach is deterministic but
    semantically lossy — e.g. merging PAY-800 and AUTH-001 produces
    AUTH-001 as root, which loses the PAY-800 provenance. A future
    MERGE-NN namespace (e.g. MGR-18) could preserve provenance explicitly.
    Current approach is accepted with mandatory mitigations per
    SPECIFICATION.md §2.2.2 (provenance surfacing, parent_lineage_ids
    display, non-surviving parent tracing).
  split: "Use when one directive restructured into multiple independent directives."
  rename: "Use when display name changes but semantic intent is unchanged."
  retire: "Use when directive is no longer applicable. ID preserved in audit trail."
  dag_intent: >
    Lineage ancestry MUST form a directed acyclic graph. Cycles and excessive
    depth (>64 operations) are prohibited. Implementation invariants are
    defined in SPECIFICATION.md §2.2.3.

# ─── VOCABULARY ─────────────────────────────────────────────────
# Domain vocabulary makes this policy applicable across languages and domains.
# Each term has a canonical (abstract) name and optional domain-specific mappings.
# Policy text MUST use canonical names, never domain-specific terms directly.
vocabulary:
  description: >
    Domain vocabulary makes this policy applicable across languages and domains.
    Each term has a canonical (abstract) name and optional domain-specific mappings.
    Policy text MUST use canonical names, never domain-specific terms directly.
  terms:
    - canonical_name: "operation"
      definition: "A discrete unit of executable behavior that transforms inputs to outputs or produces side effects"
      domain_mappings:
        - domain: python
          local_term: "function"
          local_notes: "Also includes methods, coroutines, and generators"
        - domain: javascript
          local_term: "function"
          local_notes: "Includes arrow functions, async functions, and methods"
        - domain: typescript
          local_term: "function"
          local_notes: "Includes arrow functions, async functions, methods, and typed overloads"
        - domain: rust
          local_term: "fn"
          local_notes: "Includes associated functions and closures"
        - domain: go
          local_term: "func"
          local_notes: "Includes methods with receiver parameters"
        - domain: java
          local_term: "method"
          local_notes: "Includes constructors and static methods"
        - domain: csharp
          local_term: "method"
          local_notes: "Includes constructors, extension methods, and local functions"
        - domain: terraform
          local_term: "resource block"
          local_notes: "Also includes data sources and module calls"
        - domain: kubernetes
          local_term: "controller reconciliation"
          local_notes: "The control loop operation that reconciles desired state"
        - domain: workflow
          local_term: "step"
          local_notes: "A discrete step in a workflow or pipeline"

    - canonical_name: "component"
      definition: "A cohesive assembly of operations and state that provides a defined capability"
      domain_mappings:
        - domain: python
          local_term: "module"
          local_notes: "A .py file or package containing related operations"
        - domain: javascript
          local_term: "module"
          local_notes: "An ES module or CommonJS module"
        - domain: rust
          local_term: "crate"
          local_notes: "A compilation unit containing modules"
        - domain: go
          local_term: "package"
          local_notes: "A Go package providing related functionality"
        - domain: java
          local_term: "class"
          local_notes: "A class or interface providing cohesive behavior"
        - domain: kubernetes
          local_term: "controller"
          local_notes: "A controller or operator that manages resources"
        - domain: terraform
          local_term: "module"
          local_notes: "A Terraform module encapsulating resources"

    - canonical_name: "failure-signal"
      definition: "An indication that an operation could not complete its intended purpose"
      domain_mappings:
        - domain: python
          local_term: "exception"
          local_notes: "Raised via 'raise' statement; includes Exception hierarchy"
        - domain: javascript
          local_term: "Error"
          local_notes: "Thrown via 'throw' statement; includes Error hierarchy"
        - domain: rust
          local_term: "Result::Err"
          local_notes: "Returned via Result type; also panic! for unrecoverable errors"
        - domain: go
          local_term: "error"
          local_notes: "Returned as second value from operations; also panic/recover"
        - domain: java
          local_term: "Exception"
          local_notes: "Thrown via 'throw'; includes checked and unchecked exceptions"
        - domain: csharp
          local_term: "Exception"
          local_notes: "Thrown via 'throw'; includes structured exception handling"

    - canonical_name: "structured-output"
      definition: "A deterministic, machine-parseable result that encodes success or failure with optional data"
      domain_mappings:
        - domain: python
          local_term: "Result"
          local_notes: "Custom Result type or dataclass encoding success/failure"
        - domain: rust
          local_term: "Result<T, E>"
          local_notes: "Standard library Result type for error handling"
        - domain: go
          local_term: "error interface"
          local_notes: "The error interface combined with return values"

    - canonical_name: "resource-handle"
      definition: "A reference to an external resource that requires explicit lifecycle management"
      domain_mappings:
        - domain: python
          local_term: "context manager"
          local_notes: "Objects implementing __enter__/__exit__ protocol"
        - domain: rust
          local_term: "RAII guard"
          local_notes: "Types implementing Drop trait for automatic cleanup"
        - domain: java
          local_term: "AutoCloseable"
          local_notes: "Types implementing AutoCloseable for try-with-resources"
        - domain: go
          local_term: "io.Closer"
          local_notes: "Types implementing Closer interface for defer-based cleanup"

    - canonical_name: "configuration-artifact"
      definition: "A file or structure that defines system behavior without containing executable logic"
      domain_mappings:
        - domain: terraform
          local_term: "HCL configuration"
          local_notes: "Terraform .tf files defining infrastructure"
        - domain: kubernetes
          local_term: "manifest"
          local_notes: "YAML/JSON resource definitions"
        - domain: yaml-config
          local_term: "YAML configuration"
          local_notes: "YAML files defining application or infrastructure settings"
        - domain: json-config
          local_term: "JSON configuration"
          local_notes: "JSON files defining application settings"

    - canonical_name: "control-flow-exit"
      definition: "A point where execution leaves the normal sequential flow of an operation"
      domain_mappings:
        - domain: python
          local_term: "return statement"
          local_notes: "Also includes yield, raise, and sys.exit()"
        - domain: javascript
          local_term: "return statement"
          local_notes: "Also includes throw, break, continue"
        - domain: rust
          local_term: "return expression"
          local_notes: "Also includes ?, break, continue, panic!"
        - domain: go
          local_term: "return statement"
          local_notes: "Also includes panic, os.Exit"

    - canonical_name: "state-mutation"
      definition: "A change to the observable state of a component, resource, or data structure"
      domain_mappings:
        - domain: python
          local_term: "assignment"
          local_notes: "Variable assignment, attribute mutation, collection modification"
        - domain: rust
          local_term: "mutable borrow"
          local_notes: "Requires &mut reference; enforced at compile time"
        - domain: functional
          local_term: "side effect"
          local_notes: "Discouraged in pure functional contexts; use monadic patterns"

    - canonical_name: "artifact"
      definition: "A discrete unit of work product that can be inspected, validated, or governed"
      domain_mappings:
        - domain: coding
          local_term: "source file"
          local_notes: "A file containing source code"
        - domain: infrastructure
          local_term: "infrastructure definition"
          local_notes: "Files defining infrastructure (Terraform, CloudFormation, etc.)"
        - domain: documentation
          local_term: "document"
          local_notes: "A file containing documentation, specifications, or policies"
        - domain: ai-governance
          local_term: "prompt template"
          local_notes: "A template or configuration for AI model interactions"

# ─── CONTAMINATION GUARD ─────────────────────────────────────────
# This document MUST NOT contain machine-executable logic.
# PROHIBITED: parameters, conditions, evaluator_hint, evaluator_type,
# evaluator_config, weight, depends_on, conflicts_with, status,
# created_at, expires_at, remediation, target, lineage.
# ALLOWED: Machine ID columns (cross-reference labels only).
contamination_guard:
  # NOTE: If adding new schema fields, evaluate contamination risk before
  # allowing them in policy. The fields below are machine-executable and
  # MUST NOT appear in governance prose.
  prohibited_fields:
    - parameters
    - conditions
    - evaluator_hint
    - evaluator_type
    - evaluator_config
    - detection_spec
    - detection
    - adapters
    - weight
    - depends_on
    - conflicts_with
    - status
    - created_at
    - expires_at
    - remediation
    - target
    - lineage
  allowed_machine_references:
    - "Machine ID columns in directive tables (cross-reference labels only)"
  metadata_constraints: >
    Schema metadata fields are informational only. They MUST NOT contain
    executable hints, evaluator configuration, or runtime flags. Use
    declared namespaces (audit, vendor, author, migration) per SPECIFICATION.md §7.1.
  vocabulary_enforcement: >
    Prohibited also: any domain-specific term used outside of vocabulary.domain_mappings
    (e.g., using "function" in policy text instead of "operation"; using "raise" instead
    of "failure-signal"). All policy prose MUST use canonical vocabulary terms.
    Domain-specific terms are permitted ONLY within vocabulary.terms[].domain_mappings[]
    entries, never in directive text, guidance, or definitions.

# ─── WRITING PRINCIPLES ──────────────────────────────────────────
writing_principles:
  - id: WP-001
    title: "Precision over Ambiguity"
    description: "Use exact, imperative language. Avoid 'should' or 'may' when 'must' or 'must not' is intended."
  - id: WP-002
    title: "Definitions First"
    description: "Define every atomic term before using it in a rule."
  - id: WP-003
    title: "Structural Integrity"
    description: "Do not exceed 3 levels of nested sections. If you need more, split the document."
  - id: WP-004
    title: "Traceability"
    description: "Every substantive paragraph must link to a Machine ID. No orphan rules."
  - id: WP-005
    title: "Hierarchy of Authority"
    description: "Declare how conflicts are resolved (e.g., 'Newer rules override older', 'General rules defer to specific rules')."
  - id: WP-006
    title: "Vocabulary Discipline"
    description: "Use canonical vocabulary terms from the vocabulary section. Never use domain-specific terms in policy prose. Map domain concepts to canonical names via vocabulary.domain_mappings."
  - id: WP-007
    title: "Universal Exclusions"
    description: "Use pattern_category enums for exclusions, not project-specific lists. Exclusions must be expressible across all target domains."

# ─── PRIORITY HIERARCHY (DECLARATIVE) ────────────────────────────
# This is a DESCRIPTION of governance intent, not an executable algorithm.
# The compilation engine translates this into CG-IR conflict resolution logic
# via the Conflict Resolution Mapping in SPECIFICATION.md Section 2.15.
priority_hierarchy:
  description: >
    Rules exist at different authority levels. The governing body declares
    that higher-priority rules take precedence. This is intent, not code.
  levels:
    - category: constitutional
      rank: 1
      title: "Constitutional / Foundational"
      description: "Core principles that cannot be overridden by any lower-level rule."
      examples: ["Human safety over efficiency", "No rule may violate fundamental rights"]
    - category: statutory
      rank: 2
      title: "Statutory / Legislative"
      description: "Rules enacted by authorized governing bodies with full authority."
      examples: ["Traffic laws", "Tax regulations", "Employment standards"]
    - category: regulatory
      rank: 3
      title: "Regulatory / Administrative"
      description: "Rules created by agencies to implement statutory requirements."
      examples: ["Building codes", "Environmental standards", "Industry guidelines"]
    - category: operational
      rank: 4
      title: "Operational / Procedural"
      description: "Day-to-day procedures that implement higher-level rules."
      examples: ["Code review checklists", "Deployment procedures", "Incident response"]
    - category: advisory
      rank: 5
      title: "Advisory / Best Practice"
      description: "Recommendations that are not mandatory but encouraged."
      examples: ["Style guides", "Performance tips", "Architecture patterns"]

  conflict_resolution: >
    The governing body declares that when two rules conflict, the engine
    first checks for explicit override, then applies computed resolution
    factors. The precedence chain is: explicit override (schema
    conflict_resolution field) → compatible_overrides (symmetric pairs)
    → priority → specificity → recency → Conflict Artifact.
    This is governance intent only — not executable logic in this file.
    The compilation engine implements this via SPECIFICATION.md
    Section 2.15. Optional explicit override (conflict_resolution field in
    rule_schema.json) is a structural data carrier checked FIRST by the engine
    before any computed factor. Policy MUST NOT define override fields.
  cross_layer_precedence:
    precedence_algorithm: "SPECIFICATION.md Section 2.15 resolve_conflict"
    structural_override: "rule_schema.json conflict_resolution field (optional)"
    policy_role: "Declarative intent for computed factors only"
    order: "explicit override (schema) → compatible_overrides (symmetric pairs) → priority → specificity → recency → Conflict Artifact"

# ─── VERSIONING STRATEGY (DECLARATIVE) ───────────────────────────
# Describes versioning intent. The actual version resolution function
# lives in the Provenance Manager engine.
version_strategy:
  description: >
    Policy doctrine, rule schema, and specification follow semantic versioning.
    This describes intent. The version resolution function is in the engine.
  version_format: "MAJOR.MINOR.PATCH"
  intent:
    major: "Breaking changes that require migration"
    minor: "New backward-compatible features"
    patch: "Bug fixes and clarifications"
  migration_intent: >
    When crossing a MAJOR version boundary, the governing body intends that
    lineage_ids are identity_preserved by default — the same Machine ID retains
    its lineage across versions. Schema field additions in new MAJOR versions
    MUST have defaults so existing datasets remain valid. Field removals or
    renames require a migration descriptor documenting the transformation.
  synchronization_intent: >
    All three documents MUST share the same MAJOR version. MINOR and PATCH
    versions MAY differ independently within the same MAJOR family.
    MAJOR mismatch is incompatible. This is a compatibility matrix, not
    strict version equality. See SPECIFICATION.md §5 for the normative
    compatibility matrix and formal compatibility rule.

# ─── UNIVERSAL DOCUMENT SECTIONS ────────────────────────────────
sections:
  - id: preamble
    title: "Preamble"
    required: true
    content_type: prose
    guidance: "Explain the existential need for these rules. Use canonical vocabulary terms only."

  - id: governance
    title: "Governance & Amendment"
    required: true
    content_type: prose
    guidance: "Define how this doctrine is changed, who has authority, and the ratification process."

  - id: definitions
    title: "Definitions"
    required: true
    content_type: table
    columns: ["Term", "Definition (What it IS)", "Exclusion (What it IS NOT)"]
    guidance: "All terms used in the document must be defined here. Use canonical vocabulary terms from the vocabulary section."

  - id: principles
    title: "Foundational Principles"
    required: true
    content_type: prose_or_table
    guidance: "State the high-level morals or axioms from which all rules derive."

  - id: directives
    title: "Directives (Rules & Standards)"
    required: true
    content_type: mixed
    guidance: >
      List all specific obligations, prohibitions, permissions, and flexible guidelines.
      All directive text MUST use canonical vocabulary terms. Exclusions MUST use
      pattern_category enums, not project-specific lists.
    children:
      - id: specific_directives
        title: "Specific Directives"
        content_type: table
        columns: ["Type (Obligation/Prohibition/Permission)", "Description", "Machine ID", "Context / Conditions"]
        exclusions:
          description: "Universal exclusions using pattern categories, not project-specific lists"
          structure:
            pattern_category:
              type: string
              enum:
                - protocol-implementation
                - entry-point
                - generated-code
                - test-infrastructure
                - interoperability-bridge
                - language-pragma
                - framework-convention
            description: "What this exclusion covers in universal terms"
            rationale: "Why this exclusion exists"
      - id: flexible_standards
        title: "Flexible Standards"
        content_type: table
        columns: ["Description", "Machine ID", "Factors to Consider", "Examples"]
        schema_encoding: >
          Flexible standards have no dedicated schema type. Encode in rule_schema.json
          as deontic=obligation with weight=informational and priority=advisory.
          Detection failure produces an informational finding only — advisory, not a
          violation. This preserves deontic clarity (obligation/prohibition/permission)
          while giving policy authors a legitimate home for soft goals.

  - id: sanctions
    title: "Sanctions & Remedies"
    required: true
    content_type: table
    columns: ["Violation Context", "Enforcement Action", "Remediation Path"]
    guidance: "Explicitly state the consequences of non-compliance."

  - id: references
    title: "References & Annexes"
    required: false
    content_type: prose_or_table
    guidance: "External sources, historical context, or supplementary data."
