# hermetic_boundary.yaml
# Normative source for hermetic compilation boundary invariants.
# Contract for hermetic compilation boundary invariants.

contract_id: "compilation.hermetic_boundary"
schema_version: "1.0.0"
design_contract_version: "1.3.0"
owner_component: "compilation_application"
state_machine_ref: "../../state/state_machine_003_compilation_pipeline.puml"
description: >
  Defines the invariants that ensure compilation is hermetic — fully
  reproducible given identical inputs. The frozen environment captures
  all external dependencies that could affect compilation output.

frozen_environment:
  description: "All dimensions that must be pinned for reproducibility"
  schema:
    type: "object"
    required_fields:
      - field: "engine_version"
        type: "semver"
        description: "Version of the compilation engine"
      - field: "toolchain"
        type: "object"
        subfields:
          - field: "compiler"
            type: "string"
          - field: "os_runtime_hash"
            type: "sha256"
            description: >
              Digest over OS image/runtime identity inputs used at compile time
              (container image digest and/or uname + libc identity as documented
              by the implementation). Opaque single field is allowed only when
              its preimage inputs are listed in toolchain.runtime_preimage.
          - field: "runtime_preimage"
            type: "array of string"
            description: "Explicit list of inputs folded into os_runtime_hash"
          - field: "re2_engine_version"
            type: "string"
            description: "RE2 / regex engine version (AA-07 canary-aligned)"
          - field: "json_canonicalization_lib"
            type: "string"
            description: "Library+version used for canonical JSON (hash inputs)"
          - field: "hash_algorithm"
            type: "string"
            description: "Must be SHA-256 for design_contract_version 1.1.0"
      - field: "python_hash_seed"
        type: "integer"
        description: >
          Pin PYTHONHASHSEED to a fixed non-null integer. The compile process
          MUST verify os.environ["PYTHONHASHSEED"] is set and matches this pin
          at startup (fail compile_time_validation if unset). Hash seed alone
          does NOT guarantee iteration order — ordered_collection_policy MUST
          be "sorted" for all hash-participating collections (HERM-008).
      - field: "json_canonicalization_lib_digest"
        type: "sha256 | null"
        description: >
          Optional but recommended: SHA-256 of the canonical JSON library
          wheel/artifact. Version strings alone can hide rebuild drift;
          when present, folded into frozen_env_hash.
      - field: "locale"
        type: "string"
        default: "C.UTF-8"
        description: >
          Locale pinned to C.UTF-8 (or equivalent POSIX locale) to prevent
          locale-dependent string comparisons and formatting in the compile path.
      - field: "datetime_wall_clock_policy"
        type: "string"
        enum: ["forbidden", "pinned"]
        default: "forbidden"
        description: >
          COMPILE path only — not inspector/runtime HLC wall clock.
          Compile path MUST NOT call datetime.now() or read wall clock.
          Production compilations MUST use "forbidden". "pinned" is permitted
          only for offline/forensic reproduction: the orchestrator injects a
          single fixed compile-start timestamp in
          pinned_compile_start_timestamp, the compile path MUST consume that
          injected value (never the live clock), and the value MUST be
          excluded from the snapshot hash exactly like compiled_at (HERM-006).
          A "pinned" environment without pinned_compile_start_timestamp is
          non-conformant (INV-HB-007). Runtime HLC (inspection, finding events)
          ALWAYS advances with the live wall clock (INV-HB-012).
      - field: "pinned_compile_start_timestamp"
        type: "datetime (ISO 8601, UTC) | null"
        default: null
        description: >
          Required (non-null) when datetime_wall_clock_policy = "pinned";
          MUST be null when policy is "forbidden". Single timestamp injected
          at compile start; MUST NOT be re-read from the wall clock and MUST
          NOT be included in frozen_env_hash or cg_ir_snapshot_hash (same
          treatment as compiled_at per HERM-006 / INV-CP-033).
      - field: "ordered_collection_policy"
        type: "string"
        enum: ["sorted"]
        default: "sorted"
        description: >
          Production MUST use "sorted" for every set/dict that participates in
          hash computation. insertion_order is removed as a production option
          because it is not enforceable across processes without sorted keys.
          (INV-CP-032 already requires sorted depends_on.)
      - field: "confidence_severity_cap_threshold"
        type: "number"
        default: 0.5
        description: "Confidence threshold below which severity is capped at informational"
      - field: "conflicts_domain_version"
        type: "semver | string"
        description: >
          Version of the shared conflicts_domain library (ResolveConflict) used
          at compile time. MUST match the version loaded by inspection deployables
          when compile and inspect are split (INV-PR-002). Included in
          frozen_env_hash so snapshot provenance records the conflict algorithm pin.
      - field: "frozen_env_hash"
        type: "sha256"
        description: "SHA-256 of the above object (excluding this field itself)"

  hash_computation: >
    frozen_env_hash = SHA-256(canonical_json(frozen_env minus frozen_env_hash field))
    The hash input is the frozen environment object with the frozen_env_hash key excluded.
    Implementations MUST NOT include frozen_env_hash in its own computation.
    Missing required toolchain pins MUST fail compile_time_validation (HERM-001),
    not be silently absorbed into an opaque os_runtime_hash alone.

runtime_enforcement:
  description: >
    Hermeticity is a compile-time property of inputs and environment pins.
    Runtime MUST also prevent network and ambient IO during hermetic compile.
  rules:
    - "Hermetic compile CPU work MUST run with network egress denied (sandbox, netns, or equivalent)"
    - "Evaluators and compile stages MUST NOT perform network IO; AA-03/AA-07 validate purity"
    - "Doctrine files MUST NOT be loaded at compile time (INV-CP-062)"
  compile_sandbox_deployment: >
    When the application runs as a single StatefulSet pod, compile CPU work
    MUST still be isolated: (1) subprocess with PR_SET_NO_NEW_PRIVS + seccomp
    deny-network, or (2) dedicated compile sidecar container in the same pod
    with NetworkPolicy egress deny, or (3) separate compile worker deployable.
    Sharing the api process address space without a sandbox is non-conformant
    for production (INV-HB-011). Deployment MUST document which option is used.
  nondeterministic_call_denylist:
    description: >
      AA-08 static analysis / sandbox MUST reject the full denylist, not only
      datetime.now().
    symbols:
      - "datetime.datetime.now"
      - "datetime.datetime.utcnow"
      - "time.time"
      - "time.time_ns"
      - "time.monotonic"
      - "time.perf_counter"
      - "os.urandom"
      - "random.*"
      - "uuid.uuid4"
      - "uuid.uuid1"
      - "socket.gethostname"
      - "socket.getaddrinfo"
    notes: >
      Reflection-based or C-extension clock reads MAY evade AST analysis;
      AA-07 runtime canary on a known payload is required in addition to AST.

inspection_live_attestation:
  description: >
    Compile-time pins are necessary but not sufficient. The inspector process
    MUST attest its live engine against the CG-IR frozen_env before evaluation.
  rules:
    - >
      Before evaluate stage, inspections_application MUST compute
      engine_runtime_attestation = {re2_engine_version, conflicts_domain_version,
      python_hash_seed, hash_algorithm, engine_version} from the live process
      and refuse to load a snapshot when attestation is inconsistent with the
      snapshot's frozen_environment (error: EnginePinMismatch).
    - >
      When compile and inspect are split deployables, both MUST load the same
      conflicts_domain wheel (version + digest when available). Inspector is the
      enforcement point at load time (INV-HB-010).
    - "Mismatch MUST fail the inspection (not silently evaluate with different semantics)"

runtime_preimage_minimum:
  description: "Minimum inputs that MUST appear in toolchain.runtime_preimage"
  required_entries:
    - "container_image_digest or explicit compile-path file set digests"
    - "python_interpreter_version + build_id"
    - "libc identity (e.g. glibc version)"
    - "locale (LC_CTYPE)"
    - "re2_engine_version"
    - "json_canonicalization_lib (+ digest when present)"
  rules:
    - "Hostname and wall-clock MUST NOT be in preimage"
    - "A single opaque digest without listing these categories is non-conformant"

hermeticity_rules:
  - id: "HERM-001"
    statement: "Compilation is reproducible only when the entire environment is frozen"
    enforcement: "compile_time_validation"

  - id: "HERM-002"
    statement: "The frozen environment hash MUST be recorded in CG-IR provenance"
    enforcement: "publish_stage"

  - id: "HERM-003"
    statement: "To reproduce: pin all frozen_env dimensions"
    enforcement: "documentation"

  - id: "HERM-004"
    statement: "Once published, CG-IR snapshot is immutable"
    enforcement: "content_addressed_store"

  - id: "HERM-006"
    statement: "compiled_at MUST NOT be included in snapshot hash (execution artifact metadata only)"
    enforcement: "snapshot_hash_computation"

  - id: "HERM-007"
    statement: "Given identical directive graph content, engine version, and frozen environment, the snapshot hash is identical regardless of wall clock time"
    enforcement: "determinism_guarantee"

  - id: "HERM-008"
    statement: >
      frozen_environment MUST pin python_hash_seed (non-null integer),
      locale (C.UTF-8 or equivalent), datetime_wall_clock_policy,
      ordered_collection_policy ("sorted" only in production), and
      conflicts_domain_version. datetime_wall_clock_policy MUST be "forbidden"
      for all production compilations; "pinned" is allowed only when
      pinned_compile_start_timestamp is present and excluded from all snapshot
      hashes. Absence of any required pin is non-conformant and MUST fail
      compile_time_validation. Compile process MUST verify PYTHONHASHSEED at
      startup.
    enforcement: "compile_time_validation (AA-08)"

  - id: "HERM-009"
    statement: >
      conflicts_domain_version MUST be present in frozen_environment and folded
      into frozen_env_hash. When compilation and inspection are split deployables,
      both MUST load the same conflicts_domain library version recorded here.
    enforcement: "compile_time_validation + release_engineering"

  - id: "HERM-010"
    statement: >
      Inspector MUST live-attest engine pins against frozen_environment before
      evaluate (inspection_live_attestation); EnginePinMismatch fails inspection
    enforcement: "inspections_application"

  - id: "HERM-011"
    statement: >
      AA-08 MUST scan the nondeterministic_call_denylist (not only datetime.now)
      and AA-07 canary MUST verify hash stability on a known payload in the
      production image
    enforcement: "certification_tool AA-07/AA-08"

version_incompatibility:
  description: "How version mismatches are handled"
  rules:
    - scenario: "Engine version < CG-IR schema version"
      behavior: "Reject with error: 'Engine too old for this CG-IR'"
    - scenario: "Engine version > CG-IR schema version"
      behavior: "Accept if backward-compatible; otherwise reject"
    - scenario: "Policy version != Schema policy_contract_version"
      behavior: "Reject with warning; require synchronization"
    - scenario: "Frozen env mismatch"
      behavior: "Reject with error: 'Cannot reproduce without exact frozen_env'"

  downgrade_policy: "Downgrades are not supported. The system only moves forward. Legacy CG-IR snapshots remain reproducible with pinned engine versions."

reproducibility:
  description: "How to reproduce any historical inspection"
  required_dimensions:
    - "directive_graph_version"
    - "cg_ir_hash (cg_ir_snapshot_hash)"
    - "frozen_env_hash"
    - "engine_version"
    - "target_hash"
  formula: >
    system_state_hash = SHA-256(canonical_json({
      directive_graph_version, cg_ir_hash, frozen_env_hash,
      engine_version, target_hash
    }))
  notes: >
    system_state_hash captures inspection reproducibility, NOT event stream
    ordering. Event ordering is guaranteed by HLC and recorded independently
    in the Finding Event Stream.

invariants:
  - id: "INV-HB-001"
    statement: "frozen_env_hash MUST NOT include itself in its own computation"
    enforcement: "hash_computation"

  - id: "INV-HB-002"
    statement: "All provenance fields MUST be canonicalized before inclusion in hash"
    enforcement: "compile_time_validation"

  - id: "INV-HB-003"
    statement: "NaN and Infinity are NOT permitted in frozen environment or evaluator configs"
    enforcement: "compile_time_validation"

  - id: "INV-HB-004"
    statement: "confidence_severity_cap_threshold defaults to 0.5 if not specified"
    enforcement: "frozen_environment_schema"

  - id: "INV-HB-005"
    statement: >
      Compile path MUST NOT rely on unordered set/dict iteration for any
      value that participates in hash computation; implementations MUST
      sort keys/members (or use insertion-order containers with a fixed
      construction order) under ordered_collection_policy
    enforcement: "compile_time_validation (HERM-008)"

  - id: "INV-HB-006"
    statement: >
      runtime_preimage MUST enumerate every input folded into os_runtime_hash;
      an opaque os_runtime_hash without an exhaustive preimage list is
      non-conformant (AA-08)
    enforcement: "compile_time_validation (AA-08)"

  - id: "INV-HB-007"
    statement: >
      datetime_wall_clock_policy = "pinned" REQUIRES a non-null
      pinned_compile_start_timestamp injected at compile start; the injected
      value MUST NOT be re-read from the wall clock and MUST be excluded from
      frozen_env_hash and cg_ir_snapshot_hash. Production compilations MUST
      use "forbidden" (HERM-008).
    enforcement: "compile_time_validation (AA-08)"

  - id: "INV-HB-008"
    statement: >
      ordered_collection_policy MUST be "sorted" for production; python_hash_seed
      pin alone is insufficient for iteration-order determinism
    enforcement: "compile_time_validation (HERM-008)"

  - id: "INV-HB-009"
    statement: >
      runtime_preimage MUST include at least runtime_preimage_minimum categories;
      opaque single digest without categories is non-conformant
    enforcement: "compile_time_validation (AA-08)"

  - id: "INV-HB-010"
    statement: >
      Inspector live attestation of re2_engine_version, conflicts_domain_version,
      python_hash_seed, and engine_version MUST pass before evaluate (HERM-010)
    enforcement: "inspections_application"

  - id: "INV-HB-011"
    statement: >
      Production compile CPU work MUST run under compile_sandbox_deployment
      isolation with network egress denied
    enforcement: "deployment + compilation_application"

  - id: "INV-HB-012"
    statement: >
      Compile wall-clock policy MUST NOT pin inspector/runtime HLC; runtime HLC
      advances with live wall clock
    enforcement: "hlc + inspections_application"

  - id: "INV-HB-013"
    statement: >
      Schema x-cg-ir-hashing field set and runtime hash field set MUST be
      compared in CI; drift fails the build
    enforcement: "ci_hash_set_alignment"

stories:
  - story_id: "US-HB-001"
    as: "compilation_application"
    i_want: "to guarantee compilation reproducibility via frozen environment"
    so_that: "any historical CG-IR snapshot can be exactly reproduced"
    acceptance_criteria:
      - "Given identical directive graph + engine version + frozen env. When compilation runs at different times. Then both produce identical cg_ir_snapshot_hash."
      - "Given a frozen environment. When frozen_env_hash is computed. Then the hash excludes the frozen_env_hash field itself."

  - story_id: "US-HB-002"
    as: "compilation_application"
    i_want: "to reject version incompatibilities at compile time"
    so_that: "incompatible artifacts are never mixed"
    acceptance_criteria:
      - "Given an engine version < CG-IR schema version. When compilation is attempted. Then the compilation is rejected with 'Engine too old for this CG-IR'."
      - "Given a frozen env mismatch. When reproduction is attempted. Then the attempt is rejected with 'Cannot reproduce without exact frozen_env'."
      - "Given a policy version != schema policy_contract_version. When compilation is attempted. Then a warning is issued and synchronization is required."
