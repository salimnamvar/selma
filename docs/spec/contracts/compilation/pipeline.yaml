# pipeline.yaml
# Normative source for the compilation pipeline contract.
# Contract for the compilation pipeline.

contract_id: "compilation.pipeline"
schema_version: "1.0.0"
design_contract_version: "1.1.0"
owner_component: "compilation_application"
state_machine_ref: "../../state/sm_003_compilation_pipeline.puml"
description: >
  Defines the canonical transformation pipeline from Directive Graph to
  CG-IR snapshot. Each stage has defined inputs, outputs, invariants,
  and error handling behavior.

pipeline:
  - order: 1
    name: "ingest"
    description: "Parse directive tables and extract structured directives"
    input: "Policy Document (prose + directive tables)"
    output: "Directive Graph (structured, versioned)"
    operations:
      - "Parse directive tables from policy document"
      - "Extract: Machine ID, deontic, subject, predicate, Description, Context"
      - "Assign lineage_id from Machine ID (bijective at root level)"
      - "Assign execution_id (equals lineage_id on first creation)"
    invariants:
      - id: "INV-CP-001"
        statement: "Every Machine ID in policy MUST map to exactly one lineage_id root"
      - id: "INV-CP-002"
        statement: "lineage_id MUST match pattern ^[A-Z]{2,5}-\\d{3}[A-Z]?$"
    error_handling: "abort_with_detailed_reason"
    story_refs: ["US-CP-001"]

  - order: 2
    name: "resolve_identity"
    description: "Resolve directive identity and validate lineage"
    input: "Directive Graph"
    output: "Rule Schema (machine-readable)"
    operations:
      - "Ensure Machine ID = rule.lineage_id (immutable root)"
      - "Ensure rule.id = directive_id (active execution identity)"
      - "Validate lineage operations (fork/merge/split)"
      - "Run lineage DAG validation (acyclicity, depth ≤ 64)"
      - "Validate metadata.audit.authored_by is non-empty"
    invariants:
      - id: "INV-CP-010"
        statement: "Lineage DAG MUST be acyclic with max depth 64"
      - id: "INV-CP-011"
        statement: "Every active rule MUST have non-empty metadata.audit.authored_by"
      - id: "INV-CP-012"
        statement: "Execution ID MUST be globally unique within ruleset"
      - id: "INV-CP-013"
        statement: "(lineage_id, id) pair MUST be unique within ruleset"
    error_handling: "abort_with_detailed_reason"
    story_refs: ["US-CP-001", "US-ID-001"]

  - order: 3
    name: "validate_schema"
    description: "Structural and semantic validation of rule schema"
    input: "Rule Schema"
    output: "Validated Rule Schema"
    operations:
      - "JSON Schema structural validation (Draft 2020-12 first-pass)"
      - "Custom detection complexity validator (depth ≤ 32, nodes ≤ 256, width ≤ 64)"
      - "Regex pattern RE2 compatibility check (length ≤ 4096)"
      - "detection.strategy ↔ active *_spec AST-walking discriminator validation"
      - "adapters[].adapter_id registered and adapter_config shape validation"
      - "Metadata size check (≤ 16,384 bytes)"
      - "UTC-only timestamp validation"
      - "Finite numeric validation (no NaN/Infinity)"
      - "Regex flags whitelist check (^[ims]*$)"
    invariants:
      - id: "INV-CP-020"
        statement: "Custom complexity validator MUST execute AFTER JSON Schema and BEFORE CG-IR generation"
      - id: "INV-CP-021"
        statement: "detection.strategy MUST match the active detection sub-object (structural_spec | semantic_spec | pattern_spec | composite_spec | external_spec | manual_spec); AST-walking discriminator is the normative gate"
      - id: "INV-CP-022"
        statement: "All regex patterns MUST be RE2-compatible"
    error_handling: "reject_with_schema_errors"
    story_refs: ["US-CP-002"]

  - order: 4
    name: "compile_cgir"
    description: "Generate CG-IR nodes and edges from validated rules"
    input: "Validated Rule Schema"
    output: "CG-IR Snapshot (immutable)"
    operations:
      - "For each rule: generate control node with pure detection evaluation"
      - "Map rule fields (deontic, subject, predicate, detection, paired_policy_ref) to CG-IR node fields"
      - >
        paired_policy_ref is taken from the dual-document directive envelope
        (not invented at compile). It is included in node_body so node_hash
        differs when doctrine pin changes even if executable detection is identical.
        Parameters overrides (amendment.yaml) are merged into detection before hash —
        the post-merge detection_spec is what enters node_body / node_hash.
      - "Resolve depends_on references (execution IDs, not lineage_ids)"
      - "Apply conflict resolution mapping (snapshot-bound defer_to; see conflict/precedence.yaml)"
      - "Compute node_hash (dual hash: semantic_hash + presentation_hash)"
      - "Compute edge_hash for each dependency"
      - "Validate frozen_environment pins (HERM-008): python_hash_seed, locale, datetime_wall_clock_policy, ordered_collection_policy"
      - "Assert ordered iteration for all collections that participate in hash computation (sorted keys / sorted set members)"
      - "Pin frozen environment hash"
      - "Compute cg_ir_snapshot_hash"
      - "Store in content-addressed store"
    invariants:
      - id: "INV-CP-030"
        statement: "CG-IR snapshot MUST be immutable once published"
      - id: "INV-CP-031"
        statement: "node_hash depends on node_body only; no graph context embedded"
      - id: "INV-CP-032"
        statement: "depends_on MUST contain sorted directive_id references (execution IDs)"
      - id: "INV-CP-033"
        statement: "compiled_at MUST NOT be included in snapshot hash"
      - id: "INV-CP-034"
        statement: "DAG MUST be acyclic (cycle detection at compile time)"
      - id: "INV-CP-035"
        statement: >
          Compile path MUST pin python_hash_seed and locale, forbid wall-clock
          reads (datetime_wall_clock_policy=forbidden), and use ordered
          collection iteration for every value folded into cg_ir_snapshot_hash
          (extends INV-CP-032; see hermetic_boundary HERM-008)
    error_handling: "abort_with_detailed_reason"
    story_refs: ["US-CP-001"]

  - order: 5
    name: "incremental_reuse"
    description: "Reuse unchanged subgraphs from previous snapshots"
    input: "Current CG-IR nodes + Previous snapshot"
    output: "Optimized CG-IR Snapshot"
    operations:
      - "Compute set of changed lineage_ids vs previous snapshot"
      - "Mark changed nodes and all transitive dependents as dirty"
      - "Recompute dirty nodes"
      - "Reuse unchanged node_hash values from previous snapshot"
      - "Recompute edge hashes for dirty nodes"
      - "Recompute snapshot hash"
    invariants:
      - id: "INV-CP-040"
        statement: "If node_body is byte-identical across compilations, node_hash MUST be identical"
      - id: "INV-CP-041"
        statement: "Incremental reuse MUST NOT lose conflict resolution metadata"
    error_handling: "abort_with_detailed_reason"
    story_refs: ["US-CP-003"]

  - order: 6
    name: "publish"
    description: "Publish snapshot and record provenance"
    input: "CG-IR Snapshot"
    output: "Published CG-IR Snapshot + Provenance Record"
    operations:
      - "Record frozen_env_hash in provenance"
      - "Record engine_version in provenance"
      - "Record directive_graph_version in provenance"
      - "Record lineage_validation result in provenance"
      - "Record creator_provenance per node (excluded from node_body hash)"
      - "Publish snapshot as immutable"
      - "Deduplicate if identical snapshot already exists"
    invariants:
      - id: "INV-CP-050"
        statement: "All provenance fields MUST be canonicalized before hash computation"
      - id: "INV-CP-051"
        statement: "Identical directive graph + engine version + frozen env = identical snapshot hash (determinism)"
      - id: "INV-CP-052"
        statement: "creator_provenance MUST be excluded from node_body hash"
    error_handling: "abort_with_detailed_reason"
    story_refs: ["US-CP-001", "US-CP-003"]
concurrency_model:
  description: "Locking semantics for compilation"
  rules:
    - "Compilation acquires read lock via SELECT ... FOR SHARE on Directive Graph rows"
    - "Outbox drain claims rows via SELECT ... FOR UPDATE SKIP LOCKED (lease claim; see data_stores.directives compile_coordination.claim_lease)"
    - "Concurrent compilations are allowed (read-only)"
    - "Directive modifications acquire write lock (exclusive)"
    - "Write lock blocks compilation; compilation blocks writes"
    - "Write lock uses FIFO queue ordering (writer-preference)"
    - "Compilation holds read locks only; no lock type inversion"
  deadlock_prevention:
    - "No circular wait: dependency is strictly read_lock → optional write_lock"
    - "Engines MUST NOT hold write lock while awaiting compilation"
    - "Queue position and lock holder identity MUST be observable"
  lock_implementation:
    - "PostgreSQL: SELECT ... FOR SHARE (or REPEATABLE READ snapshot) while loading executable documents"
    - "Release locks after documents are fully read into the hermetic boundary; compile CPU work is lock-free"
    - "Directive writers use exclusive locks / write_lock; writer-preference FIFO as above"
  outbox:
    - "Compile work is enqueued via directives_store compile_request outbox (see data_stores.directives compile_coordination)"
    - "Worker deduplicates by (lineage_id, revision)"
  concurrency_bounds:
    - "Maximum concurrent in-process compile workers per Application replica: 2 (recommended default, environment-configurable; see deployment/README.md concurrency notes)"
    - "Compile workers MUST use a fixed-size worker pool/semaphore (no unbounded goroutine/thread fan-out on outbox drain)"
    - "When the pool is saturated, outbox drain MUST NOT block the API thread; requests remain pending and are claimed by the next free worker or a later reconciliation pass"
    - "Compile CPU work MUST be pinned or cgroup-limited in production to isolate from API request handling (deployment/README.md CPU isolation)"
    - "Outbox depth backpressure: see data_stores.directives compile_coordination.backpressure (503 CompileQueueFull)"
    - "lock_wait_timeout: write-lock acquisition MUST time out (default 5s, max 30s, environment-configurable); on timeout the mutation returns 503 UpstreamTimeout without partial state change"

invariants:
  - id: "INV-CP-060"
    statement: "Compilation is reproducible only when entire environment is frozen"
    enforcement: "hermetic_boundary"

  - id: "INV-CP-061"
    statement: "Two compilations of identical directive graph + engine + frozen_env produce identical snapshot hash"
    enforcement: "content_addressed_store"

  - id: "INV-CP-062"
    statement: "Policy doctrine MUST NOT be loaded at compile time (compile-time-only: authors and validators)"
    enforcement: "architectural_audit (AA-02)"

stories:
  - story_id: "US-CP-001"
    as: "compilation_application"
    i_want: "to compile directives into immutable CG-IR snapshots"
    so_that: "evaluation is deterministic and reproducible"
    acceptance_criteria:
      - "Given a valid Directive Graph. When compilation completes. Then a new CG-IR snapshot is published with content-addressed hash."
      - "Given identical directive graph + engine version + frozen env. When compilation runs twice. Then both produce identical cg_ir_snapshot_hash."
      - "Given a published CG-IR snapshot. When any mutation is attempted. Then the mutation is rejected (immutability)."

  - story_id: "US-CP-002"
    as: "compilation_application"
    i_want: "to validate schema before any CG-IR generation"
    so_that: "invalid directives never reach the execution layer"
    acceptance_criteria:
      - "Given a rule with detection.strategy 'pattern' but only structural_spec present. When schema validation runs. Then the rule is rejected with SchemaError (detection strategy mismatch)."
      - "Given a rule with composite detection depth > 32. When the custom complexity validator runs. Then the rule is rejected with SchemaError."
      - "Given a rule with non-UTC timestamp. When validation runs. Then the rule is rejected with SchemaError."

  - story_id: "US-CP-003"
    as: "compilation_application"
    i_want: "to reuse unchanged subgraphs during incremental compilation"
    so_that: "compilation is efficient for large directive sets"
    acceptance_criteria:
      - "Given a directive set where only one rule changed. When incremental compilation runs. Then unchanged nodes reuse their previous node_hash values."
      - "Given a node with only presentation fields changed. When incremental compilation runs. Then semantic_hash is preserved and downstream detection subgraphs are reused."
