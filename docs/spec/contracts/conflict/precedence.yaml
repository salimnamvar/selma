# precedence.yaml
# Normative source for conflict resolution precedence rules.
# Contract for conflict resolution precedence rules.

contract_id: "conflict.precedence"
schema_version: "1.0.0"
design_contract_version: "1.3.0"
owner_component: "compilation_application"
state_machine_ref: "../../state/state_machine_005_conflict_resolution.puml"
description: >
  Defines the unified conflict resolution function and precedence chain.
  Override > priority > specificity > recency. Explicit override takes
  precedence over all computed factors.
  Note: ResolveConflict domain service implements this contract.

resolution_algorithm:
  description: "resolve_conflict(rule_a, rule_b) → winning_rule | Conflict Artifact"
  steps:
    - step: 1
      name: "Explicit Override (single-sided)"
      description: >
        If only one rule has conflict_resolution, apply its strategy.
        Strategies: always_wins, never_wins, defer_to.
        If strategy resolves to a winning rule, return it.
        If null (defer_to target not found), fall through to Step 2.
      substeps:
        - "1a. if rule_a has conflict_resolution and rule_b does not: apply strategy"
        - "1b. if rule_b has conflict_resolution and rule_a does not: apply strategy"

    - step: "1b"
      name: "Dual Explicit Overrides"
      description: >
        If both rules have conflict_resolution, check for compatible pairs.
        Compatible pairs: {always_wins, never_wins} and identical defer_to targets.
        Incompatible pairs: escalate to Conflict Artifact.

    - step: 2
      name: "Computed Resolution"
      description: "When no explicit override applies"
      substeps:
        - "2a. Priority: lower priority_level number wins"
        - "2b. Specificity: higher specificity_score wins"
        - "2c. Recency: newer created_at wins"

    - step: 3
      name: "Unresolvable"
      description: "If all factors tie, return Conflict Artifact for human review"

priority_levels:
  description: "Schema priority enum → internal integer mapping"
  mapping:
    - enum: "constitutional"
      level: 1
    - enum: "statutory"
      level: 2
    - enum: "regulatory"
      level: 3
    - enum: "operational"
      level: 4
    - enum: "advisory"
      level: 5
  notes: "Enum values are presentation; all comparisons use priority_level integers"

specificity_score:
  description: "Normative specificity score algorithm"
  formula: >
    specificity_score(node) =
      scope_specificity_score(scope) * 100 + count_bound_fields(evaluator)
  components:
    - component: "scope_specificity_score"
      formula: >
        (1 if target_type != "any" else 0) +
        (1 if domain is non-empty else 0) +
        (1 if jurisdiction is non-empty else 0) +
        length(normalized_filters)
      notes: >
        Rules with no scope have score 0. filters MUST be normalized before
        counting: sort by canonical JSON key order of each filter object (or
        sorted unique string keys if map-shaped) so length() is order-insensitive
        and identical scopes always yield identical scores (INV-PR-002).
    - component: "count_bound_fields"
      formula: >
        Count required evaluator config fields recursively.
        regex=1, field_check=3, threshold=3, composite=sum(children).
      notes: "Composite evaluators sum child scores"
  determinism: "Two engines MUST produce identical scores for identical CG-IR node bodies"

compatible_overrides:
  description: "When dual explicit overrides can resolve deterministically"
  rules:
    - pair: "{always_wins, never_wins}"
      result: "always_wins rule wins"
      compatible: true
    - pair: "identical defer_to targets"
      result: "Resolve to target if active"
      compatible: true
    - pair: "any other combination"
      result: "Conflict Artifact (incompatible)"
      compatible: false

defer_to_resolution:
  description: >
    How defer_to strategy resolves. Resolution is strictly snapshot-bound:
    ONLY nodes present in the current CG-IR snapshot may be considered.
    Implementations MUST NOT query directives_store or any mutable store at
    evaluation or compile-time resolve_conflict time (hermetic AA-02 / INV-PR-002).
  algorithm: >
    1. target_execution_id = strategy.defer_to
    2. If self-reference: ignore override; fall through to computed
    3. If target_execution_id exists as an active node in the CG-IR snapshot: resolve to that node
    4. If target_execution_id is present but deprecated/superseded in the snapshot:
       a. Find all active snapshot nodes with the same lineage_id as the target
          (snapshot membership only — not "current store active")
       b. If exactly one: resolve to it (lineage chain successor frozen at compile)
       c. If zero: ignore override; fall through to computed
       d. If multiple: Conflict Artifact (post-fork ambiguity)
    5. If target_execution_id is not present in the snapshot: ignore override;
       fall through to computed (do not load successors from directives_store)
  compile_time_checks: >
    Compilation SHOULD emit a ConflictArtifact (or compile warning recorded in
    provenance) when a rule's conflict_resolution.defer_to target is missing from
    the compiled graph or when post-fork ambiguity is already visible among
    active snapshot nodes for the target lineage. Detection at compile reduces
    eval-time surprises; eval algorithm remains the authority for runtime pairs.
  cycle_detection: >
    Before applying any defer_to override, run DFS cycle detection
    on the defer_to subgraph within the snapshot. If a cycle is detected,
    ignore only the defer_to edges that participate in the cycle; unaffected
    nodes keep their defer_to. If the implementation cannot isolate cycle
    participants, fall through to computed resolution for the entire conflicting
    pair (safe default). Self-ref is always ignore + fall through.

multi_party_conflict:
  description: >
    Pairwise cascade is insufficient for three-or-more mutually conflicting
    rules within a lineage. ResolveConflict MUST build a conflict graph and
    produce a single topological binding order (or Conflict Artifact if cycle /
    total tie). Transitive loser adjustments MUST be consistent with the
    global order, not sequential independent pair results.

recency_tie_break:
  description: >
    When created_at timestamps are identical, emit Conflict Artifact for
    binding path OR apply deterministic secondary key: execution_id ascending
    (lexicographic). Advisory path uses the same secondary key for recommended
    winner. created_at is server-assigned at directive authoring (api), not
    client wall clock.

cascade_mode:
  description: "binding vs advisory"
  rules:
    - "binding: may mutate within-lineage binding outcomes in CG-IR compile"
    - "read_only / advisory: same cascade algorithm; MUST suppress side effects (no new binding mutation); may still emit AdvisoryConflictArtifact"
    - "ResolveConflict(mode=binding|read_only) is the required API shape"

cross_lineage_advisory:
  description: "Advisory resolution for cross-lineage conflicts"
  algorithm: >
    1. Compute pairwise specificity_score for both rules
    2. Compute priority_level integers
    3. Record created_at timestamps
    4. Apply precedence chain: priority → specificity → recency (+ execution_id tie-break)
    5. Emit AdvisoryConflictArtifact with recommended_winner and resolution_basis
  snapshot_binding: >
    Each advisory stores cg_ir_snapshot_hash (and participating lineage heads).
    When either lineage publishes a new head_snapshot_hash, advisories referencing
    the old snapshot MUST be marked status=stale (invalidation job). Humans are
    notified via telemetry/optional webhook. Stale advisories MUST NOT be acted
    on as current without re-running analysis on the new snapshot.
  ttl: >
    advisory_ttl (default 90 days) after which open advisories may be bulk-closed
    as expired; does not mutate findings. Re-analysis required for new snapshots.
  constraints:
    - "Advisory outcomes MUST NOT modify finding FSM state"
    - "Advisory outcomes MUST NOT be replayed as automatic resolution"
    - "Identical CG-IR snapshot + identical rule pair → identical advisory output"
    - "binding_status = 'advisory' (requires_human_action = true)"
    - "Advisories are snapshot-bound; recompile invalidates (status=stale)"
  human_resolution_path: >
    Humans MAY record a resolution decision on an advisory artifact via
    conflict.resolve (capability-gated) without changing finding FSM state.
    The decision is stored on the artifact (status → resolved, optional notes,
    actor, timestamp). There is no "promote to binding" automatic path —
    binding resolution requires changing directives and recompiling so the
    next CG-IR snapshot encodes the intended override. Advisory artifacts
    that remain open after environment SLA MAY be bulk-closed as "acknowledged"
    for ops hygiene; this still does not mutate findings.

invariants:
  - id: "INV-PR-001"
    statement: "Explicit override takes precedence over all computed factors"
    enforcement: "ResolveConflict"

  - id: "INV-PR-002"
    statement: "Conflict resolution MUST be deterministic for identical CG-IR snapshot"
    enforcement: "ResolveConflict"

  - id: "INV-PR-003"
    statement: "Unresolvable conflicts MUST produce Conflict Artifact (not silent default)"
    enforcement: "ResolveConflict"

  - id: "INV-PR-004"
    statement: "defer_to self-reference MUST be ignored (fall through to computed)"
    enforcement: "ResolveConflict"

  - id: "INV-PR-005"
    statement: "defer_to cycles cause all defer_to overrides in the pair to be ignored"
    enforcement: "ResolveConflict"

  - id: "INV-PR-006"
    statement: "Cross-lineage advisory artifacts MUST NOT auto-modify findings or CG-IR"
    enforcement: "ResolveConflict"

  - id: "INV-PR-007"
    statement: >
      defer_to resolution MUST use only CG-IR snapshot nodes; MUST NOT consult
      directives_store or other mutable state at resolve time
    enforcement: "ResolveConflict + certification_tool (AA-02)"

  - id: "INV-PR-008"
    statement: "Cross-lineage advisories MUST bind cg_ir_snapshot_hash and invalidate on head advance"
    enforcement: "findings_application / artifacts reconciliation"

  - id: "INV-PR-009"
    statement: "Multi-party within-lineage conflicts MUST use a conflict graph, not independent pair folds"
    enforcement: "ResolveConflict"

  - id: "INV-PR-010"
    statement: "Recency ties use execution_id ascending secondary key or Conflict Artifact"
    enforcement: "ResolveConflict"

  - id: "INV-PR-011"
    statement: "read_only cascade mode MUST NOT perform binding mutations"
    enforcement: "ResolveConflict"

stories:
  - story_id: "US-PR-001"
    as: "ResolveConflict"
    i_want: "to resolve conflicts using a deterministic precedence chain"
    so_that: "conflict outcomes are reproducible and auditable"
    acceptance_criteria:
      - "Given two rules with same lineage_id and both Fail. When one has conflict_resolution override. Then the override strategy determines the winner."
      - "Given two rules with no overrides, different priority. When resolve_conflict runs. Then the rule with lower priority_level number wins."
      - "Given two rules with no overrides, same priority, different specificity. When resolve_conflict runs. Then the rule with higher specificity_score wins."
      - "Given two rules that tie on all factors. When resolve_conflict runs. Then a Conflict Artifact is produced for human review."

  - story_id: "US-PR-002"
    as: "ResolveConflict"
    i_want: "to handle defer_to strategies safely"
    so_that: "defer_to never produces cycles or self-references"
    acceptance_criteria:
      - "Given a defer_to that references its own rule id. When resolution runs. Then the override is ignored and computed resolution applies."
      - "Given two defer_to overrides that form a cycle. When resolution runs. Then both overrides are ignored and computed resolution applies."
      - "Given a defer_to referencing a deprecated rule with one active successor in the same CG-IR snapshot. When resolution runs. Then the successor is resolved as the target."
      - "Given a defer_to target absent from the CG-IR snapshot. When resolution runs. Then the override is ignored (no directives_store lookup)."
