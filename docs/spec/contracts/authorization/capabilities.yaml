# capabilities.yaml
# Normative source for the capability catalog.
# Contract for the capability catalog.

contract_id: "authorization.capabilities"
schema_version: "1.0.0"
design_contract_version: "1.3.0"
owner_component: "api"
description: >
  Defines the complete capability catalog for the Selma system.
  Capabilities are the atomic units of authorization — each action
  maps to exactly one capability.

capabilities:
  directive:
    - cap_id: "directive.create"
      description: "Create a new directive"
      enforcement_gate: "directive_mutations"
      failure: "403 CapabilityDenied"
    - cap_id: "directive.modify"
      description: "Modify an existing directive (new revision)"
      enforcement_gate: "directive_mutations"
      failure: "403 CapabilityDenied"
    - cap_id: "directive.retire"
      description: "Retire a directive (deprecated status)"
      enforcement_gate: "directive_mutations"
      failure: "403 CapabilityDenied"
    - cap_id: "directive.fork"
      description: "Fork a directive into two distinct directives"
      enforcement_gate: "directive_mutations"
      failure: "403 CapabilityDenied"
    - cap_id: "directive.merge"
      description: "Merge two directives into one"
      enforcement_gate: "directive_mutations"
      failure: "403 CapabilityDenied"
    - cap_id: "directive.restore"
      description: "Restore directive to a previous revision"
      enforcement_gate: "directive_mutations"
      failure: "403 CapabilityDenied"

  inspection:
    - cap_id: "inspection.submit"
      description: "Submit a target for inspection"
      enforcement_gate: "inspection_submit"
      failure: "403 CapabilityDenied"
    - cap_id: "inspection.reinspect"
      description: "Reinspect a previously inspected target"
      enforcement_gate: "inspection_submit"
      failure: "403 CapabilityDenied"
    - cap_id: "inspection.view"
      description: >
        Read inspection resources and inspection-scoped artifacts
        (GET /inspections/{id}, inspection snapshots/traces). Distinct from
        finding.view so artifact-router misrouting cannot grant inspection
        read via findings capabilities alone.
      enforcement_gate: "inspection_view"
      failure: "403 CapabilityDenied"

  finding:
    - cap_id: "finding.view"
      description: "View findings"
      enforcement_gate: null
      failure: null
    - cap_id: "finding.acknowledge"
      description: "Acknowledge a finding (Open → Acknowledged)"
      enforcement_gate: "finding_fsm_transitions"
      failure: "403 CapabilityDenied"
    - cap_id: "finding.dismiss"
      description: >
        Dismiss a finding as invalid (Open | Acknowledged | Evidence Submitted |
        Pending Verification | Rejected → Dismissed)
      enforcement_gate: "finding_fsm_transitions"
      failure: "403 CapabilityDenied"
    - cap_id: "finding.waive"
      description: >
        Waive a finding as accepted risk (Open | Acknowledged | Evidence Submitted |
        Pending Verification | Rejected → Waived)
      enforcement_gate: "finding_fsm_transitions"
      failure: "403 CapabilityDenied"
      sod_check: "creator_cannot_waive"
    - cap_id: "finding.approve_remediation"
      description: "Approve remediation evidence (Pending Verification → Verified)"
      enforcement_gate: "finding_fsm_transitions"
      failure: "403 CapabilityDenied"
      sod_check: "submitter_cannot_approve"
    - cap_id: "finding.reject_remediation"
      description: "Reject remediation evidence (Pending Verification → Rejected)"
      enforcement_gate: "finding_fsm_transitions"
      failure: "403 CapabilityDenied"
    - cap_id: "finding.reopen"
      description: >
        Reopen a finding after remediation rejection (Rejected → Open).
        Distinct from finding.reject_remediation. Requires mandatory comments.
      enforcement_gate: "finding_fsm_transitions"
      failure: "403 CapabilityDenied"
    - cap_id: "finding.supersede"
      description: >
        Mark finding as superseded (Open | Acknowledged | Evidence Submitted |
        Pending Verification | Rejected → Superseded)
      enforcement_gate: "finding_fsm_transitions"
      failure: "403 CapabilityDenied"
      sod_check: "creator_cannot_supersede"
    - cap_id: "audit.view"
      description: >
        Read denial-audit and finding-event audit streams (meta-audit).
        Separate from finding.view so operational viewers cannot read
        full capability-denial telemetry without an auditor role assignment.
      enforcement_gate: "audit_read"
      failure: "403 CapabilityDenied"

  evidence:
    - cap_id: "evidence.submit"
      description: "Submit remediation evidence"
      enforcement_gate: "finding_fsm_transitions"
      failure: "403 CapabilityDenied"

  analytics:
    - cap_id: "analytics.view"
      description: "View analytics and aggregates"
      enforcement_gate: "analytics"
      failure: "403 CapabilityDenied"

  conflict:
    - cap_id: "conflict.resolve"
      description: "Resolve conflicts between rules"
      enforcement_gate: "conflict_resolution"
      failure: "403 CapabilityDenied"

enforcement_gates:
  - gate: "request_ingress"
    location: "API Gateway / Command Handler"
    description: "All mutating capabilities checked before dispatch"
    failure: "403 CapabilityDenied; no state mutation; audit log entry"

  - gate: "directive_mutations"
    location: "api → directives_application"
    description: "directive.* capabilities checked"
    failure: "Reject before write lock acquired"

  - gate: "inspection_submit"
    location: "api → inspections_application"
    description: "inspection.submit, inspection.reinspect checked"
    failure: "Reject before target validation"

  - gate: "inspection_view"
    location: "api → inspections_application (artifact GET)"
    description: "inspection.view checked for inspection-scoped reads"
    failure: "Reject before artifact I/O; MUST NOT accept finding.view as substitute"

  - gate: "finding_fsm_transitions"
    location: "findings_application"
    description: "Per-transition capability + SoD checks"
    failure: "Reject transition; FSM state unchanged; no event appended"

  - gate: "conflict_resolution"
    location: "ResolveConflict (domain service)"
    description: "conflict.resolve checked"
    failure: "Reject; Conflict Artifact remains open"

  - gate: "analytics"
    location: "findings_application (guidance read model)"
    description: "analytics.view checked"
    failure: "Reject; no aggregate data returned"

  - gate: "audit_read"
    location: "api → findings_application (denied_actions / event audit views)"
    description: "audit.view checked for denial and stream audit reads"
    failure: "Reject; no audit telemetry returned"

failure_semantics:
  rules:
    - "Deny = hard reject; no partial writes, no compensating events"
    - "All denials produce append-only audit record via DenialAuditPort: {actor, capability, action, outcome: denied, timestamp, reason}"
    - "DenialAuditPort is application-owned; implementer finding_events_repository; consumer api only"
    - "Escalation is NOT automatic on denial; caller receives error and decides next action"
    - "Delegation model: not supported in v8.2.2; capabilities bind directly to actor identity"
    - "CapabilityEnforcer is a reusable module used by all driving adapters (not HTTP-only ad-hoc checks)"
    - >
      SoD and rate limits key on natural_person_id when present (see
      authentication.yaml); JWT sub alone MUST NOT be the sole SoD identity
      for multi-account humans

rate_limits:
  description: >
    Per-actor admission control for high-amplification mutating capabilities.
    Complements directives_store write-queue fairness (503 when queue full):
    rate limits reject before lock acquisition so AI agents cannot flood
    admissions until the queue bound is hit.
  identity_key: >
    Prefer natural_person_id when the JWT provides it; otherwise JWT sub.
    Multi-account humans sharing one natural_person_id share one quota bucket
    so SoD-bypass accounts cannot double the rate budget.
  rules:
    - capability: "directive.modify"
      scope: "per natural_person_id (fallback: JWT sub)"
      default_quota:
        max_requests: 30
        window_seconds: 60
      response_on_exceed: "429 RateLimited (retryable: true) with Retry-After"
      notes: >
        Applies to humans and AI agents identically by default. Operators MAY
        configure a lower quota for service accounts / AI agents that bulk-edit
        directives; the default MUST still apply when no agent-specific profile
        is configured. Rate limit is checked at api after capability allow and
        before write_lock. Exceeding the limit MUST NOT enqueue compile work
        and MUST NOT mutate directive revisions.
    - capability: "directive.create"
      scope: "per natural_person_id (fallback: JWT sub)"
      default_quota:
        max_requests: 30
        window_seconds: 60
      response_on_exceed: "429 RateLimited (retryable: true)"
      notes: "Same default as modify; prevents create storms from agents."
    - capability: "finding.waive"
      scope: "per natural_person_id (fallback: JWT sub)"
      default_quota:
        max_requests: 60
        window_seconds: 60
      response_on_exceed: "429 RateLimited (retryable: true) with Retry-After"
      notes: "Bounds append-only growth from waive floods / agent loops."
    - capability: "finding.approve_remediation"
      scope: "per natural_person_id (fallback: JWT sub)"
      default_quota:
        max_requests: 60
        window_seconds: 60
      response_on_exceed: "429 RateLimited (retryable: true)"
    - capability: "finding.dismiss"
      scope: "per natural_person_id (fallback: JWT sub)"
      default_quota:
        max_requests: 60
        window_seconds: 60
      response_on_exceed: "429 RateLimited (retryable: true)"
    - capability: "finding.supersede"
      scope: "per natural_person_id (fallback: JWT sub)"
      default_quota:
        max_requests: 60
        window_seconds: 60
      response_on_exceed: "429 RateLimited (retryable: true)"
    - capability: "finding.reopen"
      scope: "per natural_person_id (fallback: JWT sub)"
      default_quota:
        max_requests: 30
        window_seconds: 60
      response_on_exceed: "429 RateLimited (retryable: true)"
    - capability: "evidence.submit"
      scope: "per natural_person_id (fallback: JWT sub)"
      default_quota:
        max_requests: 60
        window_seconds: 60
      response_on_exceed: "429 RateLimited (retryable: true)"
    - capability: "conflict.resolve"
      scope: "per natural_person_id (fallback: JWT sub)"
      default_quota:
        max_requests: 30
        window_seconds: 60
      response_on_exceed: "429 RateLimited (retryable: true)"
    - capability: "denial_audit_write"
      scope: "per natural_person_id (fallback: JWT sub) and global bulkhead"
      default_quota:
        max_requests: 120
        window_seconds: 60
      response_on_exceed: >
        429 RateLimited; DenialAuditPort MUST aggregate or drop with metric
        (never unbounded append). Dedicated connection pool bulkhead from
        FindingEventRepository path.
      notes: >
        Capability denials themselves are rate-limited so invalid-capability
        floods cannot DoS the finding_events_store connection pool.
  interaction_with_fairness: >
    Rate limit (429) is the first backpressure signal. If a request is admitted
    but the directives_store writer-preference queue is full, the store returns
    503 (fail-fast). Clients MUST treat 429 as retry-with-backoff and 503 as
    system-overloaded; do not tight-loop either.

invariants:
  - id: "INV-CA-001"
    statement: "All actions MUST be checked against capability matrix at defined enforcement gates"
    enforcement: "capability_gate"

  - id: "INV-CA-002"
    statement: "Denied requests MUST NOT produce partial state mutation"
    enforcement: "enforcement_gate"

  - id: "INV-CA-003"
    statement: "All denials MUST produce append-only audit record"
    enforcement: "audit_log"

  - id: "INV-CA-004"
    statement: >
      High-amplification mutating capabilities listed in rate_limits (including
      directive.create/modify and finding.* dispositions) MUST enforce per-identity
      rate limits before mutation; excess returns 429 RateLimited
    enforcement: "api_rate_limiter"

  - id: "INV-CA-005"
    statement: >
      finding.reopen is a first-class catalog capability; Rejected→Open MUST NOT
      be gated solely by finding.reject_remediation
    enforcement: "capability_catalog + finding_fsm"

  - id: "INV-CA-006"
    statement: >
      inspection.view is required for inspection-scoped artifact reads;
      finding.view MUST NOT authorize inspection artifact GET
    enforcement: "api artifact router"

stories:
  - story_id: "US-CA-001"
    as: "api"
    i_want: "to gate all actions on capability checks"
    so_that: "only authorized actors can perform system actions"
    acceptance_criteria:
      - "Given any action request. When the actor lacks the required capability. Then the action is denied with 403 CapabilityDenied."
      - "Given a denied action. When the denial is processed. Then an audit record is created with actor, capability, action, outcome, timestamp, and reason."
      - "Given a denied action. When the denial completes. Then no partial state mutation has occurred."
