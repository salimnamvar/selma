# gates.yaml
# Normative source for architectural audit certification gates.
# Contract for architectural audit certification gates.

contract_id: "certification.gates"
schema_version: "1.0.0"
design_contract_version: "1.3.0"
owner_component: "certification_tool"
description: >
  Defines the 8 architectural audit gates required for production-grade
  reference implementation certification. Gates are non-blocking for spec
  conformance of the document suite but MUST be satisfied for implementation
  certification.
  Implementation: offline/CI certification_tool (not an in-process C4 peer).
  Results MAY be written to artifacts_store (kind=certification) and read via
  the Artifacts API. There is no in-process certifications Application component.
  Artifact writes use scoped offline credentials (deployment certification_tool
  authentication) — not the JWT capability gate, and not unauthenticated
  object-store access. schema x-cg-ir-hashing vs runtime hash field sets MUST
  be compared in CI (INV-HB-013). AA suite MUST include chain integrity check
  (HLC monotonicity + chain_hash) as AA-09 companion tool.

gates:
  - gate_id: "AA-01"
    name: "Mediated Feedback"
    invariant: "findings guidance/analytics read models have no write path to compiled_rules or the finding FSM"
    validation_method: "Integration test proving finding events cannot trigger compilation"
    story_refs: ["US-GA-001"]
    criteria:
      - "findings_application read models cannot write to compiled_rules_store"
      - "findings_application guidance/aggregates cannot modify finding FSM state"
      - "Finding events cannot trigger compilation"
      - "Mediated feedback flow: finding_events_store → read-only findings views → Human → directives change → recompile"

  - gate_id: "AA-02"
    name: "Declarative Governance"
    invariant: "Evaluation and FSM paths use only schema/CG-IR fields; policy doctrine is guidance_only after finding creation"
    validation_method: "Static analysis + architectural audit of guidance_only edges"
    story_refs: ["US-CD-001"]
    criteria:
      - "inspection and findings MUST NOT read policy doctrine documents for evaluation or state transitions"
      - "findings MAY read policy doctrine documents from directives via directives_repository and paired_policy_ref for guidance_only resolution"
      - "There MUST NOT be a separate PolicyDoctrineReader or filesystem doctrine path used at runtime"
      - "CI static analysis scans evaluation/FSM paths for doctrine access used as executable logic"
      - "Conflict resolution uses contract algorithm over schema/CG-IR fields only"

  - gate_id: "AA-03"
    name: "Detection Evaluator Purity"
    invariant: "Detection evaluators perform no IO, no randomness, no environment reads"
    validation_method: "AST analysis or sandboxed execution"
    story_refs: ["US-IP-001", "US-CP-002"]
    criteria:
      - "Detection evaluators perform no network calls"
      - "Detection evaluators perform no file I/O"
      - "Detection evaluators perform no randomness"
      - "Detection evaluators perform no environment variable reads"
      - "Same inputs produce same outputs (determinism)"

  - gate_id: "AA-04"
    name: "Segregation of Duties"
    invariant: "SoD enforced at FSM transition gates"
    validation_method: "Integration test matrix covering all legal RO-disposition transitions"
    story_refs: ["US-SD-002", "US-SD-001", "US-SD-003"]
    criteria:
      - "finding.waive denied when actor ∈ creator_provenance"
      - "finding.approve_remediation denied when actor submitted evidence"
      - "finding.supersede denied when actor ∈ creator_provenance"
      - "Denial produces 403 CapabilityDenied with audit log entry"
      - "No state mutation on denial"
      - >
        Test matrix MUST enumerate every legal RO disposition transition under
        INV-FL-006 (from_state × action): for each of
        {Open, Acknowledged, Evidence Submitted, Pending Verification, Rejected}
        × {finding.dismiss, finding.waive, finding.supersede}, assert SoD where
        applicable (waive/supersede: actor NOT IN creator_provenance) and that
        deny leaves FSM state unchanged. Coverage of Open-only is non-conformant.

  - gate_id: "AA-05"
    name: "Conflict Resolution Determinism"
    invariant: "Identical CG-IR snapshot + identical target → byte-identical conflict outcomes"
    validation_method: "Replay test"
    story_refs: ["US-CD-001", "US-PR-001"]
    criteria:
      - "Identical inputs produce identical outcomes"
      - "compatible_overrides pairs resolve deterministically"
      - "defer_to cycle detection produces consistent results"
      - "Cross-lineage advisory produces identical artifacts"

  - gate_id: "AA-06"
    name: "Discriminator Completeness"
    invariant: "Invalid detection.strategy / *_spec pairings rejected"
    validation_method: "Corpus of invalid pairings must be rejected by reference validator"
    story_refs: ["US-CP-002"]
    criteria:
      - "Invalid detection.strategy vs structural_spec/semantic_spec/pattern_spec/composite_spec pairings are rejected"
      - "AST-walking discriminator validator is used (not just JSON Schema)"
      - "Rejection corpus covers all detection strategies and adapter_config mismatches"

  - gate_id: "AA-07"
    name: "Portable Serialization"
    invariant: "RE2 canary vectors and UTC/NaN rejection tests pass"
    validation_method: "RE2 canary test vectors + UTC/NaN rejection tests"
    story_refs: ["US-CP-002"]
    criteria:
      - "RE2 canary test vectors pass (compilation portable-validation contract)"
      - "UTC-only timestamp validation passes"
      - "NaN/Infinity rejection passes"
      - "Regex flags whitelist validation passes"
      - "NFC string normalization (warning)"

  - gate_id: "AA-08"
    name: "Hermeticity Completeness"
    invariant: >
      frozen_environment pins (python_hash_seed, locale, datetime_wall_clock_policy,
      ordered_collection_policy) and exhaustive runtime_preimage are verified;
      compile path has no unordered set/dict hash inputs and no wall-clock reads
    validation_method: >
      Compile-time pin assertion + static analysis of compile path for
      nondeterministic_call_denylist and unordered collection iteration; preimage
      exhaustiveness check against hermetic_boundary.schema; AA-07 canary in prod image
    story_refs: ["US-HB-001", "US-CP-001"]
    criteria:
      - "python_hash_seed is present and non-null integer in frozen_environment"
      - "locale is pinned to C.UTF-8 (or equivalent POSIX locale)"
      - >
        datetime_wall_clock_policy is forbidden for production compilations;
        pinned is permitted only with a non-null injected
        pinned_compile_start_timestamp excluded from snapshot hashes (HERM-008,
        INV-HB-007)
      - "ordered_collection_policy is sorted only (production)"
      - "runtime_preimage includes runtime_preimage_minimum categories"
      - "Static analysis covers nondeterministic_call_denylist (not only datetime.now)"
      - "Static analysis finds no unordered set/dict iteration folded into snapshot hash"
      - "Missing any required pin fails compile_time_validation (HERM-008)"
      - "CI compares schema x-cg-ir-hashing to runtime hash field set (INV-HB-013)"
      - "Inspector live attestation path is tested (HERM-010)"

  - gate_id: "AA-09"
    name: "Event Chain Integrity"
    invariant: >
      finding_events_store chain_hash and HLC monotonicity are verifiable offline
    validation_method: >
      Chain integrity tool re-computes event hashes and verifies non-decreasing
      (pt, lc, node_id) order; rejects retired node_id emissions
    story_refs: ["US-GA-001"]
    criteria:
      - "chain_hash continuity verified for sampled finding streams"
      - "HLC tuples are non-decreasing per node_id"
      - "retired_nodes table rejects appends with fenced node_id"
      - "Tool is part of certification_tool suite"

certification_requirements:
  description: "Requirements for production-grade certification"
  rules:
    - "All 9 gates (AA-01 through AA-09) MUST pass"
    - "Gates are non-blocking for document suite conformance"
    - "Gates are REQUIRED for production-grade reference implementation certification"
    - "Gate results MUST be recorded with pass/fail per gate and explicit gate-ID traceability"
    - "certification_tool artifact writes use scoped credentials only"

invariants:
  - id: "INV-GA-001"
    statement: "All 9 gates (AA-01 through AA-09) MUST pass for production certification"
    enforcement: "certification_process"

  - id: "INV-GA-002"
    statement: "Gate results MUST include explicit gate-ID traceability"
    enforcement: "certification_process"

stories:
  - story_id: "US-GA-001"
    as: "certification_tool"
    i_want: "to verify architectural audit gates before production certification"
    so_that: "reference implementations are production-grade"
    acceptance_criteria:
      - "Given a reference implementation. When architectural audit runs. Then all 9 gates (AA-01 through AA-09) are verified with pass/fail per gate."
      - "Given gate AA-01 (Mediated Feedback). When verification runs. Then it is confirmed that findings_application read models have no write path to compiled_rules or the finding FSM."
      - "Given gate AA-04 (Segregation of Duties). When verification runs. Then it is confirmed that finding.waive is denied when actor is in creator_provenance."
      - "Given gate AA-08 (Hermeticity Completeness). When verification runs. Then python_hash_seed, locale, wall-clock policy, ordered collections, and exhaustive runtime_preimage are confirmed."
