# cli_contract.yaml
# Normative source for CLI behavior contract.
# Defines command families and their expected behavior.

contract_id: "interfaces.cli_contract"
schema_version: "1.0.0"
design_contract_version: "1.1.0"
owner_component: "api"
description: >
  Defines the CLI behavior contract for the Selma system. Commands
  map to the same capability-gated operations as the REST API.

command_families:
  - family: "directive"
    description: "Directive lifecycle commands"
    commands:
      - name: "create"
        capability: "directive.create"
        args: "Directive file path"
        behavior: "Create directive from file, compile to CG-IR"
        output: "Directive ID, lineage_id, CG-IR snapshot hash"

      - name: "modify"
        capability: "directive.modify"
        args: "Directive ID + changes file"
        behavior: "Create new revision, incrementally compile"
        output: "New revision ID, CG-IR snapshot hash"

      - name: "retire"
        capability: "directive.retire"
        args: "Directive ID"
        behavior: "Transition to deprecated"
        output: "Confirmation"

      - name: "fork"
        capability: "directive.fork"
        args: "Directive ID + fork description"
        behavior: "Fork into two directives"
        output: "Two new execution IDs"

      - name: "merge"
        capability: "directive.merge"
        args: "Two directive IDs + merge description"
        behavior: "Merge into one directive"
        output: "Merged execution ID"

      - name: "list"
        capability: null
        args: "Optional filters"
        behavior: "List active directives"
        output: "Directive list"

  - family: "inspect"
    description: "Inspection commands"
    commands:
      - name: "submit"
        capability: "inspection.submit"
        args: "Target file path"
        behavior: "Submit target for inspection against current CG-IR"
        output: "Inspection snapshot, findings, system_state_hash"

      - name: "reinspect"
        capability: "inspection.reinspect"
        args: "Target ID"
        behavior: "Reinspect against latest CG-IR"
        output: "New inspection snapshot"

  - family: "finding"
    description: "Finding management commands"
    commands:
      - name: "list"
        capability: "finding.view"
        args: "Optional filters"
        behavior: "List findings"
        output: "Finding list"

      - name: "acknowledge"
        capability: "finding.acknowledge"
        args: "Finding ID"
        behavior: "Transition Open → Acknowledged"
        output: "Updated finding"

      - name: "dismiss"
        capability: "finding.dismiss"
        args: "Finding ID + reason"
        behavior: "Transition Open|Acknowledged|Evidence Submitted|Pending Verification|Rejected → Dismissed (INV-FL-006)"
        output: "Updated finding"

      - name: "waive"
        capability: "finding.waive"
        args: "Finding ID + justification"
        behavior: "Transition Open|Acknowledged|Evidence Submitted|Pending Verification|Rejected → Waived (SoD; INV-FL-006)"
        output: "Updated finding"

      - name: "supersede"
        capability: "finding.supersede"
        args: "Finding ID + reason"
        behavior: "Transition Open|Acknowledged|Evidence Submitted|Pending Verification|Rejected → Superseded (SoD; INV-FL-006)"
        output: "Updated finding"

      - name: "approve"
        capability: "finding.approve_remediation"
        args: "Finding ID"
        behavior: "Transition Pending Verification → Verified"
        output: "Updated finding"

      - name: "reject"
        capability: "finding.reject_remediation"
        args: "Finding ID + reason"
        behavior: "Transition Pending Verification → Rejected"
        output: "Updated finding"

      - name: "reopen"
        capability: "finding.reopen"
        args: "Finding ID + mandatory comments"
        behavior: "Transition Rejected → Open (first-class capability; not reject_remediation)"
        output: "Updated finding"

  - family: "audit"
    description: "Audit and verification commands"
    commands:
      - name: "verify"
        capability: null
        args: "Scope (determinism, portability, provenance, complexity)"
        behavior: "Run verification checks"
        output: "Verification results"

      - name: "certify"
        capability: null
        args: "Implementation path"
        behavior: "Run architectural audit gates AA-01 through AA-09"
        output: "Certification results with gate-ID traceability"

error_behavior:
  description: >
    CLI errors follow the same RFC 7807-style Error schema as the REST API.
    Human-readable mode formats the envelope as a structured text table.
    JSON mode returns the exact wire format.
  rules:
    - "Non-zero exit code on any error"
    - "Structured error output (JSON or human-readable) conforming to Error schema"
    - "401 Unauthorized shown as authentication error (no audit write)"
    - "403 CapabilityDenied / SoDDenied shown as permission error with denial reason"
    - "429 RateLimited shown with retry-after guidance"
    - "retryable and error_category fields present in JSON mode"
    - "No partial state mutation on any error"

invariants:
  - id: "INV-CL-001"
    statement: "CLI commands MUST check capability before processing"
    enforcement: "cli_handler"

  - id: "INV-CL-002"
    statement: "CLI errors MUST produce non-zero exit code"
    enforcement: "cli_handler"

stories:
  - story_id: "US-CL-001"
    as: "api"
    i_want: "to expose CLI commands for all system operations"
    so_that: "users can interact with Selma from the terminal"
    acceptance_criteria:
      - "Given a valid directive file. When 'selma directive create' is run. Then a new directive is created and CG-IR is compiled."
      - "Given a target file. When 'selma inspect submit' is run. Then inspection runs and findings are displayed."
      - "Given a finding ID. When 'selma finding waive' is run by the directive creator. Then SoD violation is shown and no state change occurs."
