# rest_api.yaml
# Normative source for REST API behavior contract.
# Defines endpoint families and their expected behavior.

contract_id: "interfaces.rest_api"
schema_version: "1.0.0"
owner_component: "api"
description: >
  Defines the REST API contract for the Selma system. This is a
  behavioral contract — specific endpoint paths are implementation-
  specific, but behavior and error semantics are normative.

endpoint_families:
  - family: "directives_application"
    description: >
      Directive CRUD and lifecycle operations. Concrete paths and operationIds
      are owned by docs/api/ (R1): POST|GET /directives, GET|PATCH
      /directives/{lineage_id}, GET .../revisions/{revision}, POST .../lifecycle.
    operations:
      - method: "POST"
        action: "CreateDirective"
        path: "/directives"
        capability: "directive.create"
        request: "Directive document (conforming to rule schema); Idempotency-Key REQUIRED"
        response: "Created directive with lineage_id and execution_id"
        errors:
          - "400 SchemaError: invalid directive structure"
          - "403 CapabilityDenied: actor lacks capability"
          - "409 Conflict: execution_id already exists"
          - "409 Conflict: duplicate Idempotency-Key with different body"
        locking: "write_lock"
        idempotency: "required"

      - method: "PATCH"
        action: "UpdateDirective"
        path: "/directives/{lineage_id}"
        capability: "directive.modify"
        request: "Directive changes; optional If-Match ETag; Idempotency-Key REQUIRED"
        response: "New revision with same lineage_id; ETag header"
        errors:
          - "400 SchemaError: invalid changes"
          - "403 CapabilityDenied"
          - "404 NotFound: lineage does not exist"
          - "409 Conflict: If-Match / revision mismatch"
          - "503 CompileQueueFull: compile outbox soft limit"
        locking: "write_lock"
        optimistic_concurrency: "If-Match ETag = W/\"{lineage_id}:{revision}\""
        idempotency: "required"

      - method: "GET"
        action: "GetDirective / ListDirectives"
        path: "/directives | /directives/{lineage_id}"
        capability: null
        request: "lineage_id (item) or list filters"
        response: "Directive document or page"
        errors:
          - "404 NotFound"
        locking: "read_lock"

      - method: "POST"
        action: "LifecycleTransitions"
        path: "/directives/{lineage_id}:fork|:merge|:split|:restore (Delete for retire)"
        capability: "directive.fork/merge/split/retire/restore"
        request: "action + target directive(s); Idempotency-Key REQUIRED"
        response: "Resulting directive(s)"
        errors:
          - "400 SchemaError: invalid operation"
          - "403 CapabilityDenied"
          - "404 NotFound"
          - "409 Conflict: invalid lifecycle transition"
          - "409 Conflict: duplicate Idempotency-Key with different body"
        locking: "write_lock"
        idempotency: "required"

  - family: "compilation_application"
    description: >
      Hermetic compile surface. Concrete paths owned by docs/api/ (R2):
      POST /compilations, GET /compilations/{hash}. Package dual:
      compiled_rules_application.
    operations:
      - method: "POST"
        action: "CompileDirectives"
        path: "/compilations"
        capability: "directive.modify"
        request: "lineage_ids[]; Idempotency-Key REQUIRED"
        response: "Compilation status; content-addressed hash when completed"
        errors:
          - "400 SchemaError"
          - "403 CapabilityDenied"
          - "404 NotFound"
          - "409 Conflict"
          - "503 CompileQueueFull"
        idempotency: "required"

      - method: "GET"
        action: "Get compilation by content-addressed hash"
        path: "/compilations/{hash}"
        capability: null
        request: "SHA-256 hex hash"
        response: "Compilation / snapshot status"
        errors:
          - "404 NotFound"

  - family: "inspections_application"
    description: >
      Inspection submission and results. Concrete paths owned by docs/api/ (R3):
      POST /inspections, GET /inspections/{inspection_id}.
    operations:
      - method: "POST"
        action: "CreateInspection"
        path: "/inspections"
        capability: "inspection.submit"
        request: "Target (conforming to target schema); Idempotency-Key REQUIRED"
        response: "Inspection snapshot with findings"
        errors:
          - "400 SchemaError: invalid target"
          - "403 CapabilityDenied"
          - "409 Conflict: duplicate Idempotency-Key with different body"
          - "429 RateLimited: per-actor quota exceeded"
          - "504 UpstreamTimeout: target_sources_gateway failure after retries"
        locking: "read_lock (compilation_application)"
        idempotency: "required"

      - method: "GET"
        action: "GetInspection"
        path: "/inspections/{inspection_id}"
        capability: "inspection.view"
        request: "inspection_id"
        response: "Inspection snapshot"
        errors:
          - "403 CapabilityDenied"
          - "404 NotFound"

      - method: "POST"
        action: "Reinspect target (same CreateInspection surface with inspection.reinspect)"
        path: "/inspections"
        capability: "inspection.reinspect"
        request: "target_id; Idempotency-Key REQUIRED"
        response: "New inspection snapshot"
        errors:
          - "403 CapabilityDenied"
          - "404 NotFound"
          - "409 Conflict: duplicate Idempotency-Key with different body"
        idempotency: "required"

  - family: "findings_application"
    description: >
      Finding lifecycle management. Concrete paths owned by docs/api/ (R4):
      GET /findings, GET /findings/{finding_id},
      POST /findings/{finding_id}:transitionFinding,
      POST /findings/{finding_id}/evidence,
      GET /findings/{finding_id}/events.
    operations:
      - method: "GET"
        action: "ListFindings / GetFinding"
        path: "/findings | /findings/{finding_id}"
        capability: "finding.view"
        request: "Optional filters (inspection_id, target_id, lineage_id, fsm_state)"
        response: "Finding object(s)"

      - method: "POST"
        action: "TransitionFinding"
        path: "/findings/{finding_id}:transitionFinding"
        capability: "finding.acknowledge/dismiss/waive/approve_remediation/reject_remediation/reopen/supersede"
        request: "finding_id + transition-specific payload; Idempotency-Key REQUIRED"
        response: "Updated finding"
        errors:
          - "400 FSMError: invalid transition"
          - "403 CapabilityDenied"
          - "403 CapabilityDenied: SoD violation"
          - "404 NotFound"
          - "409 Conflict: concurrent transition / chain head mismatch"
          - "409 Conflict: duplicate Idempotency-Key with different body"
        locking: "fsm_engine"
        idempotency: "required"

      - method: "POST"
        action: "AttachEvidence"
        path: "/findings/{finding_id}:attachEvidence"
        capability: "evidence.submit"
        request: "evidence payload; Idempotency-Key REQUIRED"
        response: "Updated finding"
        errors:
          - "400 SchemaError"
          - "403 CapabilityDenied"
          - "404 NotFound"
          - "409 Conflict"
        idempotency: "required"

  - family: "findings_application_read_models"
    description: >
      Read-only aggregates and guidance under findings_application.
      Not a freestanding analytics or guidance engine (C4).
      Paths: GET /findings/aggregates, GET /findings/{finding_id}/guidance.
    operations:
      - method: "GET"
        action: "ListFindingAggregates"
        path: "/findings:listFindingAggregates"
        capability: "analytics.view"
        request: "Query parameters over finding events"
        response: "Aggregated data (read-only)"
        errors:
          - "403 CapabilityDenied"

      - method: "GET"
        action: "GetFindingGuidance"
        path: "/findings/{finding_id}/guidance"
        capability: "finding.view"
        request: "finding_id"
        response: "Guidance payload from doctrine (guidance_only)"
        errors:
          - "404 NotFound"

  - family: "artifacts_repository"
    description: >
      Write-once artifacts (inspection, conflict, certification, evidence).
      Conflict human-review and certification results are artifact-backed;
      ResolveConflict and certification_tool are not freestanding API peers.
      Paths owned by docs/api/ (R5).
    operations:
      - method: "GET"
        action: "List / read artifacts"
        path: "/artifacts | /artifacts/{artifact_id}"
        capability: null
        request: "Optional kind filter (inspection|conflict|certification|evidence)"
        response: "Artifact metadata and payload"
        errors:
          - "403 CapabilityDenied (inspection.view when inspection-scoped)"
          - "404 NotFound"

      - method: "POST"
        action: "ReviewConflictArtifact"
        path: "/artifacts/{artifact_id}:reviewConflictArtifact"
        capability: "conflict.resolve"
        request: "artifact_id + resolution; Idempotency-Key REQUIRED"
        response: "Updated conflict artifact"
        errors:
          - "403 CapabilityDenied"
          - "404 NotFound"
          - "409 Conflict: duplicate Idempotency-Key with different body"
        idempotency: "required"

error_semantics:
  description: >
    Uniform error behavior across all endpoints. Error envelope follows
    RFC 7807 (Problem Details) with extensions: type URI, title, status,
    code, detail, retryable, error_category, and request_id.
  rules:
    - "All errors return structured JSON conforming to the Error schema (RFC 7807-style)"
    - "Error code enum: Unauthorized, CapabilityDenied, SoDDenied, NotFound, SchemaError, Conflict, FSMError, RateLimited, UpstreamTimeout, InternalError, CompileFailure, CompileQueueFull, CASMiss, HashChainViolation, PairedPolicyRefDangling"
    - "Error classification: client_error (401/403/404/400), terminal (409, compile/store errors), transient (429/504/500)"
    - "retryable field: true for transient errors (RateLimited, UpstreamTimeout, InternalError); false for all others"
    - "401 Unauthorized for authentication failures (no DenialAuditPort write)"
    - "403 CapabilityDenied / SoDDenied includes denial reason for audit"
    - >
      429 RateLimited for per-actor rate limit exceeded on mutating directive
      endpoints — both directive.modify and directive.create (INV-CA-004):
      e.g. POST /directives returning 429 RateLimited before write lock when
      the actor exceeds the 30/60s per-actor quota (mirrors INV-CA-004 exactly)
    - "429 edge_rejected: global edge admission limit exceeded (identity-independent, set below app-tier bounds; returned at the LB/edge WITHOUT DenialAuditPort write; per-actor 429 by contrast always writes a denial event)"
    - "503 CompileQueueFull: compile_outbox_depth at soft_limit; directive mutation not committed; Retry-After (see directives_store compile_coordination.backpressure)"
    - "No partial state mutation on any error"
    - "All capability/SoD denials produce audit log entry via DenialAuditPort"

authentication:
  description: "See authorization.authentication contract"
  rules:
    - "Bearer JWT required on all routes except explicit health/readiness probes"
    - "Token validation and capability resolution use shared authorization module"

idempotency:
  description: "Client retries for mutating operations"
  header: "Idempotency-Key"
  scope: "(actor, key) — single-tenant v1; no tenant_id dimension"
  rules:
    - "REQUIRED on every mutating POST: directive create, directive lifecycle operations, inspection submit/reinspect, finding transitions, conflict resolutions, and compile triggers"
    - "Clients MUST generate a fresh Idempotency-Key per logical intent and reuse it on retries of that intent"
    - "Same key + same actor + same body → return original response (no second side effect)"
    - "Same key + different body → 409 Conflict"
    - "Keys retained ≥ 24h (configurable)"
    - "Store-level uniqueness constraints (e.g. (inspection_id, control_id, target_hash) for FindingCreated) remain a mandatory fallback; the key is the primary idempotency mechanism, not a substitute for those constraints"
    - "v1 is single-tenant per instance; Idempotency-Key is NOT scoped by tenant_id (see c4-model Tenant model)"

tenant_model:
  description: "Deployment isolation model (product decision v1)"
  mode: "single_tenant"
  rules:
    - "One Selma deployment instance serves one authority boundary"
    - "No tenant_id on resources, store rows, or JWT claims in design freeze line (docs/standards/VERSION)"
    - "Cross-organization isolation is achieved by separate deployments, not by a tenant dimension"


optimistic_concurrency:
  description: "Directive mutations"
  rules:
    - "GET directive returns ETag W/\"{lineage_id}:{revision}\""
    - "PATCH /directives/{lineage_id} and lifecycle custom methods SHOULD send If-Match; mismatch → 409"
    - "Finding transitions use per-finding chain serialization (see finding_events_store)"

denial_audit:
  description: "Capability/SoD denials at the gate"
  port: "DenialAuditPort"
  aggregation:
    description: >
      SOC denial telemetry is a time-series aggregate: a burst of identical
      denials from the same actor+capability+target within one aggregation
      window is rolled into a single window record with a count, not one event
      per request. This bounds store write volume while keeping burst
      visibility via the count. Chain/link semantics: each window record
      chains to the previous window record of the same (actor, capability,
      target) so the per-actor denial history remains hash-linked, identical
      to the finding event chain (prev_event_hash → event_hash), and a burst
      can be walked as a single logical chain without per-request nodes.
    window_default: "60 seconds (environment-configurable, min 1s)"
    aggregation_rules:
      - "Same actor_id + capability + target + (category, reason) within window ⇒ one record with count"
      - "Chain per (actor_id, capability, target): window records link via prev_event_hash/event_hash"
      - "Denial of a single request MUST still be enforced even if aggregated (deny decision is synchronous; aggregation affects only telemetry)"
      - "Burst count resets at window rollover; a new window opens a new chain node"
  rules:
    - "api depends on application-owned DenialAuditPort only (not raw store I/O)"
    - >
      Implementer is DenialAuditAdapter in findings_infrastructure (ISP-split).
      The adapter MAY share a connection pool with FindingEventRepository but
      api MUST only receive the DenialAuditPort surface (AppendDenial) — never
      the full FindingEventRepository interface.
    - >
      Append is synchronous with a bounded timeout; on audit store outage the
      deny decision is still enforced (deny wins even if the audit write
      fails). Implementations MUST additionally spool the denial to a local
      disk-backed fallback buffer (DLQ) and replay it to finding_events_store
      after recovery so SOC denial telemetry is reconciled, not dropped.
    - >
      Fallback buffer is bounded (environment-owned, production default
      10,000 entries); when full, oldest entries are dropped and counted in
      denial_audit_dropped_total. Replay MUST be idempotent (dedupe by
      denial event natural key or stored event_id).
    - >
      Replay assigns HLC at replay time (monotonic); payload MAY include
      original_denied_at and replay_marker for SOC wall-time reconciliation
      without violating INV-ES-003.
    - "Bulkhead: denial append uses a dedicated connection pool separate from domain writes"
    - "While the store is unavailable, denial latency must remain bounded (the gate must not hang on audit)"

invariants:
  - id: "INV-RA-001"
    statement: "All mutating endpoints MUST check capability before processing"
    enforcement: "api_gateway"

  - id: "INV-RA-002"
    statement: "Error responses MUST NOT leak internal state"
    enforcement: "api_gateway"

  - id: "INV-RA-003"
    statement: >
      Mutating POST endpoints MUST require and honor Idempotency-Key; duplicate
      retries MUST NOT double-append events or double-create resources
    enforcement: "api_gateway"

  - id: "INV-RA-004"
    statement: "Capability denials MUST go through DenialAuditPort"
    enforcement: "api_gateway"

stories:
  - story_id: "US-RA-001"
    as: "api"
    i_want: "to expose REST endpoints for all system operations"
    so_that: "clients can interact with Selma via HTTP"
    acceptance_criteria:
      - "Given a valid directive creation request. When POST /directives is called. Then a new directive is created with lineage_id and execution_id."
      - "Given an invalid target. When POST /inspections is called. Then 400 SchemaError is returned."
      - "Given a finding FSM transition. When POST /findings/{finding_id}:transitionFinding is called. Then capability is checked before processing."
      - "Given a compile request. When POST /compilations is called with lineage_ids. Then CompileDirectives runs and returns compilation status."
