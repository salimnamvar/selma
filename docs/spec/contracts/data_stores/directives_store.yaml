# directives.yaml
# Normative source for the Directives resource store contract (C4 ID: directives_store).

contract_id: "data_stores.directives"
schema_version: "1.0.0"
design_contract_version: "1.1.0"
owner_component: "directives_repository"
description: >
  Defines the contract for the Directive Graph storage layer.
  Supports versioned, mutable directives with read/write locking.

storage_model:
  format: "Dual-document structured store (executable JSON + policy doctrine YAML/JSON)"
  versioning: "Semantic versioning (MAJOR.MINOR.PATCH) co-versioned per revision"
  mutability: "Mutable (new revisions created on change)"
  content: >
    Each directive revision stores: (1) executable_document conforming to
    rule_schema.json — compile-time evaluation source only; (2) policy_doctrine_document
    conforming to policy_doctrine.yaml — guidance_only after findings; (3) paired_policy_ref
    linking the two; plus scope, priority, lineage, and metadata.
  system_of_record: >
    directives is authoritative for both documents. No separate filesystem
    MUST NOT introduce a separate policy-doctrine store, PolicyDoctrineReader adapter, or external Governance
    Contracts corpus. Schemas that constrain documents live in docs/schema/;
    instances are authored only through Selma into this store.

operations:
  - name: "create"
    capability: "directive.create"
    description: "Create new directive with lineage_id + execution_id"
    locking: "write_lock"
    produces: "new directive + new CG-IR snapshot"

  - name: "modify"
    capability: "directive.modify"
    description: "Create new revision of existing directive"
    locking: "write_lock"
    preserves: "lineage_id unchanged"
    produces: "new revision + incremental CG-IR snapshot"

  - name: "retire"
    capability: "directive.retire"
    description: "Transition directive to deprecated status"
    locking: "write_lock"
    produces: "deprecated directive + new CG-IR snapshot"

  - name: "fork"
    capability: "directive.fork"
    description: "Fork directive into two distinct directives"
    locking: "write_lock"
    produces: "two new execution_ids (shared lineage_id) + new CG-IR snapshot"

  - name: "merge"
    capability: "directive.merge"
    description: "Merge two directives into one"
    locking: "write_lock"
    produces: "merged directive (lexicographic min lineage_id) + new CG-IR snapshot"

  - name: "split"
    capability: "directive.fork"
    description: "Split directive into multiple independent directives"
    locking: "write_lock"
    produces: "multiple new execution_ids (shared lineage_id) + new CG-IR snapshot"

  - name: "restore"
    capability: "directive.restore"
    description: "Restore directive to a previous revision"
    locking: "write_lock"
    produces: "new revision copying target + new CG-IR snapshot"

  - name: "read"
    capability: null
    description: "Read full dual-document directive by lineage_id or execution_id"
    locking: "read_lock"
    produces: "directive with executable_document + policy_doctrine_document"

  - name: "read_executable"
    capability: null
    description: "Read executable rule document only (compile path)"
    locking: "read_lock"
    produces: "executable_document (rule_schema)"
    consumers: ["compilation_application"]

  - name: "read_policy_doctrine"
    capability: null
    description: "Read policy doctrine document by paired_policy_ref (guidance path only)"
    locking: "read_lock"
    produces: "policy_doctrine_document / GuidancePayload"
    consumers: ["findings_application"]
    forbidden_consumers: ["inspections_application"]

concurrency_model:
  description: "Locking semantics for directive store"
  rules:
    - "Compilation acquires read lock on Directive Graph"
    - "Concurrent compilations are allowed (read-only)"
    - "Directive modifications acquire write lock (exclusive)"
    - "Write lock blocks compilation; compilation blocks writes"
    - "Write lock uses FIFO queue ordering (writer-preference)"
    - "Read locks never wait on other read locks"
  fairness:
    description: >
      Writer-preference prevents writer starvation under sustained compile
      reads, but can delay compilations under sustained directive churn.
      Environments MUST bound compile wait without inventing a universal SLA
      in this contract.
    rules:
      - >
        Maximum write-queue depth and maximum compile wait for a read-lock
        acquisition MUST be configurable per environment.
      - >
        When a configured bound is exceeded, new write_lock acquisitions
        MUST fail fast (HTTP 503 / 429 with retry guidance) rather than
        queue indefinitely, OR the operator MUST accept unbounded wait as
        an explicit environment policy documented in the runbook.
      - >
        Queue position, lock holder identity, write-queue depth, and
        compile wait time MUST be exported as metrics (see deployment
        observability catalog).
  deadlock_prevention:
    - "No circular wait: dependency is strictly read_lock → optional write_lock"
    - "Engines MUST NOT hold write lock while awaiting compilation"
    - "Queue position and lock holder identity MUST be observable"
    - "Compilation holds read locks only; no lock type inversion"

invariants:
  - id: "INV-DS-001"
    statement: "Write lock MUST be exclusive (no concurrent writes)"
    enforcement: "store_engine"

  - id: "INV-DS-002"
    statement: "Read lock MUST allow concurrent reads"
    enforcement: "store_engine"

  - id: "INV-DS-003"
    statement: "lineage_id is immutable across all lifecycle operations"
    enforcement: "store_engine"

  - id: "INV-DS-004"
    statement: "Each modification MUST create a new revision (append-only history)"
    enforcement: "store_engine"

  - id: "INV-DS-005"
    statement: "Each revision MUST store both executable_document and policy_doctrine_document linked by paired_policy_ref"
    enforcement: "directives_repository"

  - id: "INV-DS-006"
    statement: "read_policy_doctrine MUST NOT be used for evaluation, inspection, or finding FSM transitions"
    enforcement: "certification_tool (AA-02)"

retention_policy:
  description: >
    Directive revisions are the system of record for executable + doctrine
    documents. Unbounded growth is operational; aggressive GC breaks guidance
    replay when findings pin paired_policy_ref to a specific revision.
  rules:
    - artifact: "Directive head row (Directives)"
      retention: "Indefinite while lineage exists"
      pruning: "Never prune active/draft heads; retired lineages kept for audit"
    - artifact: "DirectiveRevisions referenced by any finding paired_policy_ref"
      retention: "Indefinite"
      pruning: >
        MUST NOT be garbage-collected while any finding_events FindingCreated
        (or projection) still references that paired_policy_ref. Guidance
        resolution depends on the pinned revision (see finding_events_store
        guidance_resolution and c4-model guidance temporal integrity).
    - artifact: "DirectiveRevisions not referenced by any finding or outbox"
      retention: "Configurable (environment-owned; default retain ≥ 7 years or match audit policy)"
      pruning: >
        MAY be pruned only after: (1) no finding references the revision's
        paired_policy_ref, (2) no pending/in_progress compile_request for that
        revision, and (3) operator policy allows. Pruning MUST be offline/admin
        and audit-logged.
    - artifact: "CompileRequests outbox completed rows"
      retention: "Configurable (default: 90 days after completed)"
      pruning: "Safe to prune completed/failed history after retention; permanently_failed MAY be retained longer for ops forensics"
  invariants:
    - id: "INV-DS-007"
      statement: >
        A directive revision whose paired_policy_ref is referenced by any
        finding MUST remain readable for guidance_only resolution indefinitely
      enforcement: "retention_policy + guidance_resolution"

stories:
  - story_id: "US-DS-001"
    as: "directives_repository"
    i_want: "to enforce read/write locking on directive operations"
    so_that: "concurrent access is safe and modifications are serialized"
    acceptance_criteria:
      - "Given a compilation in progress. When a directive modification is attempted. Then the modification waits until compilation releases read lock."
      - "Given two concurrent compilations. When both run. Then both succeed (read locks are compatible)."
      - "Given a write lock held. When a new compilation is attempted. Then the compilation waits until write lock is released."

optimistic_concurrency:
  description: >
    Concurrent writers MUST NOT silently overwrite revisions. API and repository
    use revision-based optimistic concurrency in addition to store write locks.
  rules:
    - "Each directive revision has a monotonically increasing revision integer"
    - "Mutating API requests SHOULD send If-Match with ETag = W/\"{lineage_id}:{revision}\""
    - "When If-Match is present and does not match current head revision → 409 Conflict (no write)"
    - "When If-Match is absent, write_lock still serializes writers; last committed wins only within lock order"
    - "ETag is returned on every successful GET/PUT of a directive view"
  etag_format: 'W/"{lineage_id}:{revision}"'

compile_coordination:
  description: >
    Cross-store consistency between directives_store and compiled_rules_store.
    Stores are independent systems; there is no distributed XA transaction.
  model: "transactional_outbox_then_compile"
  rules:
    - >
      After a durable directive mutation (same DB transaction as the new revision),
      directives_repository MUST insert a compile_request outbox row keyed by
      (lineage_id, revision) with status=pending.
    - >
      compilation_application drains the outbox (same Application process in v1;
      optional dedicated worker later). Deduplicate by (lineage_id, revision).
    - >
      Temporary inconsistency is allowed: a new revision may exist before its CG-IR
      snapshot is published. Inspections use the latest published snapshot; clients
      MAY poll /directives/{lineage_id}/compilations for status.
    - >
      Outbox rows transition pending → in_progress → completed | failed | permanently_failed.
      Failed rows are retriable; reconciliation job requeues stuck pending/in_progress
      only after lease expiry (see claim_lease).      Schema-error rows that fail validation
      on every retry attempt are transitioned to permanently_failed after a configurable
      retry budget is exhausted (default: 5 consecutive failures with identical schema
      error). Permanently_failed rows MUST NOT be re-enqueued; they require manual
      intervention or a corrective directive revision to clear. Export
      compile_outbox_failed_total{reason} metric (see deployment observability)
      to distinguish schema-error poison rows from other terminal failures.
    - "Direct API compile triggers also enqueue the same outbox (idempotent key)"
  claim_lease:
    description: >
      Multi-replica and multi-worker drain MUST claim rows transactionally so two
      workers never process the same (lineage_id, revision) concurrently.
    rules:
      - >
        Claim MUST use a lease: SELECT … FOR UPDATE SKIP LOCKED (or equivalent)
        that atomically sets status=in_progress, worker_id, lease_expires_at.
      - >
        Only the lease holder may transition the row to completed, failed, or
        permanently_failed. Other workers skip locked rows.
      - >
        Stuck in_progress rows (lease_expires_at < now) MAY be reclaimed by
        reconciliation; completed rows MUST NOT be re-enqueued.
      - >
        Manual API compile triggers MUST upsert the same outbox natural key
        (lineage_id, revision) rather than insert a duplicate pending row.
      - >
        CAS publish remains idempotent by content hash; lease correctness is
        about compute waste and crash recovery, not snapshot identity.
  head_snapshot_pointer:
    description: >
      Mutable pointer from directive lineage to the latest successfully published
      CG-IR snapshot. CAS is content-addressed only; this column is the normative
      "latest for lineage" secondary index used by inspections and GetLatestCompiledRules.
    column: "head_snapshot_hash"
    type: "sha256 | null"
    location: "Directives row (per lineage_id)"
    rules:
      - >
        Directives.head_snapshot_hash holds the cg_ir_snapshot_hash of the most
        recent successful compile for that lineage (null until first completed compile).
      - >
        When an outbox row transitions to completed, the same DB transaction
        (or a single atomic update pair spanning directives_store and the
        compiled_rules lineage_heads index — see compiled_rules_store
        lineage_head_index) MUST set Directives.head_snapshot_hash =
        published cg_ir_snapshot_hash for that lineage.
      - >
        head_snapshot_hash MUST only advance for completed publishes; failed and
        permanently_failed outbox rows MUST NOT change the pointer.
      - >
        If a later revision's compile completes after an earlier one (out-of-order
        drain), head_snapshot_hash MUST reflect the compile for the highest
        completed revision number (revision-monotonic head).
      - >
        Inspections that request "latest rules" resolve via this pointer (or the
        mirrored compiled_rules lineage_heads index); they MUST NOT scan CAS
        by compiled_at wall clock.
  consistency: "eventual between directive head and compiled snapshot; bounded by compile RTO"

lock_timing:
  description: "Avoid holding DB locks during hermetic CPU compile"
  rules:
    - "read_lock / SELECT ... FOR SHARE covers only the durable read of executable documents"
    - "After materializing executable documents in memory, release read locks before hermetic compile CPU work"
    - "Do not hold write_lock while awaiting compilation completion"
    - "Implementation mapping: PostgreSQL REPEATABLE READ or SELECT ... FOR SHARE for compile reads; exclusive row/advisory lock for writes"

