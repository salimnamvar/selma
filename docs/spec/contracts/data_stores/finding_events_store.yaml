# finding_events.yaml
# Finding Events store (C4 ID: finding_events_store).
# Normative source for the Finding Event Stream store contract.

contract_id: "data_stores.finding_events"
schema_version: "1.0.0"
design_contract_version: "1.1.0"
owner_component: "finding_events_repository"
description: >
  Defines the contract for the Finding Event Stream — an append-only
  audit log with HLC ordering and event hashing.

storage_model:
  type: "Append-only log"
  ordering: "Hybrid Logical Clock (HLC) total order"
  immutability: "Events are never modified once written"
  integrity: "event_hash ensures content integrity"

event_schema:
  required_fields:
    - field: "event_id"
      type: "string (UUID)"
      description: "Unique event identifier"
    - field: "finding_id"
      type: "string"
      description: "Reference to the finding"
    - field: "event_type"
      type: "enum"
      values: ["FindingCreated", "DispositionChanged", "FindingClosed", "CapabilityDenied", "SoDDenied", "ConflictResolved", "ResolutionDecided"]
    - field: "timestamp"
      type: "datetime (ISO 8601, UTC)"
      description: "Event time"
    - field: "logical_clock"
      type: "object"
      description: "Hybrid logical clock for ordering"
    - field: "actor"
      type: "string"
      description: "Human ID or AI agent ID"
    - field: "payload"
      type: "object"
      description: "Event-specific data"
    - field: "event_hash"
      type: "string (SHA-256)"
      description: "Hash of event (excluding event_hash itself)"
    - field: "prev_event_hash"
      type: "string (SHA-256) or null"
      description: "Hash of the previous event in the stream; null for first event"
    - field: "chain_hash"
      type: "string (SHA-256)"
      description: "Hash chain linking all events for tamper-evidence"

event_payloads:
  - event_type: "FindingCreated"
    required_fields:
      - "finding_id"
      - "lineage_id"
      - "control_id (directive_id)"
      - "inspection_id"
      - "fsm_state (Created)"
      - "severity"
      - "outcome"
      - "confidence"
      - "evidence"
      - "reasoning"

  - event_type: "DispositionChanged"
    required_fields:
      - "previous_disposition"
      - "new_disposition"
      - "previous_fsm_state"
      - "new_fsm_state"
      - "reason (optional)"

  - event_type: "FindingClosed"
    required_fields:
      - "final_disposition"
      - "final_fsm_state"
      - "closure_reason (optional)"

  - event_type: "CapabilityDenied"
    required_fields:
      - "actor"
      - "capability"
      - "action"
      - "reason"
      - "denial_code"
    optional_fields:
      - "finding_id"
    notes: "finding_id is REQUIRED when denial is for finding-related capabilities (finding.*, evidence.*); optional for non-finding actions (directive.*, inspection.*)."

  - event_type: "SoDDenied"
    required_fields:
      - "actor"
      - "finding_id"
      - "capability"
      - "sod_rule"
      - "reason"

  - event_type: "ConflictResolved"
    required_fields:
      - "conflict_id"
      - "resolution_type"
      - "actor"
    optional_fields:
      - "artifact_ref"

  - event_type: "ResolutionDecided"
    required_fields:
      - "conflict_id"
      - "artifact_ref"
      - "actor"
      - "decision"

hlc:
  description: "Hybrid Logical Clock for distributed event ordering"
  schema:
    - field: "physical_time"
      type: "datetime (wall clock, UTC)"
    - field: "logical_counter"
      type: "integer (monotonic, starts at 0)"
    - field: "node_id"
      type: "string (unique node identifier)"
  ordering: >
    Total ordering by: physical_time → logical_counter → node_id → event_id.
    Per-node tuple (physical_time, logical_counter) is strictly non-decreasing.
  clock_advancement:
    send: >
      pt_new = max(pt, pt_wall)
      if pt_new > pt: lc_new = 0
      else: lc_new = lc + 1
    receive: >
      pt_new = max(pt, pt_wall, remote_pt)
      if pt_new > pt: lc_new = 0
      elif pt_new == pt: lc_new = max(lc, remote_lc) + 1
      else: lc_new = lc + 1
  monotonicity_guarantee:
    - "physical_time in persisted state NEVER decreases"
    - "logical_counter NEVER decreases"
    - "Counter resets to 0 only when physical_time strictly advances"
    - "Wall clock regression absorbed by incrementing logical_counter"
  node_identity:
    description: >
      node_id is part of the total-order tuple. Correct causal tracking across
      process restarts requires stable identity and persisted HLC state.
    rules:
      - >
        node_id MUST be a stable per-replica (or per-process-slot) identifier —
        UUID preferred — assigned at first start and persisted across restarts.
        It MUST NOT be re-derived solely from hostname or PID.
      - >
        On restart, the process MUST load the last persisted HLC state
        (physical_time, logical_counter) for its node_id before accepting
        appends; cold start with empty state is allowed only for a brand-new
        node_id never used for prior events.
      - >
        Retiring a replica MUST fence its node_id (no reuse for a different
        process without a new UUID) so historical tuples remain unambiguous.
      - >
        Total order remains well-defined even without persistence; persistence
        is required so post-restart events continue causal monotonicity relative
        to that replica's pre-crash stream.
    persistence_mechanism:
      description: >
        Deployment topology MUST provide one of the conformant persistence
        backends (deployment/README.md "HLC node state persistence"):
        (1) per-replica persistent volume (StatefulSet/PVC) holding node_id
        and HLC state, or (2) an hlc_state table in finding_events_store
        keyed by node_id.
      rules:
        - "A stateless replica with a fresh node_id that has no prior events in the stream is conformant (fence-and-retire)"
        - "Reusing a retired node_id without its persisted HLC state is non-conformant (breaks INV-ES-003)"
        - "HLC state MUST be durably advanced (fsync-batched) as events are appended; lossy in-memory-only counters are non-conformant"

event_hash:
  formula: "SHA-256(canonical_json(event_id ‖ payload ‖ prev_event_hash))"
  notes: "Covers all event fields including logical_clock and payload; links to previous event for chain integrity"

chain_hash:
  formula: "SHA-256(event_hash ‖ prev_chain_hash)"
  notes: "Contiguous hash chain from first event; enables detection of deleted or reordered events"
  initial_value: "event_hash of the first event in the stream"

analytics:
  description: >
    Read-only finding aggregates over the event stream, owned by
    findings_application (not a freestanding analytics engine / C4 peer).
  types:
    - name: "finding_aggregates"
      description: "Pre-computed for context object"
    - name: "trend_analysis"
      description: "Finding rates over time (read-only)"
    - name: "compliance_dashboard"
      description: "Real-time posture view"
  constraint: "findings_application read models never modify compiled_rules or finding FSM state"

mediated_feedback:
  description: "How read-only findings views inform directive changes"
  flow: "finding_events_store → findings_application read models → Human review → directives change → recompile"
  constraint: "No direct finding → compiled_rules path"

retention_policy:
  - artifact: "Finding Events"
    retention: "Indefinite (audit trail)"
    pruning: "Never pruned"
  - artifact: "Pipeline Traces"
    retention: "Configurable (default: 1 year)"
    pruning: "Pruned after retention period"
  - artifact: "Inspection Snapshots"
    retention: "Configurable (default: 7 years)"
    pruning: "Pruned after retention period"

invariants:
  - id: "INV-ES-001"
    statement: "Events are immutable once written"
    enforcement: "finding_events_store"

  - id: "INV-ES-002"
    statement: "event_hash ensures integrity of all event fields"
    enforcement: "finding_events_store"

  - id: "INV-ES-003"
    statement: "Per-node HLC tuple is strictly lexicographically non-decreasing"
    enforcement: "hlc_engine"

  - id: "INV-ES-004"
    statement: "No duplicate event_ids"
    enforcement: "finding_events_store"

  - id: "INV-ES-005"
    statement: "findings_application read models are read-only; no write path to compiled_rules or FSM"
    enforcement: "architectural_audit (AA-01)"

  - id: "INV-ES-006"
    statement: "chain_hash forms a contiguous hash chain; deletion or reordering of events breaks the chain"
    enforcement: "finding_events_store"

  - id: "INV-ES-007"
    statement: >
      The sole intended write path for finding lifecycle and SoD/capability denial
      events is findings_application / FindingFsm (domain) via
      finding_events_repository, plus api DenialAuditPort → finding_events_repository
      for CapabilityDenied only. Direct store mutation bypassing FindingFsm for
      FSM transitions is forbidden; chain_hash verification MUST detect unauthorized
      stream edits
    enforcement: "architectural_audit + finding_events_store"

stories:
  - story_id: "US-ES-001"
    as: "event_adapter"
    i_want: "to maintain an append-only event log with HLC ordering"
    so_that: "finding lifecycle has a complete, ordered, immutable audit trail"
    acceptance_criteria:
      - "Given any FSM transition. When an event is written. Then the event is immutable and has a valid event_hash."
      - "Given two events from the same node. When ordering is checked. Then the HLC tuple is strictly non-decreasing."
      - "Given wall clock regression. When hlc_send is called. Then logical_counter increments (monotonicity preserved)."

append_concurrency:
  description: >
    Concurrent appends to the same finding_id MUST preserve a single hash chain
    without lost updates.
  strategy: "per_finding_serialization"
  atomicity_guarantee:
    description: >
      A human-initiated FSM transition and any resulting system-automatic transitions
      (e.g. Waived→Closed, Verified→Closed, Evidence Submitted→Pending Verification,
      Created→Open) MUST be appended as a single atomic batch in one DB transaction
      (INV-FL-020). The store MUST guarantee that readers observe either all events
      in the batch or none — no intermediate state where the human event exists but
      the automatic successor does not. Crash recovery MUST either replay both events
      atomically or neither; partial appends break the finding's FSM state consistency.
  rules:
    - "Append acquires an advisory lock or row lock on finding_id (or chain head) before computing prev_event_hash/chain_hash"
    - "Alternatively: optimistic append with expected_chain_head; on mismatch retry once (HTTP 409 to client if exhausted)"
    - "Cross-finding appends MAY proceed in parallel"
    - "CapabilityDenied events without finding_id use a global denial stream key or actor-scoped chain"
  denial_audit_amplification:
    description: >
      CapabilityDenied / SoDDenied appends share finding_events_store. Unbounded
      one-event-per-denial writes can contend with legitimate finding lifecycle
      appends (denial-audit write amplification).
    rules:
      - >
        api / DenialAuditPort MUST rate-limit or aggregate denial audit writes
        per (actor_id, capability) within a configurable time window rather than
        requiring one durable chain append per rejected request under flood.
      - >
        Aggregation MAY collapse N identical denials in the window into one
        event with payload.count and first/last timestamps; clients still receive
        403 per request.
      - >
        Rate-limit / aggregation parameters are environment-owned (no universal
        numeric default in this contract); production MUST configure a bound and
        expose denial-append rate metrics (see deployment observability).
      - >
        Authentication failures (401) MUST NOT write CapabilityDenied events
        (INV-AUTH path); only authenticated capability/SoD denials use DenialAuditPort.

idempotency:
  description: "Duplicate client retries MUST NOT double-append equivalent domain events"
  rules:
    - "Mutating API may supply Idempotency-Key; store records (actor, key, event_id) uniqueness"
    - "FindingCreated uniqueness: (inspection_id, control_id / directive_id, target_hash) MUST NOT create two open findings"
    - "Disposition transitions: identical transition with same Idempotency-Key returns prior result"
    - "event_id uniqueness remains absolute (INV-ES-004)"

state_hydration:
  description: "Finding current state is derived from the event stream with bounded cost"
  rules:
    - >
      findings_application MAY maintain a finding_projection (materialized snapshot)
      table updated in the same transaction as each successful append for that finding_id.
    - "Projection is a performance cache; event stream remains system of record"
    - "On cache miss or rebuild: fold events for finding_id ordered by HLC; optional snapshot every N events"
    - "Read models for guidance/analytics MUST NOT mutate FSM state (INV-ES-005)"

guidance_pinning:
  description: "Doctrine used for guidance is revision-pinned"
  rules:
    - "FindingCreated payload MUST store paired_policy_ref of the doctrine revision at evaluation/create time"
    - "GetFindingGuidance resolves doctrine by that ref only — never latest revision of the lineage"
    - "If doctrine document is missing (retention edge case), return 404 GuidanceUnavailable with explicit error — do not substitute"

replay_validation:
  description: "How historical event streams are validated against the current FSM"
  rules:
    - >
      Replay MUST accept legacy Dismissed→Closed and Superseded→Closed events
      recorded under older contracts (states.yaml legacy_event_migration).
    - "Replay MUST reject new emissions of those transitions under design_contract_version 1.1.0"
    - "Hash-chain integrity checks still apply to legacy events (event_hash / prev_event_hash)"

denied_actions_view:
  description: >
    SOC reconciliation view over the two-channel denial model (INV-ES-007).
    Channel A: CapabilityDenied via DenialAuditPort (api gate; may lack finding_id).
    Channel B: SoDDenied via FindingFsm on the per-finding chain.
    Reporting that only reads one channel under-reports denial volume.
  purpose: "SOC denial volume, self-waiver attempts, capability-abuse forensics"
  definition: >
    A read-only projection (SQL view, materialized view, or query API) that
    UNION ALL's CapabilityDenied and SoDDenied events from finding_events_store
    into a single logical stream for operators.
  columns:
    - "event_id"
    - "event_type (CapabilityDenied | SoDDenied)"
    - "channel (denial_audit_port | finding_fsm)"
    - "actor"
    - "capability (nullable for SoD-only)"
    - "finding_id (nullable for gate-only CapabilityDenied)"
    - "timestamp / HLC tuple"
    - "payload.count (when denial_audit_amplification aggregated N identical denials)"
    - "reason / sod_rule_id when present"
  aggregation_semantics:
    description: >
      When denial_audit_amplification collapses N identical denials into one
      event with payload.count, SOC volume metrics MUST sum payload.count
      (default 1 when absent), not event row count alone.
    rules:
      - "denied_actions_count = SUM(COALESCE(payload.count, 1)) over the window"
      - "Break out by event_type and channel so SoDDenied is never omitted from SOC reports"
      - "Rate-limited aggregation does not change 403 client responses (still one deny per request)"
  consumers:
    - "SOC / security operations (read-only)"
    - "Optional analytics.view aggregates (guidance_only; no FSM write path)"
  non_requirements:
    - "Not a C4 peer; not a separate store"
    - "Not required on the public REST surface in v1 (may be operator SQL / internal admin API)"
    - "MUST NOT provide a write path to findings or directives (AA-01)"

