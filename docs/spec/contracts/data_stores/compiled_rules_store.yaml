# compiled_rules.yaml
# Compiled Rules store (C4 store ID: compiled_rules_store).
# Normative source for the CG-IR content-addressed store contract.

contract_id: "data_stores.compiled_rules"
schema_version: "1.0.0"
design_contract_version: "1.3.0"
owner_component: "compiled_rules_repository"
description: >
  Defines the contract for the CG-IR content-addressed store.
  Immutable snapshots with deduplication by content hash.

storage_model:
  type: "Content-Addressed Store (CAS)"
  structure:
    - path: "snapshots/"
      description: "Full DAG snapshots, keyed by hash"
      contents:
        - "manifest.json (snapshot metadata)"
        - "nodes/ (individual node objects, keyed by node_hash)"
        - "edges/ (dependency graph, keyed by edge_hash)"
    - path: "shared/"
      description: "Deduplicated node objects shared across snapshots"
      contents:
        - "{node_hash}.json"

hashing_granularity:
  - level: "node"
    target: "Individual control node content (node_body)"
    purpose: "Deduplication across snapshots"
    formula: "node_hash = SHA-256(canonical_json({semantic_hash, presentation_hash}))"
  - level: "edge"
    target: "Dependency relationship ({source, target} directive_id pair)"
    purpose: "Graph structure verification"
    formula: "edge_hash = SHA-256(canonical_json({source, target}))"
    notes: "Directional; independent of node content"
  - level: "snapshot"
    target: "Full DAG manifest (node_hashes + edge_hashes + provenance)"
    purpose: "CG-IR version identity"
    formula: "cg_ir_snapshot_hash = SHA-256(canonical_json({node_hashes: sorted[], edge_hashes: sorted[], provenance}))"
  - level: "frozen_env"
    target: "Entire compilation environment"
    purpose: "Reproducibility guarantee"

deduplication_rules:
  - "Nodes with identical node_body share storage (same node_hash)"
  - "Edges stored once per unique (source, target) pair"
  - "Snapshots reference nodes/edges by hash, not copy"
  - "Incremental compilation reuses prior node_hash when node_body unchanged"
  - "Storage cost scales with unique content, not total rule count"

operations:
  - name: "publish"
    description: "Publish a new CG-IR snapshot"
    precondition: "Snapshot hash does not already exist (deduplication)"
    behavior: "Store snapshot immutably; deduplicate nodes/edges"
    locking: "atomic (all-or-nothing)"

  - name: "read_snapshot"
    description: "Read snapshot by cg_ir_snapshot_hash"
    behavior: "Return immutable snapshot"
    locking: "none (immutable)"

  - name: "read_latest"
    description: "Read latest published snapshot for a lineage (GetLatestCompiledRules)"
    behavior: >
      Resolve lineage_id → head_snapshot_hash via lineage_head_index (or the
      mirrored Directives.head_snapshot_hash), then read_snapshot. MUST NOT
      choose "latest" by compiled_at wall clock.
    locking: "none (immutable snapshot body; head pointer is mutable elsewhere)"

  - name: "read_node"
    description: "Read individual node by node_hash"
    behavior: "Return node object from shared store"
    locking: "none (immutable)"

  - name: "verify_integrity"
    description: "Verify snapshot integrity by recomputing hashes"
    behavior: "Recompute all node/edge/snapshot hashes and compare"

lineage_head_index:
  description: >
    Secondary index mapping lineage_id → head_snapshot_hash so CAS clients can
    resolve "latest CG-IR for lineage" without scanning snapshots. Mirrors
    Directives.head_snapshot_hash (directives_store head_snapshot_pointer).
  structure:
    - key: "lineage_id"
      value: "head_snapshot_hash (cg_ir_snapshot_hash)"
      optional_fields: ["head_revision", "updated_at"]
  rules:
    - "Updated atomically with publish when outbox row → completed"
    - "head_snapshot_hash advances revision-monotonically (highest completed revision wins)"
    - "GetLatestCompiledRules(lineage_id) MUST use this index (or directives head pointer)"
    - "Index is authoritative for inspection 'latest rules' resolution across replicas"
    - "CAS blob identity remains content-addressed; this index is the only mutable head map"
  publish_atomicity: >
    CAS object write (immutable blob) and lineage_head_index update are two
    stores (object store + index). Linearization rules:
    (1) Write CAS blob first (idempotent by content hash).
    (2) Update lineage_head_index only if head_revision of the completing
        outbox row is strictly greater than current head_revision (monotonic
        CAS on revision — late older compiles MUST NOT clobber newer heads).
    (3) Mark outbox row completed in the same directives_store transaction as
        the mirrored Directives.head_snapshot_hash update when the mirror lives
        in PostgreSQL.
    (4) If head-index update fails after CAS publish, outbox row stays
        retryable; drain is idempotent (CAS no-op + revision-monotonic head).
    (5) Drain isolation: SELECT … FOR UPDATE SKIP LOCKED; at-most-one active
        worker per outbox row; duplicate drain after crash is safe under (1)–(2).

retention_policy:
  description: >
    CG-IR snapshots are independent of directive revision GC. Directive
    revision retention (directives_store retention_policy) protects
    paired_policy_ref guidance replay, not snapshot identity. Snapshots
    referenced by inspection history remain available via CAS hash forever.
  artifacts:
    - artifact: "CG-IR Snapshots"
      retention: "Indefinite (immutable)"
      pruning: "Never pruned"
    - artifact: "Node Objects"
      retention: "Indefinite (shared)"
      pruning: "Never pruned"

invariants:
  - id: "INV-CS-001"
    statement: "CG-IR snapshot is immutable once published"
    enforcement: "content_addressed_store"

  - id: "INV-CS-002"
    statement: "Identical node_body produces identical node_hash (local scope)"
    enforcement: "hash_computation"

  - id: "INV-CS-003"
    statement: "node_hash excludes graph position and neighbor content"
    enforcement: "hash_computation"

  - id: "INV-CS-004"
    statement: "Two compilations of identical inputs produce identical snapshot hash"
    enforcement: "determinism_guarantee"

  - id: "INV-CS-005"
    statement: "compiled_at is NOT included in snapshot hash"
    enforcement: "hash_computation"

  - id: "INV-CS-006"
    statement: >
      GetLatestCompiledRules / inspection "latest rules" MUST resolve via
      lineage_head_index (head_snapshot_hash), not by scanning compiled_at
    enforcement: "lineage_head_index"

  - id: "INV-CS-007"
    statement: >
      lineage_head_index updates MUST be revision-monotonic; late older compile
      MUST NOT clobber a newer head (publish_atomicity)
    enforcement: "compiled_rules_infrastructure"

  - id: "INV-CS-008"
    statement: >
      Outbox drain MUST be idempotent across retries; CAS publish + head update
      follow publish_atomicity linearization
    enforcement: "compilation_application + compiled_rules_store"

  - id: "INV-CS-009"
    statement: >
      Production object store for CG-IR and artifacts MUST enable Object Lock /
      WORM or equivalent immutability controls so content-addressed blobs
      cannot be overwritten in place
    enforcement: "deployment + artifacts_store + compiled_rules_store"

stories:
  - story_id: "US-CS-001"
    as: "cgir_adapter"
    i_want: "to store CG-IR snapshots with content-addressed deduplication"
    so_that: "storage is efficient and integrity is verifiable"
    acceptance_criteria:
      - "Given two nodes with identical node_body. When stored. Then both reference the same node_hash (deduplication)."
      - "Given a published snapshot. When any mutation is attempted. Then the mutation is rejected (immutability)."
      - "Given a snapshot. When integrity verification runs. Then all recomputed hashes match stored hashes."
