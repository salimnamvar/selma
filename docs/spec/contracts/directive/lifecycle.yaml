# lifecycle.yaml
# Normative source for directive lifecycle states.
# Contract for directive lifecycle states.

contract_id: "directive.lifecycle"
schema_version: "1.0.0"
design_contract_version: "1.3.0"
owner_component: "directives_application"
description: >
  Defines the lifecycle states and operations for directives.
  Directives are the human-authored source-of-truth that compile
  into CG-IR snapshots.

lifecycle_states:
  - name: "draft"
    description: "Initial state; directive is being authored"
    transitions_to: ["active", "deprecated"]
    notes: "Drafts compile as active for testing per compilation/pipeline contract"

  - name: "active"
    description: "Directive is in effect and compiled into CG-IR"
    transitions_to: ["deprecated", "superseded"]
    notes: "Primary operational state"

  - name: "deprecated"
    description: "Directive is retired; audit trail preserved"
    transitions_to: []
    notes: >
      CG-IR nodes marked deprecated; no new compilations.
      Content mutations (directive.modify / revision operation) are FORBIDDEN
      while status=deprecated (INV-DL-004). Restore (if re-activation is offered)
      is a separate lifecycle path and is not content amend on a deprecated body.

  - name: "superseded"
    description: "Directive replaced by another rule"
    transitions_to: []
    notes: >
      metadata.migration.superseded_by MUST reference successor.
      Content mutations (directive.modify) are FORBIDDEN while status=superseded
      (INV-DL-004).

lifecycle_operations:
  - operation: "revision"
    lineage_id: "Unchanged"
    execution_id: "Unchanged"
    lineage_field: "NOT required"
    description: "Content change; same identity"

  - operation: "fork"
    lineage_id: "Inherited (shared)"
    execution_id: "Two new unique IDs"
    lineage_field: "REQUIRED (operation=fork)"
    description: "One directive becomes two"

  - operation: "merge"
    lineage_id: "New root (lexicographic min)"
    execution_id: "One new unique ID"
    lineage_field: "REQUIRED (operation=merge)"
    description: "Two directives become one"

  - operation: "split"
    lineage_id: "Inherited (shared)"
    execution_id: "Multiple new unique IDs"
    lineage_field: "REQUIRED (operation=split)"
    description: "One directive becomes many"

  - operation: "rename"
    lineage_id: "Unchanged"
    execution_id: "Unchanged"
    lineage_field: "NOT required"
    description: "Display name change; same identity"

  - operation: "retire"
    lineage_id: "Unchanged"
    execution_id: "Unchanged; status=deprecated"
    lineage_field: "NOT required"
    description: "Directive retired"

supersession:
  description: "How directives are replaced"
  rules:
    - "active → superseded: Rule replaced by another rule"
    - "metadata.migration.superseded_by MUST reference the successor id"
    - "Compile-time validator MUST verify superseded_by references an active or draft rule"

invariants:
  - id: "INV-DL-001"
    statement: "lineage_id is immutable across revisions, forks, and splits. On merge, lineage_id becomes the lexicographic minimum of parent lineage_ids (see identity.yaml merge semantics)."
    enforcement: "store_engine"

  - id: "INV-DL-002"
    statement: "execution_id changes only on fork/merge/split"
    enforcement: "store_engine"

  - id: "INV-DL-003"
    statement: "superseded_by MUST reference an active or draft rule"
    enforcement: "compile_time_validation"

  - id: "INV-DL-004"
    statement: >
      Directives with status=deprecated or status=superseded MUST NOT accept
      directive.modify (content revision on the same identity). The API MUST
      reject with 409 Conflict (or 400 FSMError) and MUST NOT create a new
      revision, acquire write_lock for content change, or enqueue compile.
      Operators who need a new body MUST author a successor directive (or
      restore to active via an explicit restore capability path if provided).
    enforcement: "directives_application (before write_lock)"

stories:
  - story_id: "US-DL-001"
    as: "directives_repository"
    i_want: "to manage directive lifecycle states"
    so_that: "directives follow a predictable lifecycle"
    acceptance_criteria:
      - "Given a draft directive. When activation occurs. Then the directive transitions to active."
      - "Given an active directive. When retirement occurs. Then the directive transitions to deprecated and CG-IR nodes are marked deprecated."
      - "Given a deprecated directive. When directive.modify is attempted. Then the request is rejected (INV-DL-004) with no new revision."
      - "Given a fork operation. When completed. Then two new execution_ids exist sharing the parent lineage_id."
