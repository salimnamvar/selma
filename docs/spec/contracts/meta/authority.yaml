# authority.yaml
# Normative source for contract authority hierarchy.
# Defines which contracts are authoritative for which concerns.

contract_id: "meta.authority"
schema_version: "1.0.0"
design_contract_version: "1.2.0"
owner: null
description: >
  Defines the authority hierarchy between contract layers.
  No other contract may override this hierarchy.

authority_hierarchy:
  - layer: design_standards
    location: "docs/standards/"
    description: >
      Checkable design discipline: design freeze SSoT (VERSION + CHANGELOG.md),
      C4 ID registry (c4_registry.yaml), contract front-matter schema
      (contract.schema.json), diagram header rules, and alignment checker
      (scripts/check_design_alignment.py). Does not define domain behavior;
      enforces consistent IDs, ownership, and a single design_contract_version.
    authority_over:
      - layer: structural_architecture
      - layer: specification_contracts
      - layer: api_surface

  - layer: structural_architecture
    location: "docs/c4-model/"
    description: >
      Structural source of truth for peers (context/container/component).
      design_contract_version stamp of docs/standards/VERSION. IDs must match
      docs/standards/c4_registry.yaml.
    authority_over:
      - layer: behavior_views
      - layer: implementation_views

  - layer: specification_contracts
    location: "docs/spec/contracts/"
    description: "Normative behavioral source — defines what the system MUST do"
    authority_over:
      - layer: schema_contracts
      - layer: directive_contracts
      - layer: behavior_views

  - layer: schema_contracts
    location: "docs/schema/"
    description: "Structural projections — defines data shapes derived from spec invariants"
    files:
      - "rule_schema.json"
      - "policy_doctrine.yaml"
    authority_over:
      - layer: directive_instances

  - layer: api_surface
    location: "docs/api/"
    description: >
      HTTP resource surface (OpenAPI 3.1). Validated with Redocly
      (docs/api/redocly.yaml). Paths and owners must match c4_registry api_resources.
    authority_over: []

  - layer: directive_contracts
    location: "docs/spec/contracts/directive/"
    description: "Directive lifecycle, identity, and amendment rules"
    authority_over:
      - layer: directive_instances

  - layer: directive_instances
    location: "directives_store (PostgreSQL dual documents)"
    description: >
      Authoritative dual-document directives authored in Selma by regulatory
      officials: executable_document (rule_schema) + policy_doctrine_document
      (policy_doctrine), linked by paired_policy_ref. System of record — there
      is no external Governance Contracts corpus in the architecture.
    authority_over: []

  - layer: behavior_views
    location: "docs/{state,sequence,activity,usecase}/"
    description: "Behavioral diagrams; must not invent peers or contradict contracts/C4"
    authority_over: []

  - layer: implementation_views
    location: "docs/{class,package,erd,deployment}/"
    description: "Implementation structure views; package/class IDs map to C4 peers"
    authority_over: []

concern_split:
  evaluation_authority:
    description: "Determines IF an artifact violates a rule"
    authoritative_sources:
      - "specification_contracts (compilation, inspection, conflict)"
      - "schema_contracts/rule_schema.json"
    non_authoritative:
      - "schema_contracts/policy_doctrine.yaml"
    rationale: "Policy doctrine provides guidance, not evaluation logic"

  guidance_authority:
    description: "Determines WHY a violation matters and HOW to fix it"
    authoritative_sources:
      - "schema_contracts/policy_doctrine.yaml"
    consumed_by:
      - "specification_contracts/finding_lifecycle (via findings guidance_only reads)"
    rationale: "Policy doctrine is the authoritative source for remediation guidance after findings exist"

  lifecycle_authority:
    description: "Determines valid finding state transitions"
    authoritative_sources:
      - "specification_contracts/finding_lifecycle"
    non_authoritative:
      - "schema_contracts/policy_doctrine.yaml"
    rationale: "Finding FSM is governed by its own contract, not by policy"

cross_references:
  - from: "specification_contracts/compilation"
    to: "state/state_machine_003_compilation_pipeline.puml"
    relationship: "state machine visualizes this contract"
  - from: "specification_contracts/finding_lifecycle"
    to: "state/state_machine_001_finding_lifecycle.puml"
    relationship: "state machine is normative for this contract"
  - from: "specification_contracts/inspection"
    to: "c4-model/c4_selma_component.puml"
    relationship: "component diagram shows structural context"
