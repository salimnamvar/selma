# versioning.yaml
# Normative source for version compatibility rules.
# Contract for version compatibility rules.

contract_id: "meta.versioning"
schema_version: "1.0.0"
owner: null
description: >
  Defines how versions work across all contract layers and the design freeze line.
  All contracts in this tree MUST follow these rules.

version_format:
  pattern: "MAJOR.MINOR.PATCH"
  regex: "^\\d+\\.\\d+\\.\\d+$"
  description: "Semantic versioning per SemVer 2.0.0"

design_freeze_line:
  name: design_contract_version
  ssot: "docs/standards/VERSION"
  changelog: "docs/standards/CHANGELOG.md"
  description: >
    The whole design under docs/ shares one freeze line. The numeric SemVer
    appears ONLY in docs/standards/VERSION. Diagrams, README banners, OpenAPI
    info.version, and registry MUST redirect to that path — they MUST NOT embed
    MAJOR.MINOR.PATCH. Individual contracts omit design_contract_version front-matter.
  redirects:
    - "docs/**/*.puml → Contract: docs/standards/VERSION"
    - "docs/**/README.md → design_contract_version: docs/standards/VERSION"
    - "docs/api/openapi.yaml → info.version: docs/standards/VERSION"
  forbidden:
    - "Embedded SemVer in PlantUML Contract headers or footers"
    - "Embedded SemVer in README design_contract_version banners"
    - "design_contract_version front-matter on contracts or c4_registry"
    - "Per-diagram Version fields as independent SemVer"
    - "Per-contract design revision distinct from VERSION"

compatibility_rules:
  - rule_id: "VER-001"
    statement: "All contracts in the same MAJOR version MUST be compatible"
    scope: "cross-layer"
    example: "spec contracts 1.x, schema contracts 1.x, directive instances 1.x"

  - rule_id: "VER-002"
    statement: "MAJOR version increment in any layer MAY break compatibility"
    scope: "cross-layer"
    requires: "Coordinated migration across all layers"

  - rule_id: "VER-003"
    statement: "MINOR version MAY add new fields/stages/states without breaking existing ones"
    scope: "within-layer"

  - rule_id: "VER-004"
    statement: "PATCH version MUST be backward-compatible bug fixes only"
    scope: "within-layer"

  - rule_id: "VER-005"
    statement: "schema_version field in each contract file MUST match this format"
    scope: "all-contracts"
    notes: >
      schema_version is the contract *body* shape version — not the design freeze
      line. It may differ per file and is unrelated to docs/standards/VERSION.

  - rule_id: "VER-006"
    statement: >
      Design freeze SemVer MUST be edited only in docs/standards/VERSION;
      all other design artifacts redirect to that path
    scope: "design-tree"
    enforcement: "scripts/check_design_alignment.py"
