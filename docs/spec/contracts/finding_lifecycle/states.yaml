# states.yaml
# Normative source for finding FSM state definitions.
# Contract for finding FSM state definitions.

contract_id: "finding_lifecycle.states"
schema_version: "1.0.0"
design_contract_version: "1.3.0"
owner_component: "findings_application"
state_machine_ref: "../../state/state_machine_001_finding_lifecycle.puml"
description: >
  Defines the 11 states of the Finding FSM. Each state has a clear
  semantics, terminal flag, and disposition mapping. The FSM governs
  all finding lifecycle transitions — no state may be added or removed
  without a MAJOR version bump.

states:
  - name: "Created"
    terminal: false
    description: "Initial state on finding creation by the inspection pipeline"
    transitions_out: ["Open"]
    transitions_in: []
    disposition: null
    notes: "System-automatic transition to Open immediately on creation"

  - name: "Open"
    terminal: false
    description: "Finding is active and awaiting action"
    transitions_out: ["Acknowledged", "Dismissed", "Waived", "Superseded"]
    transitions_in: ["Created", "Rejected"]
    disposition: "valid"
    notes: >
      Primary decision hub for human interaction. RO disposition
      (dismiss/waive/supersede) is also allowed from later non-terminal
      remediation states (see TR-FL-003/004/012) so acknowledgment cannot
      permanently block closure.

  - name: "Acknowledged"
    terminal: false
    description: "Compliance Representative has accepted the finding and begun remediation"
    transitions_out: ["Evidence Submitted", "Dismissed", "Waived", "Superseded"]
    transitions_in: ["Open"]
    disposition: "valid"
    notes: >
      Also known as 'In Remedy' in some UIs. Evidence path continues via
      evidence.submit; Regulatory Official may still dismiss, waive, or
      supersede without waiting for evidence (stale-acknowledgment closure).

  - name: "Evidence Submitted"
    terminal: false
    description: "Remediation evidence has been attached to the finding"
    transitions_out: ["Pending Verification", "Dismissed", "Waived", "Superseded"]
    transitions_in: ["Acknowledged"]
    disposition: "valid"
    notes: >
      System-automatic transition to Pending Verification on evidence receipt
      unless an RO disposition transition races first (per-finding serialization).

  - name: "Pending Verification"
    terminal: false
    description: "Evidence is awaiting review by a Regulatory Official"
    transitions_out: ["Verified", "Rejected", "Dismissed", "Waived", "Superseded"]
    transitions_in: ["Evidence Submitted"]
    disposition: "valid"
    notes: >
      Requires Regulatory Official action — no system-automatic transitions.
      RO may approve/reject evidence or take a terminal disposition.

  - name: "Verified"
    terminal: false
    description: "Regulatory Official has approved the remediation evidence"
    transitions_out: ["Closed"]
    transitions_in: ["Pending Verification"]
    disposition: "valid"
    notes: "System-automatic transition to Closed immediately after verification"

  - name: "Rejected"
    terminal: false
    description: "Regulatory Official has rejected the remediation evidence"
    transitions_out: ["Open", "Dismissed", "Waived", "Superseded"]
    transitions_in: ["Pending Verification"]
    disposition: "valid"
    notes: >
      Reopen (finding.reopen) returns to Open for re-remediation and requires
      comments. RO may instead take a terminal disposition without reopening.

  - name: "Dismissed"
    terminal: true
    description: "Finding was determined to be invalid — no action needed"
    transitions_out: []
    transitions_in:
      - "Open"
      - "Acknowledged"
      - "Evidence Submitted"
      - "Pending Verification"
      - "Rejected"
    disposition: "invalid"
    notes: "Terminal state; no outgoing transitions; remains in Finding Event Stream for audit"

  - name: "Waived"
    terminal: false
    description: "Finding is legitimate but risk is accepted by Regulatory Official"
    transitions_out: ["Closed"]
    transitions_in:
      - "Open"
      - "Acknowledged"
      - "Evidence Submitted"
      - "Pending Verification"
      - "Rejected"
    disposition: "waived"
    notes: "System-automatic transition to Closed after waive; requires SoD check"

  - name: "Superseded"
    terminal: true
    description: "Finding is superseded by a newer finding or directive update"
    transitions_out: []
    transitions_in:
      - "Open"
      - "Acknowledged"
      - "Evidence Submitted"
      - "Pending Verification"
      - "Rejected"
    disposition: "superseded"
    notes: "Terminal state; finding replaced by newer rule or finding"

  - name: "Closed"
    terminal: true
    description: "Finding lifecycle is complete"
    transitions_out: []
    transitions_in: ["Verified", "Waived"]
    disposition: null
    notes: >
      Terminal sink for Verified and Waived paths only. Dismissed and Superseded
      are independently terminal (they do not transit through Closed).

legacy_event_migration:
  description: >
    Historical event streams may contain Dismissed→Closed or Superseded→Closed
    transitions from earlier design revisions. Current design_contract_version
    1.1.0 does not emit those transitions (Dismissed and Superseded are terminal).
  rules:
    - >
      On replay/validation of historical streams: events with from_state in
      {Dismissed, Superseded} and to_state=Closed MUST be accepted as valid
      legacy records (do not fail certification replay tests solely for this).
    - >
      New emissions MUST NEVER produce Dismissed→Closed or Superseded→Closed.
      FindingFsm and API paths MUST treat Dismissed and Superseded as terminal.
    - >
      Projection rebuild MAY map a legacy Dismissed→Closed chain head to
      terminal state Dismissed (or Closed with disposition=invalid) for UI
      consistency; the raw event stream remains immutable.
    - "Implementations MUST document which projection mapping they use in runbooks"

invariants:
  - id: "INV-FL-001"
    statement: "A finding MUST be in exactly one state at any time"
    enforcement: "fsm_engine"

  - id: "INV-FL-002"
    statement: "Dismissed, Superseded, and Closed are terminal states with no outgoing transitions"
    enforcement: "fsm_engine"

  - id: "INV-FL-006"
    statement: >
      Regulatory Official disposition transitions (dismiss, waive, supersede) MUST be
      allowed from Open, Acknowledged, Evidence Submitted, Pending Verification, and
      Rejected so that Compliance Representative acknowledgment cannot permanently
      block finding closure. Certification AA-04 and sod_contract sod_test_matrix
      MUST cover SoD on all of these edges (not Open alone).
    enforcement: "fsm_engine + certification_tool (AA-04)"

  - id: "INV-FL-003"
    statement: >
      System-automatic transitions (Created→Open, Evidence Submitted→Pending Verification,
      Verified→Closed, Waived→Closed) MUST NOT require human actor and MUST be appended
      atomically with the triggering human transition in a single DB transaction (see INV-FL-020)
    enforcement: "fsm_engine"

  - id: "INV-FL-004"
    statement: "All human-initiated transitions MUST be gated by capability checks per authorization contract"
    enforcement: "fsm_engine + capability_gate"

  - id: "INV-FL-005"
    statement: "Finding FSM state transitions MUST NOT be influenced by policy_doctrine.yaml at runtime"
    enforcement: "architectural_audit (AA-02)"

stories:
  - story_id: "US-FL-001"
    as: "finding_fsm_engine"
    i_want: "to enforce strict state transitions on findings"
    so_that: "findings follow a predictable lifecycle with no illegal state jumps"
    acceptance_criteria:
      - "Given a finding in Open state. When an acknowledge action is received. Then the finding transitions to Acknowledged."
      - "Given a finding in Dismissed state. When any action is received. Then the action is rejected with FSM violation error."
      - "Given a finding is created. When the creation event is processed. Then the finding transitions automatically from Created to Open."

  - story_id: "US-FL-002"
    as: "finding_fsm_engine"
    i_want: "to track disposition alongside FSM state"
    so_that: "every finding has a clear resolution status"
    acceptance_criteria:
      - "Given a finding transitions to Dismissed. When the transition completes. Then disposition is set to 'invalid'."
      - "Given a finding transitions to Waived. When the transition completes. Then disposition is set to 'waived'."
      - "Given a finding transitions to Verified. When the transition completes. Then disposition remains 'valid'."
