# transitions.yaml
# Normative source for finding FSM transition rules.
# Contract for finding FSM transition rules.

contract_id: "finding_lifecycle.transitions"
schema_version: "1.0.0"
design_contract_version: "1.1.0"
owner_component: "findings_application"
state_machine_ref: "../../state/state_machine_001_finding_lifecycle.puml"
description: >
  Defines all allowed state transitions, their triggers, gating capabilities,
  and SoD constraints. Each transition is a discrete, auditable event appended
  to the Finding Event Stream.

transitions:
  - id: "TR-FL-001"
    from: "Created"
    to: "Open"
    trigger: "automatic"
    actor: "system"
    capability: null
    sod_check: null
    story_ref: null
    notes: "Immediate on finding creation; no human action required"

  - id: "TR-FL-002"
    from: "Open"
    to: "Acknowledged"
    trigger: "finding.acknowledge"
    actor: "compliance_representative"
    capability: "finding.acknowledge"
    sod_check: null
    story_ref: "US-FL-010"
    notes: "Compliance Representative accepts finding and begins remediation"

  - id: "TR-FL-003"
    from:
      - "Open"
      - "Acknowledged"
      - "Evidence Submitted"
      - "Pending Verification"
      - "Rejected"
    to: "Dismissed"
    trigger: "finding.dismiss"
    actor: "regulatory_official"
    capability: "finding.dismiss"
    sod_check: null
    story_ref: "US-FL-001"
    notes: >
      Regulatory Official determines finding is invalid. Allowed from any
      non-terminal remediation state so a stalled acknowledgment cannot block
      disposition (stale-acknowledgment closure). Not allowed from Created
      (system-only) or Verified/Waived (system auto-close paths).

  - id: "TR-FL-004"
    from:
      - "Open"
      - "Acknowledged"
      - "Evidence Submitted"
      - "Pending Verification"
      - "Rejected"
    to: "Waived"
    trigger: "finding.waive"
    actor: "regulatory_official"
    capability: "finding.waive"
    sod_check:
      type: "creator_cannot_waive"
      description: "Actor MUST NOT be in creator_provenance for the finding's directive"
      fields:
        - "finding.control_id"
        - "creator_provenance (from CG-IR snapshot)"
      enforcement_point: "finding_fsm_engine"
      denial_code: "403 CapabilityDenied"
      denial_reason: "segregation of duties violation"
    story_ref: "US-SD-001"
    notes: >
      Regulatory Official accepts risk; SoD check required before transition.
      Same multi-state source set as TR-FL-003 (stale-acknowledgment closure).

  - id: "TR-FL-005"
    from: "Acknowledged"
    to: "Evidence Submitted"
    trigger: "evidence.submit"
    actor: "compliance_representative"
    capability: "evidence.submit"
    sod_check: null
    story_ref: "US-FL-010"
    notes: "Compliance Representative attaches remediation evidence"

  - id: "TR-FL-006"
    from: "Evidence Submitted"
    to: "Pending Verification"
    trigger: "automatic"
    actor: "system"
    capability: null
    sod_check: null
    story_ref: null
    notes: "Immediate on evidence receipt; no human action required"

  - id: "TR-FL-007"
    from: "Pending Verification"
    to: "Verified"
    trigger: "finding.approve_remediation"
    actor: "regulatory_official"
    capability: "finding.approve_remediation"
    sod_check:
      type: "submitter_cannot_approve"
      description: "Actor MUST NOT be the same actor who submitted the evidence"
      fields:
        - "actor (current request)"
        - "evidence_submitter (from Finding Event Stream DispositionChanged events)"
      enforcement_point: "finding_fsm_engine"
      denial_code: "403 CapabilityDenied"
      denial_reason: "segregation of duties violation"
    story_ref: "US-SD-002"
    notes: "Regulatory Official approves remediation; triggers automatic Verified→Closed"

  - id: "TR-FL-008"
    from: "Pending Verification"
    to: "Rejected"
    trigger: "finding.reject_remediation"
    actor: "regulatory_official"
    capability: "finding.reject_remediation"
    sod_check: null
    story_ref: "US-FL-010"
    notes: "Regulatory Official rejects remediation evidence"

  - id: "TR-FL-009"
    from: "Rejected"
    to: "Open"
    trigger: "finding.reopen"
    actor: "regulatory_official"
    capability: "finding.reopen"
    sod_check: null
    story_ref: "US-FL-010"
    notes: >
      Regulatory Official reopens with comments.
      Gating capability is finding.reopen (first-class; NOT finding.reject_remediation).
      Requires comments field on transition.

  - id: "TR-FL-010"
    from: "Verified"
    to: "Closed"
    trigger: "automatic"
    actor: "system"
    capability: null
    sod_check: null
    story_ref: null
    notes: "Immediate after verification; disposition inherited as 'valid'"

  - id: "TR-FL-011"
    from: "Waived"
    to: "Closed"
    trigger: "automatic"
    actor: "system"
    capability: null
    sod_check: null
    story_ref: null
    notes: "Immediate after waive; disposition inherited as 'waived'"

  - id: "TR-FL-012"
    from:
      - "Open"
      - "Acknowledged"
      - "Evidence Submitted"
      - "Pending Verification"
      - "Rejected"
    to: "Superseded"
    trigger: "finding.supersede"
    actor: "regulatory_official"
    capability: "finding.supersede"
    sod_check:
      type: "creator_cannot_supersede"
      description: "Actor MUST NOT be in creator_provenance for the finding's directive"
      fields:
        - "finding.control_id"
        - "creator_provenance (from CG-IR snapshot)"
      enforcement_point: "finding_fsm_engine"
      denial_code: "403 CapabilityDenied"
      denial_reason: "segregation of duties violation"
    story_ref: "US-FL-012"
    notes: >
      Regulatory Official supersedes finding; requires SoD check.
      Same multi-state source set as TR-FL-003 (stale-acknowledgment closure).

event_schema:
  description: "Each transition produces a Finding Event Stream event"
  event_types:
    - "FindingCreated"
    - "DispositionChanged"
    - "FindingClosed"
    - "CapabilityDenied"
    - "SoDDenied"
  required_fields:
    - "event_id (UUID)"
    - "finding_id"
    - "event_type"
    - "timestamp (ISO 8601 UTC)"
    - "logical_clock (HLC)"
    - "actor"
    - "payload"
    - "event_hash (SHA-256)"

invariants:
  - id: "INV-FL-010"
    statement: "Every transition MUST produce an append-only event in the Finding Event Stream"
    enforcement: "finding_events_store"

  - id: "INV-FL-011"
    statement: "Events are immutable once written; event_hash ensures integrity"
    enforcement: "finding_events_store"

  - id: "INV-FL-012"
    statement: "FSM transitions MUST be rejected if the source state does not match current finding state"
    enforcement: "fsm_engine"

  - id: "INV-FL-013"
    statement: "Human-initiated transitions MUST check capability BEFORE state mutation"
    enforcement: "capability_gate"

  - id: "INV-FL-014"
    statement: "Denied transitions MUST NOT produce partial state mutation or compensating events"
    enforcement: "fsm_engine"

  - id: "INV-FL-020"
    statement: >
      System-automatic transitions (TR-FL-001 Created→Open, TR-FL-006 Evidence Submitted→Pending Verification,
      TR-FL-010 Verified→Closed, TR-FL-011 Waived→Closed) MUST be appended atomically with their triggering
      event in a single DB transaction:
      (a) Human-triggered autos (TR-FL-006/010/011): same batch as the human disposition event.
      (b) Inspection-triggered create (TR-FL-001): FindingCreated (fsm_state=Created) and the automatic
          DispositionChanged Created→Open MUST be a single atomic append batch via FindingOpenPort —
          no intermediate state where FindingCreated exists without Open.
    enforcement: "finding_events_store + findings_application"
    failure_chain: >
      If atomicity is violated: a crash after the human/create event but before the auto-transition
      leaves the finding stuck (e.g. Waived without Closed, or Created without Open — invisible to
      human workflows), producing stale UI and ghost findings in audit.
    notes: >
      Per-finding serialization (append_concurrency) ensures no interleaving of concurrent appends for
      the same finding_id. The store MUST guarantee that a single API request's FSM transition plus any
      derived automatic transitions appear as one atomic append batch.
  - id: "INV-FL-021"
    statement: >
      findings_application MUST run a Created-state sweeper: any finding whose stream shows
      FindingCreated without a subsequent Open transition older than created_open_grace
      (default 30s, environment-configurable) MUST append the missing Open transition idempotently
      (or compensate by replaying FindingOpenPort for that finding_id). Sweep interval ≤ grace.
    enforcement: "findings_application"
    failure_chain: >
      Without a sweeper, a crash between non-atomic appends permanently strands findings in Created.

  - id: "INV-FL-022"
    statement: >
      Terminal-state reconciliation sweeper: any finding whose projection/stream shows
      Verified without FindingClosed, or Waived without FindingClosed, older than
      terminal_close_grace (default 30s) MUST idempotently append the missing Closed
      transition (TR-FL-010 / TR-FL-011) with system actor. Sweep interval ≤ grace.
      Extends INV-FL-020 recovery for human→auto close paths (not only Created→Open).
    enforcement: "findings_application"
    failure_chain: >
      Without this sweeper, a crash after Verified/Waived human events leaves ghost
      pre-terminal findings invisible to closed-queue analytics and SLA reports.

  - id: "INV-FL-023"
    statement: >
      Open first-action mutex: concurrent human transitions from Open (or any
      exclusive source state) serialize per finding_id. If the source state changes
      before the lock is acquired, the second request MUST return 409 Conflict
      (not retry-as-success, not silent no-op). Idempotent retries with the same
      client_idempotency_key MAY return the original outcome.
    enforcement: "findings_application + finding_events_store append_concurrency"

  - id: "INV-FL-024"
    statement: >
      Human finding transitions MUST accept an optional client_idempotency_key
      (request header or body). Within the idempotency retention window, a retry
      with the same (finding_id, capability, actor sod_identity, client_idempotency_key)
      MUST NOT append a second disposition event; return the original result.
    enforcement: "findings_application"

  - id: "INV-FL-025"
    statement: >
      Cross-store inspection completion: inspection snapshot write to artifacts_store
      and finding birth via FindingOpenPort (finding_events_store) MUST use a saga or
      outbox pattern so "Completed" is never visible with zero findings when the
      evaluator produced Fail|Partial|NeedsReview detections. Patterns (one required):
      (a) write artifact as pending, birth findings, then mark artifact completed; or
      (b) birth findings first then write artifact, with a sweeper that retries
      incomplete pairs. Backfill into the same inspection_id is forbidden only after
      both sides are durably Completed; incomplete pairs MUST be retried or marked
      Failed (not Completed). Orphaned blobs MUST be GC'd by reconciliation job.
    enforcement: "inspections_application + findings_application"
    failure_chain: >
      Report commit + failed finding birth without saga = permanent data loss
      (reinspect requires new id; completed inspection with zero findings).

  - id: "INV-FL-026"
    statement: >
      Legacy Dismissed→Closed events may appear on replay of pre-v1 streams only.
      The live FSM MUST NOT emit Dismissed→Closed. On replay, treat as accepted
      no-op (state remains Dismissed terminal). Operators MUST document migration
      of any historical Closed-after-Dismissed projections before upgrading.
    enforcement: "findings_application replay"

  - id: "INV-FL-027"
    statement: >
      Open-state SLA: findings remaining in Open longer than open_state_sla
      (default 30 days, environment-configurable) MUST emit OpenSlaBreached
      telemetry (and optional operator notification). Auto-dismiss is NOT required
      by default; operators MAY configure auto-disposition with a documented reason.
    enforcement: "findings_application sweeper"

stories:
  - story_id: "US-FL-010"
    as: "finding_fsm_engine"
    i_want: "to gate all human transitions on capability checks"
    so_that: "only authorized actors can change finding state"
    acceptance_criteria:
      - "Given a finding in Open state. When a Compliance Representative calls finding.acknowledge. Then the transition succeeds and an event is appended."
      - "Given a finding in Open state. When an actor without finding.waive capability calls finding.waive. Then the transition is rejected with 403 CapabilityDenied and no state change occurs."
      - "Given a finding in Pending Verification state. When the evidence submitter calls finding.approve_remediation. Then the transition is rejected with 403 CapabilityDenied (SoD violation)."

  - story_id: "US-FL-011"
    as: "finding_fsm_engine"
    i_want: "to produce append-only events for every transition"
    so_that: "the Finding Event Stream provides a complete audit trail"
    acceptance_criteria:
      - "Given any valid FSM transition. When the transition completes. Then a new event is appended to the Finding Event Stream with event_hash and HLC ordering."
      - "Given an event is written. When a subsequent read occurs. Then the event is unchanged (immutability)."
