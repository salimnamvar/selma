# sod_contract.yaml
# Normative source for Segregation of Duties (SoD) rules.
# Contract for Segregation of Duties rules.

contract_id: "finding_lifecycle.sod"
schema_version: "1.0.0"
design_contract_version: "1.3.0"
owner_component: "findings_application"
description: >
  Defines segregation of duties constraints that prevent conflicts of interest
  in finding lifecycle operations. These rules are enforced at FSM transition
  gates and capability enforcement points.

# Architectural placement (trusted computing base)
# `finding_fsm_engine` in enforcement_point fields is the contract alias for the
# domain service `FindingFsm` in `findings_domain` (class diagram cd_001).
# SoD checks run inside that domain service before any append to
# finding_events_repository. Application use cases (findings_application)
# orchestrate; they MUST NOT reimplement SoD outside FindingFsm.
enforcement_architecture:
  engine_alias: "finding_fsm_engine"
  domain_type: "FindingFsm"
  domain_package: "findings_domain"
  application_package: "findings_application"
  rules:
    - "SoD predicates (SOD-001…003) execute inside FindingFsm.transition before event append"
    - "Capability catalog gates remain at api; SoD is an additional domain invariant"
    - "Package diagrams MAY omit a separate box for FindingFsm; class diagram is normative for type placement"
    - "See INV-ES-007 for sole write path; chain_hash detects bypass store writes"
    - >
      SoD runs at every legal transition, including all INV-FL-006 RO disposition
      edges (not only Open→*). Certification AA-04 requires the expanded test matrix.

sod_test_matrix:
  description: >
    Certification requirement (AA-04): enumerate all legal RO-disposition
    transitions and verify SoD / capability gates. Approximate size: 5 source
    states × 3 disposition actions = 15 RO disposition cases, plus approve_remediation
    SoD from Pending Verification.
  scope_rationale: >
    The 5 source states {Open, Acknowledged, Evidence Submitted, Pending
    Verification, Rejected} are exactly the states from which a Regulatory
    Official can perform a disposition action under transitions.yaml
    (TR-FL-003/004/012). Created is system-only (TR-FL-001) with no human
    disposition; Verified and Waived auto-close to Closed via system events
    (TR-FL-010/011); Closed, Dismissed, and Superseded are terminal. SoD is
    therefore only enforceable from these 5 states, and AA-04 coverage of
    exactly this matrix is complete. finding.dismiss has no SoD predicate
    (capability-only); waive/supersede carry SOD-001/SOD-003, and
    approve_remediation carries SOD-002 from Pending Verification.
  source_states_for_ro_disposition:
    - "Open"
    - "Acknowledged"
    - "Evidence Submitted"
    - "Pending Verification"
    - "Rejected"
  actions:
    - action: "finding.dismiss"
      sod_rule: null
      note: "Capability only; no creator_provenance SoD"
    - action: "finding.waive"
      sod_rule: "SOD-001"
      check: "sod_identity(actor) NOT IN creator_provenance(finding)"
    - action: "finding.supersede"
      sod_rule: "SOD-003"
      check: "sod_identity(actor) NOT IN creator_provenance(finding)"
    - action: "finding.reopen"
      sod_rule: null
      note: "Capability finding.reopen only; mandatory comments"
  additional:
    - action: "finding.approve_remediation"
      from: "Pending Verification"
      sod_rule: "SOD-002"
      check: "actor != evidence_submitter"
  required_assertions_per_case:
    - "Allow when SoD predicate passes (and capability present)"
    - "Deny 403 when SoD predicate fails; FSM state unchanged; SoDDenied or CapabilityDenied audit"
  denial_audit_spool: >
    SoDDenied appends use finding_events_repository. On finding_events_store
    outage, findings_application MUST spool SoDDenied to the same disk-backed
    DLQ contract as DenialAuditPort (Channel A) so denied_actions_view does not
    under-report SoD violations. See finding_events_store denial_audit_amplification.outage_resilience.

creator_provenance_semantics:
  description: >
    Normative definition of creator_provenance used by SOD-001 and SOD-003.
    Closes multi-account SoD bypass and multi-control ambiguity.
  identity_space: >
    Entries are natural_person_id values (authentication.yaml). JWT sub alone
    is insufficient for production SoD.
  definition: >
    creator_provenance(finding) is the sorted-set union of authored_by
    natural_person_id values for EVERY control_id that contributed to the
    finding's birth (composite detections: union across all control_ids on
    the finding). For a single-control finding this reduces to the provenance
    of that control's CG-IR node.
  cumulative_authorship: >
    authored_by at directive.create is the creating actor's natural_person_id.
    On directive.modify, authored_by of the new revision is the modifying
    actor; creator_provenance for compiled controls is the sorted-set union of
    authored_by across all revisions that contributed to the control's
    semantic body (not only the latest publisher). This prevents SoD bypass
    when A authors, B publishes a no-op, and A waives.
  inheritance:
    - "directive.create: authored_by = natural_person_id of authenticated actor"
    - "directive.modify: union prior creator_provenance with modifying actor"
    - "fork: child inherits parent creator_provenance; adding child author on first child modify"
    - "split: each child inherits parent creator_provenance"
    - "merge: creator_provenance = sorted-set union of all parent creator_provenance sets"
  composite_findings: >
    If finding.control_ids is a multi-control set, SoD fails if sod_identity(actor)
    is in ANY control's creator_provenance (union semantics).
  projection_freshness: >
    FindingFsm MAY use FindingProjection for creator_provenance and
    evidence_submitter. Projection MUST be updated in the same DB transaction
    as event append. If projection is unavailable or checksum-stale vs chain
    head, FindingFsm MUST fall back to event-stream replay before SoD allow.
    Stale-projection allow is non-conformant.
  missing_provenance: >
    If creator_provenance cannot be resolved (missing CG-IR node, GC'd snapshot
    without retained provenance), SoD MUST deny with 403 and audit reason
    provenance_unavailable (fail-closed).

sod_rules:
  - rule_id: "SOD-001"
    name: "Creator Cannot Waive Own Findings"
    description: >
      An actor who authored a directive MUST NOT waive findings raised by that
      directive. This prevents rule authors from dismissing their own compliance
      failures.
    capability: "finding.waive"
    constraint:
      type: "actor_not_in_creator_provenance"
      check: "sod_identity(actor) NOT IN creator_provenance(finding)"
      fields:
        - "sod_identity(actor) = natural_person_id (production) or sub (non-prod fallback)"
        - "finding.control_ids (one or more directive execution IDs)"
        - "creator_provenance (sorted union of natural_person_id from CG-IR node provenance)"
    enforcement_point: "finding_fsm_engine"
    denial:
      code: "403 CapabilityDenied"
      reason: "segregation of duties: creator cannot waive own findings"
      audit: true
    provenance_source: "metadata.audit.authored_by (compiled to creator_provenance at snapshot time)"
    story_refs: ["US-SD-001"]

  - rule_id: "SOD-002"
    name: "Evidence Submitter Cannot Approve Own Remediation"
    description: >
      An actor who submitted evidence for a finding MUST NOT approve remediation
      for the same finding. This prevents self-approval of compliance fixes.
    capability: "finding.approve_remediation"
    constraint:
      type: "actor_not_evidence_submitter"
      check: "sod_identity(actor) != evidence_submitter(finding_id)"
      fields:
        - "sod_identity(actor)"
        - "finding_id"
        - "evidence_submitter (natural_person_id on EvidenceAccepted / evidence.submit DispositionChanged)"
    enforcement_point: "finding_fsm_engine"
    denial:
      code: "403 CapabilityDenied"
      reason: "segregation of duties: evidence submitter cannot approve own remediation"
      audit: true
    provenance_source: "Finding Event Stream (DispositionChanged events)"
    story_refs: ["US-SD-002"]

  - rule_id: "SOD-003"
    name: "Creator Cannot Supersede Own Findings"
    description: >
      An actor who authored a directive MUST NOT supersede findings raised by that
      directive. This prevents rule authors from silently replacing findings they caused.
    capability: "finding.supersede"
    constraint:
      type: "actor_not_in_creator_provenance"
      check: "sod_identity(actor) NOT IN creator_provenance(finding)"
      fields:
        - "sod_identity(actor)"
        - "finding.control_ids"
        - "creator_provenance (sorted union of natural_person_id)"
    enforcement_point: "finding_fsm_engine"
    denial:
      code: "403 CapabilityDenied"
      reason: "segregation of duties: creator cannot supersede own findings"
      audit: true
    provenance_source: "metadata.audit.authored_by (compiled to creator_provenance at snapshot time)"
    story_refs: ["US-SD-003"]

capability_matrix:
  description: "Role-based capability assignments (mirror role_matrix.yaml; role_matrix is SSoT)"
  roles:
    - name: "regulatory_official"
      description: "Rule author and governance owner (Human or AI Agent)"
      capabilities:
        - "directive.create"
        - "directive.modify"
        - "directive.retire"
        - "directive.fork"
        - "directive.merge"
        - "directive.restore"
        - "finding.view"
        - "finding.dismiss"
        - "finding.waive"
        - "finding.approve_remediation"
        - "finding.reject_remediation"
        - "finding.reopen"
        - "finding.supersede"
        - "inspection.view"
        - "analytics.view"
        - "conflict.resolve"
        - "audit.view"

    - name: "compliance_representative"
      description: "Compliance seeker and remediation owner (Human or System)"
      capabilities:
        - "inspection.submit"
        - "inspection.reinspect"
        - "inspection.view"
        - "finding.view"
        - "finding.acknowledge"
        - "evidence.submit"
        - "analytics.view"

    - name: "system"
      description: "Automated processes and services"
      capabilities:
        - "inspection.submit"
        - "inspection.view"
        - "finding.view"
        - "analytics.view"

    - name: "auditor"
      description: "Read-only audit principal"
      capabilities:
        - "finding.view"
        - "inspection.view"
        - "analytics.view"
        - "audit.view"

enforcement_gates:
  - gate: "request_ingress"
    location: "API Gateway / Command Handler"
    description: "All mutating capabilities checked before dispatch"
    failure: "403 CapabilityDenied; no state mutation; audit log entry"

  - gate: "directive_mutations"
    location: "api → directives_application"
    description: "directive.* capabilities checked"
    failure: "Reject before write lock acquired"

  - gate: "inspection_submit"
    location: "api → inspections_application"
    description: "inspection.submit, inspection.reinspect checked"
    failure: "Reject before target validation"

  - gate: "finding_fsm_transitions"
    location: "findings_application"
    description: "Per-transition capability + SoD checks"
    failure: "Reject transition; FSM state unchanged; no event appended"

  - gate: "conflict_resolution"
    location: "ResolveConflict (domain service)"
    description: "conflict.resolve checked"
    failure: "Reject; Conflict Artifact remains open"

failure_semantics:
  description: "Uniform failure behavior across all gates"
  rules:
    - "Deny = hard reject; no partial writes, no compensating events"
    - "All denials produce append-only audit record: {actor, capability, action, outcome: denied, timestamp, reason}"
    - "Escalation is NOT automatic on denial; caller receives error and decides next action"
    - "Delegation model: not supported in v8.2.2; capabilities bind directly to actor identity"

invariants:
  - id: "INV-SD-001"
    statement: "creator_provenance MUST be non-empty for every active rule in CG-IR snapshot"
    enforcement: "compile_time_validation"

  - id: "INV-SD-002"
    statement: "creator_provenance MUST be sorted array of unique natural_person_id values"
    enforcement: "compile_time_validation"

  - id: "INV-SD-003"
    statement: "SoD checks MUST execute BEFORE state mutation in FSM transitions"
    enforcement: "fsm_engine"

  - id: "INV-SD-004"
    statement: "Denied SoD transitions MUST produce audit log entry with actor, capability, action, and denial reason"
    enforcement: "audit_log"

  - id: "INV-SD-005"
    statement: >
      SoD actor identity MUST be natural_person_id in production; multi-account
      humans sharing natural_person_id share one SoD identity
    enforcement: "FindingFsm + authentication"

  - id: "INV-SD-006"
    statement: >
      Composite findings: SoD uses union of creator_provenance across all
      control_ids on the finding; actor in any control's provenance is denied
    enforcement: "FindingFsm"

  - id: "INV-SD-007"
    statement: >
      SoD against stale projection is non-conformant; use sync projection update
      or stream-replay fallback (creator_provenance_semantics.projection_freshness)
    enforcement: "FindingFsm"

  - id: "INV-SD-008"
    statement: "Missing creator_provenance resolves fail-closed (deny + audit provenance_unavailable)"
    enforcement: "FindingFsm"

stories:
  - story_id: "US-SD-001"
    as: "finding_fsm_engine"
    i_want: "to prevent directive creators from waiving findings they caused"
    so_that: "compliance failures cannot be dismissed by the responsible party"
    acceptance_criteria:
      - "Given a finding raised by directive TRAF-001. When the actor who authored TRAF-001 attempts finding.waive. Then the action is denied with 403 CapabilityDenied."
      - "Given a finding raised by directive TRAF-001. When an actor NOT in creator_provenance attempts finding.waive. Then the action succeeds."
      - "Given a merged directive with creator_provenance = [actor-A, actor-B]. When actor-A attempts finding.waive. Then the action is denied (actor appears in provenance)."

  - story_id: "US-SD-002"
    as: "finding_fsm_engine"
    i_want: "to prevent evidence submitters from approving their own remediation"
    so_that: "compliance fixes receive independent review"
    acceptance_criteria:
      - "Given a finding where actor-X submitted evidence. When actor-X attempts finding.approve_remediation. Then the action is denied with 403 CapabilityDenied."
      - "Given a finding where actor-X submitted evidence. When actor-Y (different actor) attempts finding.approve_remediation. Then the action succeeds."

  - story_id: "US-SD-003"
    as: "finding_fsm_engine"
    i_want: "to prevent directive creators from superseding findings they caused"
    so_that: "compliance failures cannot be silently replaced by the responsible party"
    acceptance_criteria:
      - "Given a finding raised by directive TRAF-001. When the actor who authored TRAF-001 attempts finding.supersede. Then the action is denied with 403 CapabilityDenied."
      - "Given a finding raised by directive TRAF-001. When an actor NOT in creator_provenance attempts finding.supersede. Then the action succeeds."
      - "Given a merged directive with creator_provenance = [actor-A, actor-B]. When actor-A attempts finding.supersede. Then the action is denied (actor appears in provenance)."

  - story_id: "US-SD-004"
    as: "finding_fsm_engine"
    i_want: "to enforce capability checks at all mutation gates"
    so_that: "unauthorized actions are rejected before any state change"
    acceptance_criteria:
      - "Given any FSM transition request. When the actor lacks the required capability. Then the transition is rejected with 403 CapabilityDenied and no state mutation occurs."
      - "Given a denied capability check. When the denial is processed. Then an audit record is created with actor, capability, action, outcome, timestamp, and reason."
