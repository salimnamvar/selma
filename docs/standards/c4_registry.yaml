# =============================================================================
# Selma — Canonical C4 Registry (machine-readable SSoT for structural IDs)
# =============================================================================
# Authority: docs/c4-model/ (diagrams) + this file (checkable ID set).
# All contracts, OpenAPI, PlantUML headers, and prose MUST use these IDs only
# for product peers. Non-peers are listed separately and must never be
# presented as C4 Context/Container/Component peers.
#
# design_contract_version is a STAMP of docs/standards/VERSION (sole SSoT).
# Do not edit the version here — bump VERSION, then:
#   python scripts/check_design_alignment.py --fix
# Stamps: this field, contract front-matter, PlantUML Contract headers,
# section README banners, OpenAPI info.version. See CHANGELOG.md.
# =============================================================================

design_contract_version: "1.1.0"  # stamp of VERSION — not an independent version
schema_version: "1.0.0"

dependency_rule: >
  clients → api → *_application → *_repository | *_gateway | peer application ports → *_store | externals.
  Narrow gate exception: api → DenialAuditPort.AppendDenial only (implemented by findings_infrastructure;
  MUST NOT expose FindingEventRepository mutation methods to api).
  Peer use-case coupling is port-mediated: inspections_application → FindingOpenPort (owned by findings_application).
  Compile coupling is store-mediated: directives_application enqueues compile_request outbox; compilation_application drains it — no direct app→app compile edge.

layer_postfix:
  store: "{resource}_store"
  application: "{resource|process}_application"
  repository: "{resource}_repository"
  gateway: "{external}_gateway"
  gate: "api"
  package: "{resource}_{domain|application|infrastructure}"

# --- Product peers (may appear as C4 entities) --------------------------------
peers:
  actors:
    - id: regulatory_official
      display_name: Regulatory Official
      kind: actor
    - id: compliance_representative
      display_name: Compliance Representative
      kind: actor

  systems:
    - id: selma
      display_name: Selma
      kind: system
    - id: target_sources
      display_name: Target Sources
      kind: external_optional

  containers:
    - id: clients
      display_name: Clients
      kind: container
      tech: "CLI / Web / Desktop / Mobile"
    - id: application
      display_name: Application
      kind: container
      tech: "REST API / Python / RE2 / JSON Schema / SHA-256"

  stores:
    - id: directives_store
      display_name: Directives Store
      kind: store
      tech: PostgreSQL
      repository: directives_repository
    - id: compiled_rules_store
      display_name: Compiled Rules Store
      kind: store
      tech: Content-Addressed Storage
      repository: compiled_rules_repository
    - id: finding_events_store
      display_name: Finding Events Store
      kind: store
      tech: "PostgreSQL (append-only table)"
      repository: finding_events_repository
    - id: artifacts_store
      display_name: Artifacts Store
      kind: store
      tech: Object Store
      repository: artifacts_repository

  components:
    - id: api
      display_name: API
      kind: gate
      ca_ring: interface_adapter_driving
    - id: directives_application
      display_name: Directives Application
      kind: application
      ca_ring: application
    - id: compilation_application
      display_name: Compilation Application
      kind: application
      ca_ring: application
      hermetic: true
    - id: inspections_application
      display_name: Inspections Application
      kind: application
      ca_ring: application
    - id: findings_application
      display_name: Findings Application
      kind: application
      ca_ring: application
    - id: directives_repository
      display_name: Directives Repository
      kind: repository
      ca_ring: interface_adapter_driven
      store: directives_store
    - id: compiled_rules_repository
      display_name: Compiled Rules Repository
      kind: repository
      ca_ring: interface_adapter_driven
      store: compiled_rules_store
    - id: finding_events_repository
      display_name: Finding Events Repository
      kind: repository
      ca_ring: interface_adapter_driven
      store: finding_events_store
    - id: artifacts_repository
      display_name: Artifacts Repository
      kind: repository
      ca_ring: interface_adapter_driven
      store: artifacts_store
    - id: target_sources_gateway
      display_name: Target Sources Gateway
      kind: gateway
      ca_ring: interface_adapter_driven
      external: target_sources
      optional: true

# --- Allowed owner_component values for contracts -----------------------------
# Peers from components + stores repositories already listed.
# Plus explicit non-peer owners used only as contract owners, never as C4 peers.
allowed_owner_components:
  - api
  - directives_application
  - compilation_application
  - inspections_application
  - findings_application
  - directives_repository
  - compiled_rules_repository
  - finding_events_repository
  - artifacts_repository
  - target_sources_gateway
  - certification_tool   # offline/CI only — not a C4 peer
  # meta contracts may set owner_component: null

# --- Non-peers (must not appear as C4 Context/Container/Component) ------------
non_peers:
  - id: ResolveConflict
    kind: domain_service
    lives_in: "compilation_application / inspections_application (in-process); package conflicts_domain"
  - id: DenialAuditPort
    kind: application_port
    lives_in: "application-owned port; consumer api; implementer DenialAuditAdapter in findings_infrastructure (ISP-split from FindingEventRepository)"
  - id: FindingOpenPort
    kind: application_port
    lives_in: "findings_application-owned; consumer inspections_application; opens findings (FindingCreated+Open atomic batch)"
  - id: DenialAuditAdapter
    kind: infrastructure_adapter
    lives_in: "findings_infrastructure; implements DenialAuditPort only; may share connection pool with FindingEventRepository adapter but MUST NOT expose full repository surface to api"
  - id: certification_tool
    kind: offline_tool
    lives_in: "CI / local; may write artifacts_store kind=certification"
  - id: guidance_read_models
    kind: findings_read_model
    lives_in: "findings_application (guidance_only + analytics.view); doctrine by paired_policy_ref revision"
  - id: cicd_client
    kind: optional_client
  - id: audit_export
    kind: ops_export
  - id: remediation_ticketing
    kind: optional_notify

# --- Package aliases (not C4 peer IDs; documentation only) --------------------
# Package modules may use resource-prefixed names that differ from C4 process IDs.
package_aliases:
  - package: compiled_rules_application
    c4_peer: compilation_application
    note: "Package emphasizes resource written; C4 emphasizes hermetic compile process"
  - package: compiled_rules_infrastructure
    c4_peer: compiled_rules_repository
    note: "Implements CompiledRulesRepository port"

# --- API resource surface (must match docs/api/openapi.yaml) ------------------
api_resources:
  - id: R1
    name: Directive
    paths: ["/directives/{lineage_id}", "/directives/{lineage_id}/revisions/{revision}"]
    owner: directives_application
  - id: R2
    name: Compilation
    paths: ["/directives/{lineage_id}/compilations"]
    owner: compilation_application
  - id: R3
    name: Inspection
    paths: ["/inspections", "/inspections/{inspection_id}"]
    owner: inspections_application
  - id: R4
    name: Finding
    paths: ["/findings/{finding_id}", "/findings/{finding_id}/events", "/findings/{finding_id}/guidance"]
    owner: findings_application
  - id: R5
    name: Artifact
    paths: ["/artifacts", "/artifacts/{artifact_id}", "/artifacts/{artifact_id}/resolutions"]
    owner: artifacts_repository

# --- Forbidden ID aliases (stale names from prior designs) --------------------
forbidden_ids:
  - directive_store          # use directives_store
  - event_store              # use finding_events_store
  - evidence_store           # use artifacts_store
  - rule_store               # use compiled_rules_store
  - governance_contracts     # removed external corpus
  - PolicyDoctrineReader     # doctrine via directives_repository only
  - AnalyticsEngine
  - ConflictEngine
  - GuidanceEngine
  - CompilationEngine
  - DetectionEngine          # evaluators under inspections path only

# Package-resource names that are valid package prefixes but MUST NEVER appear
# as C4 peer IDs / Component() entities (naming dual guardrail).
forbidden_c4_peer_ids:
  - compiled_rules_application    # C4 peer is compilation_application
  - compiled_rules_infrastructure # C4 peer is compiled_rules_repository
