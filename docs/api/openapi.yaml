openapi: "3.1.0"

info:
  title: Selma API
  version: "docs/standards/VERSION"
  description: |
    Resource-oriented HTTP surface for **Selma** (`rest_interface` / C4 peer **`api`**).

    Designed per **[AIP-121 Resource-oriented design](https://google.aip.dev/121)** and
    **[AIP-136 Custom methods](https://google.aip.dev/136)**:

    - Resources are nouns; hierarchy is acyclic
    - Prefer **standard methods** Create / Get / List / Update / Delete
    - **Custom methods** use `POST` (or `GET` when read-only) with `:` + camelCase verb
    - Same resource schema for Create/Get/Update/List items of a type
    - Every collection supports Get + List (except true singletons)
    - Stateless request/response protocol

    **This document owns:** path inventory, operationIds (ROD use-case mapping),
    request/response wire schemas, shared parameters, error envelope shapes,
    security scheme declaration. Normative behavior lives under `docs/spec/contracts/`.

    ## Resources (nouns)

    | # | Resource | Collection | Standard | Custom (AIP-136) | C4 owner |
    |---|----------|------------|----------|------------------|----------|
    | R1 | Directive | `/directives` | Create List Get Update Delete(soft) · Get revision | `:fork` `:merge` `:split` `:restore` | `directives_application` |
    | R2 | Compilation | `/compilations` | Create List Get | — | `compilation_application` |
    | R3 | Inspection | `/inspections` | Create List Get | — | `inspections_application` |
    | R4 | Finding | `/findings` | List Get · List events · Get guidance | `:transitionFinding` `:attachEvidence` · collection `:listFindingAggregates` | `findings_application` |
    | R5 | Artifact | `/artifacts` | List Get | `:reviewConflictArtifact` | `artifacts_repository` |

    **Not freestanding resources/peers:** domain `ResolveConflict`, offline
    `certification_tool`, pipeline stage names, `DrainOutbox`.

    ## operationId = ROD use case (camelCase)

    `createDirective` ↔ `CreateDirective`, `transitionFinding` ↔ `TransitionFinding`, …

  contact:
    name: Selma Team
  license:
    name: Proprietary
    url: https://selma.dev/license

servers:
  - url: http://localhost:8000/api/v1
    description: Local development
  - url: https://api.selma.dev/v1
    description: Production

security:
  - BearerAuth: []

tags:
  - name: Directives
    description: Directive resource (`directives_application`)
  - name: Compilations
    description: Compilation / CgIrSnapshot resource (`compilation_application`)
  - name: Inspections
    description: Inspection resource (`inspections_application`)
  - name: Findings
    description: Finding resource (`findings_application`)
  - name: Guidance
    description: Guidance singleton under Finding
  - name: Artifacts
    description: Write-once Artifact resource (`artifacts_repository`)

