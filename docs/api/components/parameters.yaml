components:
  parameters:
    LineageId:
      name: lineage_id
      in: path
      required: true
      description: Immutable directive lineage identifier (e.g. SC101, TRAF001).
      schema:
        type: string
        pattern: "^[A-Z]{2,5}\\d{3}[A-Z]?$"
      examples:
        sc101: { value: SC101 }
        traf: { value: TRAF001 }

    Revision:
      name: revision
      in: path
      required: true
      description: Directive revision number (1-based).
      schema:
        type: integer
        minimum: 1

    CompilationHash:
      name: hash
      in: path
      required: true
      description: Content-addressed compilation / CG-IR snapshot hash (SHA-256 hex).
      schema:
        type: string
        pattern: "^[a-f0-9]{64}$"

    InspectionId:
      name: inspection_id
      in: path
      required: true
      description: Inspection identifier.
      schema:
        type: string
        format: uuid

    FindingId:
      name: finding_id
      in: path
      required: true
      description: Finding identifier.
      schema:
        type: string
        format: uuid

    ArtifactId:
      name: artifact_id
      in: path
      required: true
      description: Write-once artifact identifier in artifacts_store.
      schema:
        type: string

    PageSize:
      name: page_size
      in: query
      required: false
      description: Maximum items per page (AIP-158).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    PageToken:
      name: page_token
      in: query
      required: false
      description: Opaque pagination token from a previous list response (AIP-158).
      schema:
        type: string

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated key for safe retries of mutating requests. Same actor +
        key + body returns the original result; same key + different body → 409.
        Required on mutating POSTs and directive PATCH. Retained ≥ 24h.
        Normative rules: `docs/spec/contracts/interfaces/rest_api.yaml`.
      schema:
        type: string
        minLength: 1
        maxLength: 128

    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        Optimistic concurrency for directive mutations. Value is the ETag from
        GET, format `W/"{lineage_id}:{revision}"`. Mismatch → 409 Conflict.
      schema:
        type: string

    TargetIdFilter:
      name: target_id
      in: query
      required: false
      description: Filter by target identifier.
      schema:
        type: string

    InspectionIdFilter:
      name: inspection_id
      in: query
      required: false
      description: Filter findings by inspection identifier.
      schema:
        type: string
        format: uuid

    LineageIdFilter:
      name: lineage_id
      in: query
      required: false
      description: Filter by directive lineage identifier.
      schema:
        type: string

    DirectiveStatusFilter:
      name: status
      in: query
      required: false
      description: Filter directives by lifecycle status.
      schema:
        type: string
        enum: [draft, active, deprecated, superseded]

    FsmStateFilter:
      name: fsm_state
      in: query
      required: false
      description: >
        Filter findings by FSM storage_id (finding_lifecycle.states / domain
        FindingState). Not display names with spaces.
      schema:
        type: string
        enum:
          - Created
          - Open
          - Acknowledged
          - EvidenceSubmitted
          - PendingVerification
          - Verified
          - Rejected
          - Dismissed
          - Waived
          - Superseded
          - Closed

    SeverityFilter:
      name: severity
      in: query
      required: false
      description: Filter findings by severity.
      schema:
        type: string
        enum: [critical, high, medium, low, informational]

    ArtifactKindFilter:
      name: kind
      in: query
      required: false
      description: Filter artifacts by kind.
      schema:
        type: string
        enum: [inspection, conflict, certification, evidence, other]

    ConflictStatusFilter:
      name: status
      in: query
      required: false
      description: When listing conflict artifacts, filter by binding status.
      schema:
        type: string
        enum: [open, resolved, advisory]

    AggregateScope:
      name: scope
      in: query
      required: false
      description: Aggregate scope (e.g. global, lineage, target).
      schema:
        type: string

    AggregatePeriodStart:
      name: period_start
      in: query
      required: false
      description: Inclusive start of aggregate period (ISO 8601 UTC).
      schema:
        type: string
        format: date-time

    AggregatePeriodEnd:
      name: period_end
      in: query
      required: false
      description: Exclusive end of aggregate period (ISO 8601 UTC).
      schema:
        type: string
        format: date-time
