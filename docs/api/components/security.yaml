components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT (RFC 7519) encoding actor identity. Required claims: `sub`, `exp`,
        `iat`. Recommended: `iss`, `aud`, and either `capabilities` (string array)
        or `roles` (expanded via `role_matrix.yaml`).

        **Authentication (401):** signature (JWKS), issuer, audience, expiry.
        Normative: `docs/spec/contracts/authorization/authentication.yaml`.

        **Authorization (403):** capability + SoD at the `api` gate via shared
        CapabilityEnforcer module. Catalog:
        `docs/spec/contracts/authorization/capabilities.yaml`. Denials append
        via application-owned `DenialAuditPort` (implementer:
        `DenialAuditAdapter` in findings infrastructure; port surface only).

        **Tenant model (v1):** single-tenant per deployment. JWT claims do not
        include `tenant_id`. Capability scope is the instance. Multi-tenancy
        is out of scope (see `docs/c4-model/README.md` "Tenant model").
