components:
  schemas:
    # =========================================================================
    # Wire schemas = domain aggregates / class DTOs / ERD projection columns
    # AIP-121: same resource schema across Create / Get / Update / List items
    # =========================================================================

    Error:
      type: object
      required: [error]
      description: >
        Uniform error envelope (RFC 7807-style). Code enum authority:
        docs/spec/contracts/interfaces/rest_api.yaml.
      properties:
        error:
          type: object
          required: [type, title, status, code, detail, retryable, request_id]
          properties:
            type:
              type: string
              format: uri
            title:
              type: string
            status:
              type: integer
            code:
              type: string
              enum:
                - Unauthorized
                - CapabilityDenied
                - SoDDenied
                - NotFound
                - SchemaError
                - Conflict
                - FSMError
                - RateLimited
                - UpstreamTimeout
                - InternalError
                - CompileFailure
                - CompileQueueFull
                - CASMiss
                - HashChainViolation
                - PairedPolicyRefDangling
            detail:
              type: string
            retryable:
              type: boolean
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true
            error_category:
              type: string
              enum: [transient, terminal, client_error]

    # ----- Directive (domain Directive aggregate) -----------------------------
    # JSON Schema file keeps the full dual-document view; alias name = domain type.

    Directive:
      $ref: ../schemas/directive_view.json

    DirectiveView:
      $ref: "#/components/schemas/Directive"

    DirectiveCreate:
      type: object
      required: [executable_document, policy_doctrine_document, paired_policy_ref]
      description: |
        Create body for **CreateDirective**. Class DTO `DirectiveCreateRequest`
        fields map into dual documents + paired_policy_ref.
      properties:
        lineage_id:
          type: string
          pattern: "^[A-Z]{2,5}\\d{3}[A-Z]?$"
          description: Optional client-proposed lineage id when identity contract allows
        executable_document:
          type: object
          description: ExecutableRuleDoc (rule_schema)
          additionalProperties: true
        policy_doctrine_document:
          type: object
          description: PolicyDoctrineDoc (policy_doctrine)
          additionalProperties: true
        paired_policy_ref:
          type: string
          pattern: "^[a-z][a-z0-9_]+$"
        subject:
          type: object
          additionalProperties: true
        predicate:
          type: object
          additionalProperties: true
        detection_spec:
          type: object
          additionalProperties: true
        applicability:
          type: object
          additionalProperties: true
        priority:
          type: object
          additionalProperties: true
        modality:
          type: string
          enum: [obligation, prohibition, permission]
        metadata:
          type: object
          additionalProperties: true

    DirectiveUpdate:
      type: object
      required: [changes]
      description: |
        Update body for **UpdateDirective**. Class DTO `DirectiveUpdateRequest`
        (`lineage_id` is path; `if_match` is header; `changes` is body).
      properties:
        changes:
          type: object
          description: Partial dual-document and metadata changes
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true

    DirectiveForkRequest:
      type: object
      description: "Body for custom method :fork (optional rationale)."
      properties:
        rationale:
          type: string

    DirectiveMergeRequest:
      type: object
      required: [other_lineage_id]
      description: "Body for custom method :merge (LifecycleTransitions.Merge)."
      properties:
        other_lineage_id:
          type: string
          description: Peer lineage to merge with path lineage_id
        rationale:
          type: string

    DirectiveSplitRequest:
      type: object
      description: "Body for custom method :split."
      properties:
        rationale:
          type: string

    DirectiveRestoreRequest:
      type: object
      required: [revision]
      description: "Body for custom method :restore."
      properties:
        revision:
          type: integer
          minimum: 1
          description: Source revision number (ERD restore_from_revision)
        rationale:
          type: string

    DirectiveLifecycleResponse:
      type: object
      required: [action, directives]
      description: Result of LifecycleTransitions custom methods or multi-resource ops.
      properties:
        action:
          type: string
          enum: [retire, fork, merge, split, restore]
        directives:
          type: array
          items:
            $ref: "#/components/schemas/Directive"
        primary_lineage_id:
          type: string

    ListDirectivesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Directive"
        next_page_token:
          type: string

    # ----- Compilation (domain CgIrSnapshot) ----------------------------------

    Compilation:
      type: object
      required: [status]
      description: |
        Domain `CgIrSnapshot` wire resource + run status. Identity when published:
        `cg_ir_snapshot_hash` (ERD snapshots PK / class SnapshotHash).
      properties:
        compilation_id:
          type: string
          description: Opaque run id while hash not yet known
        lineage_ids:
          type: array
          items:
            type: string
        cg_ir_snapshot_hash:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: Content-addressed snapshot hash (resource name when completed)
          readOnly: true
        frozen_env_hash:
          type: string
          pattern: "^[a-f0-9]{64}$"
          readOnly: true
        engine_version:
          type: string
          readOnly: true
        status:
          type: string
          enum: [pending, in_progress, completed, failed]
        error:
          type: [object, "null"]
          properties:
            code: { type: string }
            message: { type: string }
            stage: { type: string }
        compiled_at:
          type: [string, "null"]
          format: date-time
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
        completed_at:
          type: [string, "null"]
          format: date-time
          readOnly: true
        provenance:
          type: object
          additionalProperties: true
          readOnly: true
        _links:
          type: object
          readOnly: true
          properties:
            self:
              type: object
              properties: { href: { type: string } }

    CompilationStatus:
      $ref: "#/components/schemas/Compilation"

    CompilationRequest:
      type: object
      required: [lineage_ids]
      description: "Request for **CompileDirectives** (`lineage_ids: List~LineageId~`)."
      properties:
        lineage_ids:
          type: array
          minItems: 1
          items:
            type: string
            pattern: "^[A-Z]{2,5}\\d{3}[A-Z]?$"
        force:
          type: boolean
          default: false

    ListCompilationsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Compilation"
        next_page_token:
          type: string

    # ----- Inspection (domain Inspection aggregate) ---------------------------

    TargetSubmission:
      $ref: ../schemas/target_submission.json

    Inspection:
      type: object
      required:
        - inspection_id
        - target_id
        - status
        - finding_count
        - started_at
        - completed_at
      description: |
        Domain `Inspection` aggregate / ERD inspection_snapshots.
        Identical schema for Create response, Get, List items (AIP-121).
      properties:
        inspection_id:
          type: string
          format: uuid
          readOnly: true
        target_id:
          type: string
        target_hash:
          type: string
          pattern: "^[a-f0-9]{64}$"
          readOnly: true
        cg_ir_snapshot_hash:
          type: string
          pattern: "^[a-f0-9]{64}$"
          readOnly: true
        frozen_env_hash:
          type: string
          pattern: "^[a-f0-9]{64}$"
          readOnly: true
        engine_version:
          type: string
        inspector:
          type: string
          description: ActorId of inspector
          readOnly: true
        status:
          type: string
          enum: [completed, partial, failed]
        finding_count:
          type: integer
          minimum: 0
        findings:
          type: array
          items:
            $ref: "#/components/schemas/FindingSummary"
        findings_by_severity:
          type: object
          properties:
            critical: { type: integer }
            high: { type: integer }
            medium: { type: integer }
            low: { type: integer }
            informational: { type: integer }
        pipeline_trace:
          type: array
          description: ERD pipeline_traces ordered entries
          items:
            type: object
            properties:
              stage: { type: string }
              status: { type: string }
              duration_ms: { type: integer }
              node_id: { type: string }
        skipped_nodes:
          type: array
          items:
            type: object
            properties:
              node_id: { type: string }
              reason: { type: string }
        system_state_hash:
          type: string
          pattern: "^[a-f0-9]{64}$"
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
        _links:
          type: object
          readOnly: true
          properties:
            self:
              type: object
              properties: { href: { type: string } }
            findings:
              type: object
              properties: { href: { type: string } }

    InspectionResult:
      $ref: "#/components/schemas/Inspection"

    FindingSummary:
      type: object
      required: [finding_id, fsm_state, severity]
      description: Class DTO FindingSummary.
      properties:
        finding_id:
          type: string
          format: uuid
        fsm_state:
          $ref: "#/components/schemas/FindingState"
        severity:
          $ref: "#/components/schemas/Severity"

    ListInspectionsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Inspection"
        next_page_token:
          type: string

    # ----- Finding (domain Finding / FindingProjection) -----------------------

    FindingState:
      type: string
      description: |
        storage_id from finding_lifecycle/states.yaml (identical to domain
        FindingState enum / ERD enum). Display names with spaces are UI-only.
      enum:
        - Created
        - Open
        - Acknowledged
        - EvidenceSubmitted
        - PendingVerification
        - Verified
        - Rejected
        - Dismissed
        - Waived
        - Superseded
        - Closed

    Severity:
      type: string
      enum: [critical, high, medium, low, informational]

    Disposition:
      type: string
      description: Domain Disposition enum
      enum: [valid, invalid, waived, dismissed, superseded]

    Finding:
      $ref: ../schemas/finding_view.json

    FindingView:
      $ref: "#/components/schemas/Finding"

    FindingTransitionRequest:
      type: object
      required: [action]
      description: |
        Class DTO `FindingTransitionRequest` wire form for :transitionFinding.
      properties:
        action:
          type: string
          enum:
            - acknowledge
            - dismiss
            - waive
            - approve_remediation
            - reject_remediation
            - reopen
            - supersede
        target_state:
          $ref: "#/components/schemas/FindingState"
        reason:
          type: string
        comments:
          type: string
          description: Mandatory for reopen/supersede where contract requires

    FindingTransition:
      $ref: "#/components/schemas/FindingTransitionRequest"

    AttachEvidenceRequest:
      type: object
      required: [evidence]
      description: "Request for :attachEvidence (class AttachEvidence)."
      properties:
        evidence:
          type: object
          description: EvidenceRef payload
          additionalProperties: true
        comment:
          type: string

    EvidenceSubmission:
      $ref: "#/components/schemas/AttachEvidenceRequest"

    FindingEvent:
      type: object
      required: [event_id, finding_id, event_type, timestamp, actor, payload, event_hash]
      description: ERD events / append-only FindingEvent.
      properties:
        event_id:
          type: string
          format: uuid
          readOnly: true
        finding_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum: [FindingCreated, DispositionChanged, FindingClosed]
        trigger_command:
          type: string
        timestamp:
          type: string
          format: date-time
          readOnly: true
        logical_clock:
          type: string
          description: Hybrid logical clock encoding
          readOnly: true
        actor:
          type: string
        payload:
          type: object
          properties:
            from_state: { $ref: "#/components/schemas/FindingState" }
            to_state: { $ref: "#/components/schemas/FindingState" }
            disposition: { $ref: "#/components/schemas/Disposition" }
          additionalProperties: true
        event_hash:
          type: string
          pattern: "^[a-f0-9]{64}$"
          readOnly: true
        prev_event_hash:
          type: string
          pattern: "^[a-f0-9]{64}$"
          readOnly: true
        chain_hash:
          type: string
          pattern: "^[a-f0-9]{64}$"
          readOnly: true

    ListFindingsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        next_page_token:
          type: string

    ListFindingEventsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FindingEvent"
        next_page_token:
          type: string

    AggregateReport:
      type: object
      required: [scope, finding_counts]
      description: Domain AggregateReport / class AggregateQueryRequest result.
      properties:
        scope:
          type: string
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        finding_counts:
          type: object
          description: Map Severity → count
          additionalProperties:
            type: integer
        directive_coverage:
          type: number
          format: double
        buckets:
          type: array
          items:
            type: object
            required: [key, count]
            properties:
              key: { type: string }
              count: { type: integer, minimum: 0 }
              dimensions:
                type: object
                additionalProperties: true

    FindingAggregatesResponse:
      $ref: "#/components/schemas/AggregateReport"

    Guidance:
      $ref: ../schemas/guidance_response.json

    GuidanceResponse:
      $ref: "#/components/schemas/Guidance"

    # ----- Artifact (artifacts_store) -----------------------------------------

    Artifact:
      type: object
      required: [artifact_id, kind, created_at]
      description: |
        Write-once artifact metadata (artifacts_repository → artifacts_store).
      properties:
        artifact_id:
          type: string
          readOnly: true
        kind:
          type: string
          enum: [inspection, conflict, certification, evidence, other]
        content_hash:
          type: string
          pattern: "^[a-f0-9]{64}$"
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        payload:
          type: object
          additionalProperties: true
        _links:
          type: object
          readOnly: true
          properties:
            self:
              type: object
              properties: { href: { type: string } }

    ArtifactView:
      $ref: "#/components/schemas/Artifact"

    ListArtifactsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Artifact"
        next_page_token:
          type: string

    ConflictArtifact:
      type: object
      required: [artifact_id, status, conflicting_directives, detection_mechanism]
      description: |
        ERD conflict_artifacts payload (kind=conflict). Human resolution via
        :reviewConflictArtifact.
      properties:
        artifact_id:
          type: string
        conflict_id:
          type: string
        status:
          type: string
          enum: [open, resolved, advisory]
        binding_status:
          type: string
          enum: [open, resolved, advisory]
        detection_mechanism:
          type: string
          enum: [declared, outcome_contradiction, cross_lineage_advisory]
        conflicting_directives:
          type: array
          items:
            type: object
            properties:
              lineage_id: { type: string }
              execution_id: { type: string }
              deontic_type: { type: string }
              outcome: { type: string }
        resolution:
          type: [object, "null"]
          properties:
            resolution_type: { type: string }
            resolved_by: { type: string }
            resolved_at:
              type: string
              format: date-time
            rationale: { type: string }
        cg_ir_snapshot_hash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        created_at:
          type: string
          format: date-time
          readOnly: true
        _links:
          type: object
          readOnly: true
          properties:
            self:
              type: object
              properties: { href: { type: string } }

    ConflictView:
      $ref: "#/components/schemas/ConflictArtifact"

    ReviewConflictArtifactRequest:
      type: object
      required: [resolution_type]
      description: "Request for :reviewConflictArtifact."
      properties:
        resolution_type:
          type: string
          enum: [accept_first, accept_second, merge, manual_override]
        rationale:
          type: string
        override_priority:
          type: object
          additionalProperties: true

    ConflictResolutionRequest:
      $ref: "#/components/schemas/ReviewConflictArtifactRequest"

    CertificationResult:
      $ref: ../schemas/certification_result.json
