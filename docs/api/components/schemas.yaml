components:
  schemas:
    # ---------------------------------------------------------------------------
    # Wire schema policy
    # ---------------------------------------------------------------------------
    # Resource wire types align with C4 resources and JSON Schema files under
    # docs/api/schemas/ where those exist. Server-generated fields: readOnly.
    # Certification results are artifact payloads (kind=certification), not a
    # freestanding /certifications collection.
    # Conflict human review is artifact-backed (kind=conflict).

    Error:
      type: object
      required: [error]
      description: >
        Uniform error envelope for all API failures. Modeled on RFC 7807
        (Problem Details) with extensions for machine-readable taxonomy
        and retry guidance.
      properties:
        error:
          type: object
          required: [type, title, status, code, detail, retryable, request_id]
          properties:
            type:
              type: string
              format: uri
              description: >
                RFC 7807 type URI identifying the error class
                (e.g. 'https://selma.dev/errors/capability-denied')
            title:
              type: string
              description: Short human-readable summary of the error
            status:
              type: integer
              description: HTTP status code
            code:
              type: string
              description: >
                Machine-readable error code. Values: Unauthorized, CapabilityDenied,
                SoDDenied, NotFound, SchemaError, Conflict, FSMError,
                RateLimited, UpstreamTimeout, InternalError, CompileFailure,
                CASMiss, HashChainViolation, PairedPolicyRefDangling
              enum:
                - Unauthorized
                - CapabilityDenied
                - SoDDenied
                - NotFound
                - SchemaError
                - Conflict
                - FSMError
                - RateLimited
                - UpstreamTimeout
                - InternalError
                - CompileFailure
                - CASMiss
                - HashChainViolation
                - PairedPolicyRefDangling
            detail:
              type: string
              description: >
                Human-readable explanation specific to this occurrence
            retryable:
              type: boolean
              description: >
                true if the client MAY safely retry the same request;
                false for terminal errors (e.g. CapabilityDenied, SchemaError)
            request_id:
              type: string
              description: Unique request identifier for audit correlation
            details:
              type: object
              description: Additional structured error context
              additionalProperties: true
            error_category:
              type: string
              description: >
                Transient or terminal classification for client retry logic
              enum: [transient, terminal, client_error]

    # ----- Error taxonomy (applies to all Error responses) -----
    #
    #  Category    | Codes                                      | retryable
    #  ------------|--------------------------------------------|----------
    #  client_error| Unauthorized, CapabilityDenied, SoDDenied, | false
    #              | NotFound, SchemaError, FSMError             |
    #  terminal    | Conflict, CompileFailure, CASMiss,          | false
    #              | HashChainViolation, PairedPolicyRefDangling |
    #  transient   | RateLimited, UpstreamTimeout, InternalError | true

    # ----- Directives (directives_application) --------------------------------

    DirectiveView:
      $ref: ../schemas/directive_view.json

    DirectiveUpdate:
      type: object
      required: [content]
      description: Partial update body for a directive revision (creates a new revision).
      properties:
        content:
          type: object
          description: Updated executable + doctrine content (conforms to rule_schema / policy_doctrine)
          additionalProperties: true
        metadata:
          type: object
          description: Updated metadata
          additionalProperties: true

    # ----- Compilations (compilation_application) -----------------------------

    CompilationStatus:
      type: object
      required: [compilation_id, lineage_id, status, started_at]
      description: Hermetic compile run status for a directive lineage.
      properties:
        compilation_id:
          type: string
          description: Unique compilation identifier
        lineage_id:
          type: string
          description: Directive lineage that was compiled
        cg_ir_snapshot_hash:
          type: string
          description: Resulting CG-IR snapshot hash in compiled_rules_store
          pattern: "^[a-f0-9]{64}$"
          readOnly: true
        status:
          type: string
          enum: [pending, in_progress, completed, failed]
          description: Compilation status
        error:
          type: [object, "null"]
          description: Error details if compilation failed
          properties:
            code:
              type: string
            message:
              type: string
            stage:
              type: string
        started_at:
          type: string
          format: date-time
          readOnly: true
        completed_at:
          type: [string, "null"]
          format: date-time
          readOnly: true
        _links:
          type: object
          readOnly: true
          properties:
            self:
              type: object
              properties: { href: { type: string } }
            directive:
              type: object
              properties: { href: { type: string } }

    CompilationRequest:
      type: object
      description: Optional body when triggering a compilation.
      properties:
        force:
          type: boolean
          default: false
          description: Force recompilation even if CG-IR is current

    ListCompilationsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CompilationStatus"
        next_page_token:
          type: string

    # ----- Inspections (inspections_application) ------------------------------

    TargetSubmission:
      $ref: ../schemas/target_submission.json

    InspectionResult:
      type: object
      required:
        - inspection_id
        - target_id
        - status
        - findings_count
        - started_at
        - completed_at
      description: Immutable inspection snapshot (also stored as artifact kind=inspection).
      properties:
        inspection_id:
          type: string
          format: uuid
          readOnly: true
        target_id:
          type: string
          description: Target that was inspected
        cg_ir_snapshot_hash:
          type: string
          description: Hash of the CG-IR snapshot used for evaluation
          pattern: "^[a-f0-9]{64}$"
          readOnly: true
        status:
          type: string
          enum: [completed, partial, failed]
        findings_count:
          type: integer
          minimum: 0
        findings_by_severity:
          type: object
          properties:
            critical: { type: integer }
            high: { type: integer }
            medium: { type: integer }
            low: { type: integer }
            informational: { type: integer }
        pipeline_trace:
          type: array
          description: Ordered execution trace for each pipeline stage
          items:
            type: object
            properties:
              stage: { type: string }
              status: { type: string }
              duration_ms: { type: integer }
        skipped_nodes:
          type: array
          items:
            type: object
            properties:
              directive_id: { type: string }
              reason: { type: string }
        system_state_hash:
          type: string
          pattern: "^[a-f0-9]{64}$"
          readOnly: true
        engine_version:
          type: string
        started_at:
          type: string
          format: date-time
          readOnly: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
        _links:
          type: object
          readOnly: true
          properties:
            self:
              type: object
              properties: { href: { type: string } }
            findings:
              type: object
              properties: { href: { type: string } }
            target:
              type: object
              properties: { href: { type: string } }

    ListInspectionsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InspectionResult"
        next_page_token:
          type: string

    # ----- Findings (findings_application) ------------------------------------

    FindingView:
      $ref: ../schemas/finding_view.json

    FindingTransition:
      type: object
      required: [action]
      description: Request body for a finding FSM transition (PATCH).
      properties:
        action:
          type: string
          description: FSM transition action
          enum:
            - acknowledge
            - dismiss
            - waive
            - approve_remediation
            - reject_remediation
            - reopen
            - supersede
        comment:
          type: string
          description: Optional comment (required for reopen where contract requires it)
        evidence:
          type: object
          description: Remediation evidence payload when submitting evidence
          additionalProperties: true

    FindingEvent:
      type: object
      required: [event_id, finding_id, event_type, timestamp, actor, payload, event_hash]
      description: Append-only finding lifecycle event (finding_events_store).
      properties:
        event_id:
          type: string
          format: uuid
          readOnly: true
        finding_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum: [FindingCreated, DispositionChanged, FindingClosed]
        timestamp:
          type: string
          format: date-time
          readOnly: true
        logical_clock:
          type: string
          description: Hybrid Logical Clock value for ordering
          readOnly: true
        actor:
          type: string
        payload:
          type: object
          properties:
            from_state: { type: string }
            to_state: { type: string }
            disposition: { type: string }
          additionalProperties: true
        event_hash:
          type: string
          description: SHA-256 hash for immutability verification
          pattern: "^[a-f0-9]{64}$"
          readOnly: true

    ListFindingsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FindingView"
        next_page_token:
          type: string

    ListFindingEventsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FindingEvent"
        next_page_token:
          type: string

    GuidanceResponse:
      $ref: ../schemas/guidance_response.json

    # ----- Artifacts (artifacts_repository → artifacts_store) -----------------

    ArtifactView:
      type: object
      required: [artifact_id, kind, created_at]
      description: |
        Write-once blob metadata from artifacts_store. Kinds include inspection
        snapshots, conflict artifacts, and certification reports produced by the
        offline/CI certification_tool.
      properties:
        artifact_id:
          type: string
          readOnly: true
        kind:
          type: string
          enum: [inspection, conflict, certification, evidence, other]
        content_hash:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: SHA-256 of immutable content
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        payload:
          type: object
          description: Kind-specific body (ConflictView, CertificationResult, InspectionResult, …)
          additionalProperties: true
        _links:
          type: object
          readOnly: true
          properties:
            self:
              type: object
              properties: { href: { type: string } }

    ListArtifactsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactView"
        next_page_token:
          type: string

    ConflictView:
      type: object
      required: [conflict_id, status, conflicting_directives, detection_mechanism]
      description: |
        Conflict artifact payload (artifacts kind=conflict). Produced by domain
        service ResolveConflict during compile/inspect; human resolutions via
        POST /artifacts/{artifact_id}/resolutions.
      properties:
        conflict_id:
          type: string
        status:
          type: string
          enum: [open, resolved, advisory]
        detection_mechanism:
          type: string
          enum: [declared, outcome_contradiction, cross_lineage_advisory]
        conflicting_directives:
          type: array
          items:
            type: object
            properties:
              lineage_id: { type: string }
              execution_id: { type: string }
              deontic_type: { type: string }
              outcome: { type: string }
        resolution:
          type: [object, "null"]
          properties:
            resolution_type: { type: string }
            resolved_by: { type: string }
            resolved_at:
              type: string
              format: date-time
            rationale: { type: string }
        created_at:
          type: string
          format: date-time
          readOnly: true
        _links:
          type: object
          readOnly: true
          properties:
            self:
              type: object
              properties: { href: { type: string } }
            resolutions:
              type: object
              properties: { href: { type: string } }

    ConflictResolutionRequest:
      type: object
      required: [resolution_type]
      description: Human resolution decision for a conflict artifact.
      properties:
        resolution_type:
          type: string
          enum: [accept_first, accept_second, merge, manual_override]
        rationale:
          type: string
        override_priority:
          type: object
          description: Manual priority override (for manual_override type)
          additionalProperties: true

    CertificationResult:
      $ref: ../schemas/certification_result.json
