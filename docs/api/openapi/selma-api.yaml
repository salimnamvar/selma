openapi: "3.0.3"

info:
  title: Selma Governance API
  description: |
    REST API for the Selma governance system. Provides resource-oriented access
    to directives, inspections, findings, conflicts, and certifications.

    This specification is grounded in the normative contract suite under
    `docs/spec/contracts/`. Behavioral semantics (error codes, capability checks,
    FSM transitions) are defined there; this file specifies the HTTP surface.

    ## Authentication

    All endpoints require Bearer token authentication. Tokens encode actor
    identity and capability set. Capability checks are enforced per the
    authorization contract.

    ## Error Model

    All errors return a uniform JSON envelope with `error.code`, `error.message`,
    `error.details`, and `error.request_id`. No partial state mutation occurs on
    any error. All denials produce audit log entries.

    ## HATEOAS

    Resource responses include `_links` objects for navigation. Link relations
    follow the resource-oriented design pattern: `self`, parent collections,
    sub-resources, and related domain entities.
  version: "1.0.0"
  contact:
    name: Selma Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8000/api/v1
    description: Local development
  - url: https://api.selma.dev/v1
    description: Production

security:
  - BearerAuth: []

tags:
  - name: Directives
    description: Directive CRUD, revision history, and lifecycle operations
  - name: Compilations
    description: CG-IR compilation triggers and status
  - name: Inspections
    description: Target submission and inspection results
  - name: Findings
    description: Finding lifecycle management (FSM transitions)
  - name: Guidance
    description: Remediation guidance resolution
  - name: Conflicts
    description: Conflict detection and resolution
  - name: Certifications
    description: Architectural audit certification runs

paths:
  # ──────────────────────────────────────────────
  # Directives
  # ──────────────────────────────────────────────
  /directives/{lineage_id}:
    get:
      operationId: getDirective
      summary: Read directive by lineage_id
      description: |
        Returns the latest active revision of a directive. Read-only; no
        capability required (per rest_api.yaml).
      tags: [Directives]
      parameters:
        - $ref: "#/components/parameters/lineage_id"
      responses:
        "200":
          description: Directive document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectiveView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateDirective
      summary: Modify directive (creates new revision)
      description: |
        Updates directive content. Creates a new revision with the same
        lineage_id. Requires `directive.modify` capability. Write lock acquired
        before processing.
      tags: [Directives]
      parameters:
        - $ref: "#/components/parameters/lineage_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectiveUpdate"
      responses:
        "200":
          description: Updated directive with new revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectiveView"
        "400":
          $ref: "#/components/responses/SchemaError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CapabilityDenied"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: retireDirective
      summary: Retire directive
      description: |
        Transitions directive to deprecated status. CG-IR nodes are marked
        deprecated; no new compilations permitted. Requires `directive.retire`
        capability.
      tags: [Directives]
      parameters:
        - $ref: "#/components/parameters/lineage_id"
      responses:
        "200":
          description: Directive retired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectiveView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CapabilityDenied"
        "404":
          $ref: "#/components/responses/NotFound"

  /directives/{lineage_id}/revisions/{revision}:
    get:
      operationId: getDirectiveRevision
      summary: Read specific revision
      description: Returns a specific revision of a directive.
      tags: [Directives]
      parameters:
        - $ref: "#/components/parameters/lineage_id"
        - name: revision
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: Revision number
      responses:
        "200":
          description: Directive revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectiveView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /directives/{lineage_id}/compilations:
    post:
      operationId: triggerCompilation
      summary: Trigger compilation
      description: |
        Triggers a CG-IR compilation for the directive. Requires
        `compilation.trigger` capability. Compilation is idempotent for
        identical directive content.
      tags: [Compilations]
      parameters:
        - $ref: "#/components/parameters/lineage_id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  default: false
                  description: Force recompilation even if CG-IR is current
      responses:
        "201":
          description: Compilation triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompilationStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CapabilityDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      operationId: listCompilations
      summary: List compilations
      description: Returns compilation history for the directive.
      tags: [Compilations]
      parameters:
        - $ref: "#/components/parameters/lineage_id"
        - $ref: "#/components/parameters/page_size"
        - $ref: "#/components/parameters/page_token"
      responses:
        "200":
          description: Compilation list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CompilationStatus"
                  next_page_token:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────────────────────────────────────
  # Inspections
  # ──────────────────────────────────────────────
  /inspections:
    post:
      operationId: submitInspection
      summary: Submit target for inspection
      description: |
        Submits a target for evaluation against the current CG-IR snapshot.
        Requires `inspection.submit` capability. The 6-stage pipeline runs
        deterministically: normalize → classify → select_controls → evaluate →
        aggregate → report.
      tags: [Inspections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetSubmission"
      responses:
        "201":
          description: Inspection completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionResult"
        "400":
          $ref: "#/components/responses/SchemaError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CapabilityDenied"
    get:
      operationId: listInspections
      summary: List inspections
      description: Returns a paginated list of inspections.
      tags: [Inspections]
      parameters:
        - name: target_id
          in: query
          schema:
            type: string
          description: Filter by target ID
        - name: lineage_id
          in: query
          schema:
            type: string
          description: Filter by directive lineage
        - $ref: "#/components/parameters/page_size"
        - $ref: "#/components/parameters/page_token"
      responses:
        "200":
          description: Inspection list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/InspectionResult"
                  next_page_token:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /inspections/{inspection_id}:
    get:
      operationId: getInspection
      summary: Read inspection result
      description: Returns the immutable inspection snapshot.
      tags: [Inspections]
      parameters:
        - $ref: "#/components/parameters/inspection_id"
      responses:
        "200":
          description: Inspection snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /inspections/{inspection_id}/findings:
    get:
      operationId: listInspectionFindings
      summary: List findings from inspection
      description: Returns all findings produced by the inspection.
      tags: [Findings]
      parameters:
        - $ref: "#/components/parameters/inspection_id"
        - name: fsm_state
          in: query
          schema:
            type: string
            enum: [Created, Open, Acknowledged, "Evidence Submitted", "Pending Verification", Verified, Rejected, Dismissed, Waived, Closed]
          description: Filter by FSM state
        - name: severity
          in: query
          schema:
            type: string
            enum: [critical, high, medium, low, informational]
          description: Filter by severity
        - $ref: "#/components/parameters/page_size"
        - $ref: "#/components/parameters/page_token"
      responses:
        "200":
          description: Finding list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/FindingView"
                  next_page_token:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────────────────────────────────────
  # Findings
  # ──────────────────────────────────────────────
  /findings/{finding_id}:
    get:
      operationId: getFinding
      summary: Read finding details
      description: Returns full finding details including evidence and reasoning.
      tags: [Findings]
      parameters:
        - $ref: "#/components/parameters/finding_id"
      responses:
        "200":
          description: Finding details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateFinding
      summary: Update finding (state transition)
      description: |
        Triggers an FSM state transition on the finding. The transition is
        gated by capability checks and SoD constraints per
        finding_lifecycle/transitions.yaml. Each transition appends an
        immutable event to the Finding Event Stream.

        Valid transitions from Open: acknowledge, dismiss, waive.
        Valid transitions from Pending Verification: approve_remediation,
        reject_remediation.
        Valid transition from Rejected: reopen.
      tags: [Findings]
      parameters:
        - $ref: "#/components/parameters/finding_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindingTransition"
      responses:
        "200":
          description: Finding updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingView"
        "400":
          description: FSM error — invalid transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: FSMError
                  message: "Invalid transition: Dismissed → Acknowledged"
                  details:
                    current_state: Dismissed
                    requested_transition: acknowledge
                    allowed_transitions: []
                  request_id: req_xyz789
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Capability denied or SoD violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: CapabilityDenied
                  message: "Segregation of duties violation: actor submitted evidence"
                  details:
                    sod_check: submitter_cannot_approve
                    actor: user:alice
                    evidence_submitter: user:alice
                  request_id: req_sod001
        "404":
          $ref: "#/components/responses/NotFound"

  /findings/{finding_id}/events:
    get:
      operationId: listFindingEvents
      summary: List finding events
      description: |
        Returns the append-only Finding Event Stream for the finding.
        Events are immutable and hash-chained for integrity.
      tags: [Findings]
      parameters:
        - $ref: "#/components/parameters/finding_id"
        - $ref: "#/components/parameters/page_size"
        - $ref: "#/components/parameters/page_token"
      responses:
        "200":
          description: Event stream
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/FindingEvent"
                  next_page_token:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /findings/{finding_id}/guidance:
    get:
      operationId: getFindingGuidance
      summary: Resolve guidance for finding
      description: |
        Returns remediation guidance resolved from the paired policy reference.
        Per gate AA-02, guidance is guidance_only — never used for evaluation
        or FSM transitions.
      tags: [Guidance]
      parameters:
        - $ref: "#/components/parameters/finding_id"
      responses:
        "200":
          description: Guidance response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuidanceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────────────────────────────────────
  # Conflicts
  # ──────────────────────────────────────────────
  /conflicts:
    get:
      operationId: listConflicts
      summary: List conflicts
      description: |
        Returns detected conflicts between directives. Includes both declared
        conflicts (compile-time, from conflicts_with) and outcome contradictions
        (evaluation-time).
      tags: [Conflicts]
      parameters:
        - name: lineage_id
          in: query
          schema:
            type: string
          description: Filter by lineage
        - name: status
          in: query
          schema:
            type: string
            enum: [open, resolved, advisory]
          description: Filter by conflict status
        - $ref: "#/components/parameters/page_size"
        - $ref: "#/components/parameters/page_token"
      responses:
        "200":
          description: Conflict list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConflictView"
                  next_page_token:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CapabilityDenied"

  /conflicts/{conflict_id}/resolutions:
    post:
      operationId: resolveConflict
      summary: Submit resolution
      description: |
        Submits a resolution for a detected conflict. Requires
        `conflict.resolve` capability. Resolution outcomes are deterministic
        for identical CG-IR snapshots (gate AA-05).
      tags: [Conflicts]
      parameters:
        - name: conflict_id
          in: path
          required: true
          schema:
            type: string
          description: Conflict identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution_type]
              properties:
                resolution_type:
                  type: string
                  enum: [accept_first, accept_second, merge, manual_override]
                  description: Resolution strategy
                rationale:
                  type: string
                  description: Justification for the resolution
                override_priority:
                  type: object
                  description: Manual priority override (for manual_override type)
                  additionalProperties: true
      responses:
        "200":
          description: Conflict resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CapabilityDenied"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────────────────────────────────────
  # Certifications
  # ──────────────────────────────────────────────
  /certifications:
    post:
      operationId: triggerCertification
      summary: Trigger certification
      description: |
        Triggers an architectural audit certification run. Evaluates all 7
        gates (AA-01 through AA-07). All gates must pass for production-grade
        certification.
      tags: [Certifications]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                run_id:
                  type: string
                  description: Reference to CI pipeline or system run
                scope:
                  type: object
                  description: Certification scope (e.g. specific gates to run)
                  additionalProperties: true
      responses:
        "201":
          description: Certification triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CapabilityDenied"
    get:
      operationId: listCertifications
      summary: List certifications
      description: Returns certification run history.
      tags: [Certifications]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pass, fail, in_progress, error]
          description: Filter by status
        - $ref: "#/components/parameters/page_size"
        - $ref: "#/components/parameters/page_token"
      responses:
        "200":
          description: Certification list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CertificationResult"
                  next_page_token:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /certifications/{certification_id}:
    get:
      operationId: getCertification
      summary: Read certification result
      description: Returns full certification result including per-gate evidence.
      tags: [Certifications]
      parameters:
        - name: certification_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Certification run identifier
      responses:
        "200":
          description: Certification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  # ──────────────────────────────────────────────
  # Security
  # ──────────────────────────────────────────────
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token encoding actor identity and capability set. Issued by the
        Selma identity provider. Claims include `sub` (actor ID) and
        `capabilities` (array of capability strings).

  # ──────────────────────────────────────────────
  # Parameters
  # ──────────────────────────────────────────────
  parameters:
    lineage_id:
      name: lineage_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Z][A-Z0-9]+-[0-9]+$"
      description: "Immutable directive lineage identifier (e.g. SC101, TRAF-001)"
      examples:
        - SC101
        - TRAF-001

    inspection_id:
      name: inspection_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Inspection identifier

    finding_id:
      name: finding_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Finding identifier

    page_size:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Maximum items per page

    page_token:
      name: page_token
      in: query
      schema:
        type: string
      description: Pagination token from previous response

  # ──────────────────────────────────────────────
  # Responses
  # ──────────────────────────────────────────────
  responses:
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: Unauthorized
              message: "Missing or invalid Bearer token"
              details: {}
              request_id: req_auth001

    CapabilityDenied:
      description: Actor lacks required capability
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: CapabilityDenied
              message: "Actor lacks required capability: finding.waive"
              details:
                required_capability: finding.waive
                actor_capabilities: [finding.view, finding.acknowledge]
              request_id: req_cap001

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: NotFound
              message: "Resource not found"
              details:
                resource_type: finding
                resource_id: "f8a1b2c3-d4e5-6f78-9abc-def012345678"
              request_id: req_404001

    SchemaError:
      description: Request body fails schema validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: SchemaError
              message: "Request body validation failed"
              details:
                validation_errors:
                  - path: /target_type
                    message: "Must be one of: text, structured, binary"
              request_id: req_sch001

    Conflict:
      description: Resource state conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: Conflict
              message: "Compilation already in progress for this lineage"
              details:
                existing_compilation_id: "comp-abc123"
              request_id: req_con001

  # ──────────────────────────────────────────────
  # Schemas
  # ──────────────────────────────────────────────
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable error code
              enum:
                - Unauthorized
                - CapabilityDenied
                - NotFound
                - SchemaError
                - Conflict
                - FSMError
            message:
              type: string
              description: Human-readable error description
            details:
              type: object
              description: Additional error context
              additionalProperties: true
            request_id:
              type: string
              description: Unique request identifier for audit correlation

    TargetSubmission:
      $ref: "../schemas/target_submission.json"

    DirectiveView:
      $ref: "../schemas/directive_view.json"

    DirectiveUpdate:
      type: object
      required: [content]
      properties:
        content:
          type: object
          description: Updated directive content (conforms to rule schema)
          additionalProperties: true
        metadata:
          type: object
          description: Updated metadata
          additionalProperties: true

    FindingView:
      $ref: "../schemas/finding_view.json"

    FindingTransition:
      type: object
      required: [action]
      properties:
        action:
          type: string
          description: FSM transition action
          enum:
            - acknowledge
            - dismiss
            - waive
            - approve_remediation
            - reject_remediation
            - reopen
        comment:
          type: string
          description: Optional comment (required for reopen)
        evidence:
          type: object
          description: Remediation evidence (required for acknowledge → Evidence Submitted)
          additionalProperties: true

    FindingEvent:
      type: object
      required: [event_id, finding_id, event_type, timestamp, actor, payload, event_hash]
      properties:
        event_id:
          type: string
          format: uuid
          description: Unique event identifier
        finding_id:
          type: string
          format: uuid
          description: Finding this event belongs to
        event_type:
          type: string
          enum: [FindingCreated, DispositionChanged, FindingClosed]
          description: Event type per transitions contract
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp
        logical_clock:
          type: string
          description: Hybrid Logical Clock value for ordering
        actor:
          type: string
          description: Actor who triggered the transition
        payload:
          type: object
          description: Event-specific payload
          properties:
            from_state:
              type: string
            to_state:
              type: string
            disposition:
              type: string
          additionalProperties: true
        event_hash:
          type: string
          description: SHA-256 hash for immutability verification
          pattern: "^[a-f0-9]{64}$"

    GuidanceResponse:
      $ref: "../schemas/guidance_response.json"

    InspectionResult:
      type: object
      required:
        - inspection_id
        - target_id
        - status
        - findings_count
        - started_at
        - completed_at
      properties:
        inspection_id:
          type: string
          format: uuid
          description: Unique inspection identifier
        target_id:
          type: string
          description: Target that was inspected
        cg_ir_snapshot_hash:
          type: string
          description: Hash of the CG-IR snapshot used for evaluation
          pattern: "^[a-f0-9]{64}$"
        status:
          type: string
          enum: [completed, partial, failed]
          description: Inspection completion status
        findings_count:
          type: integer
          minimum: 0
          description: Total findings produced
        findings_by_severity:
          type: object
          description: Finding count grouped by severity
          properties:
            critical:
              type: integer
            high:
              type: integer
            medium:
              type: integer
            low:
              type: integer
            informational:
              type: integer
        pipeline_trace:
          type: array
          description: Ordered execution trace for each pipeline stage
          items:
            type: object
            properties:
              stage:
                type: string
              status:
                type: string
              duration_ms:
                type: integer
        skipped_nodes:
          type: array
          description: Nodes skipped due to dependency failure (ordered by execution)
          items:
            type: object
            properties:
              directive_id:
                type: string
              reason:
                type: string
        system_state_hash:
          type: string
          description: Reproducibility hash (excludes event ordering)
          pattern: "^[a-f0-9]{64}$"
        engine_version:
          type: string
          description: Inspection engine version
        started_at:
          type: string
          format: date-time
          description: Inspection start timestamp
        completed_at:
          type: string
          format: date-time
          description: Inspection completion timestamp
        _links:
          type: object
          properties:
            self:
              type: object
              properties: { href: { type: string } }
            findings:
              type: object
              properties: { href: { type: string } }
            target:
              type: object
              properties: { href: { type: string } }

    ConflictView:
      type: object
      required: [conflict_id, status, conflicting_directives, detection_mechanism]
      properties:
        conflict_id:
          type: string
          description: Unique conflict identifier
        status:
          type: string
          enum: [open, resolved, advisory]
          description: Conflict resolution status
        detection_mechanism:
          type: string
          enum: [declared, outcome_contradiction, cross_lineage_advisory]
          description: How the conflict was detected
        conflicting_directives:
          type: array
          items:
            type: object
            properties:
              lineage_id:
                type: string
              execution_id:
                type: string
              deontic_type:
                type: string
              outcome:
                type: string
        resolution:
          type: object
          nullable: true
          description: Resolution details (null if open)
          properties:
            resolution_type:
              type: string
            resolved_by:
              type: string
            resolved_at:
              type: string
              format: date-time
            rationale:
              type: string
        created_at:
          type: string
          format: date-time
        _links:
          type: object
          properties:
            self:
              type: object
              properties: { href: { type: string } }
            resolutions:
              type: object
              properties: { href: { type: string } }

    CertificationResult:
      $ref: "../schemas/certification_result.json"

    CompilationStatus:
      type: object
      required: [compilation_id, lineage_id, status, started_at]
      properties:
        compilation_id:
          type: string
          description: Unique compilation identifier
        lineage_id:
          type: string
          description: Directive lineage that was compiled
        cg_ir_snapshot_hash:
          type: string
          description: Resulting CG-IR snapshot hash
          pattern: "^[a-f0-9]{64}$"
        status:
          type: string
          enum: [pending, in_progress, completed, failed]
          description: Compilation status
        error:
          type: object
          nullable: true
          description: Error details if compilation failed
          properties:
            code:
              type: string
            message:
              type: string
            stage:
              type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        _links:
          type: object
          properties:
            self:
              type: object
              properties: { href: { type: string } }
            directive:
              type: object
              properties: { href: { type: string } }
