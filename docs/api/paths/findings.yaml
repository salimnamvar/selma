# R4 Findings — AIP-121 standard Get/List + AIP-136 custom methods
# Domain: Finding / FindingProjection · Store: finding_events_store
# Use cases: GetFinding, ListFindings, TransitionFinding, AttachEvidence,
#            GetFindingGuidance, ListFindingAggregates
# Class: FindingRouter
#
# Custom (AIP-136): :transitionFinding :attachEvidence
# Collection custom: :listFindingAggregates
# Sub-resources: events (List), guidance (Get singleton)

/findings:
  get:
    operationId: listFindings
    tags: [Findings]
    summary: ListFindings
    description: |
      **Standard List** (AIP-132). Use case **ListFindings**.
      Capability: `finding.view`.
    parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/InspectionIdFilter
      - $ref: ../components/parameters.yaml#/components/parameters/TargetIdFilter
      - $ref: ../components/parameters.yaml#/components/parameters/LineageIdFilter
      - $ref: ../components/parameters.yaml#/components/parameters/FsmStateFilter
      - $ref: ../components/parameters.yaml#/components/parameters/SeverityFilter
      - $ref: ../components/parameters.yaml#/components/parameters/PageSize
      - $ref: ../components/parameters.yaml#/components/parameters/PageToken
    responses:
      "200":
        description: Finding collection page
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/components/schemas/ListFindingsResponse
      "401":
        $ref: ../components/responses.yaml#/components/responses/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/components/responses/CapabilityDenied

/findings:listFindingAggregates:
  get:
    operationId: listFindingAggregates
    tags: [Findings]
    summary: ListFindingAggregates
    description: |
      **Collection custom method** (AIP-136) `:listFindingAggregates`.
      Use case **ListFindingAggregates**. Capability: `analytics.view`.
      Not a freestanding analytics engine peer.
    parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/AggregateScope
      - $ref: ../components/parameters.yaml#/components/parameters/AggregatePeriodStart
      - $ref: ../components/parameters.yaml#/components/parameters/AggregatePeriodEnd
      - $ref: ../components/parameters.yaml#/components/parameters/PageSize
      - $ref: ../components/parameters.yaml#/components/parameters/PageToken
    responses:
      "200":
        description: AggregateReport resource
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/components/schemas/AggregateReport
      "401":
        $ref: ../components/responses.yaml#/components/responses/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/components/responses/CapabilityDenied

/findings/{finding_id}:
  parameters:
    - $ref: ../components/parameters.yaml#/components/parameters/FindingId
  get:
    operationId: getFinding
    tags: [Findings]
    summary: GetFinding
    description: |
      **Standard Get** (AIP-131). Use case **GetFinding**.
      Resource schema is `Finding` (projection fold of finding_events_store).
    responses:
      "200":
        description: Finding resource
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/components/schemas/Finding
      "401":
        $ref: ../components/responses.yaml#/components/responses/Unauthorized
      "404":
        $ref: ../components/responses.yaml#/components/responses/NotFound

/findings/{finding_id}:transitionFinding:
  parameters:
    - $ref: ../components/parameters.yaml#/components/parameters/FindingId
  post:
    operationId: transitionFinding
    tags: [Findings]
    summary: TransitionFinding
    description: |
      **Custom method** (AIP-136) `:transitionFinding`. Use case **TransitionFinding**.
      Capability is transition-specific. Returns the `Finding` resource.
      Requires `Idempotency-Key`.
    parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/components/schemas/FindingTransitionRequest
    responses:
      "200":
        description: Finding after transition
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/components/schemas/Finding
      "400":
        $ref: ../components/responses.yaml#/components/responses/FsmError
      "401":
        $ref: ../components/responses.yaml#/components/responses/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/components/responses/CapabilityDenied
      "404":
        $ref: ../components/responses.yaml#/components/responses/NotFound
      "409":
        $ref: ../components/responses.yaml#/components/responses/Conflict

/findings/{finding_id}:attachEvidence:
  parameters:
    - $ref: ../components/parameters.yaml#/components/parameters/FindingId
  post:
    operationId: attachEvidence
    tags: [Findings]
    summary: AttachEvidence
    description: |
      **Custom method** (AIP-136) `:attachEvidence`. Use case **AttachEvidence**.
      Capability: `evidence.submit`. Returns the `Finding` resource.
      Requires `Idempotency-Key`.
    parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/components/schemas/AttachEvidenceRequest
    responses:
      "200":
        description: Finding after evidence attach
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/components/schemas/Finding
      "400":
        $ref: ../components/responses.yaml#/components/responses/SchemaError
      "401":
        $ref: ../components/responses.yaml#/components/responses/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/components/responses/CapabilityDenied
      "404":
        $ref: ../components/responses.yaml#/components/responses/NotFound
      "409":
        $ref: ../components/responses.yaml#/components/responses/Conflict

/findings/{finding_id}/events:
  parameters:
    - $ref: ../components/parameters.yaml#/components/parameters/FindingId
  get:
    operationId: listFindingEvents
    tags: [Findings]
    summary: List FindingEvent sub-collection
    description: |
      **Standard List** of child `FindingEvent` resources (append-only
      `finding_events_store` / ERD `events`).
    parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/PageSize
      - $ref: ../components/parameters.yaml#/components/parameters/PageToken
    responses:
      "200":
        description: FindingEvent collection page
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/components/schemas/ListFindingEventsResponse
      "401":
        $ref: ../components/responses.yaml#/components/responses/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/components/responses/CapabilityDenied
      "404":
        $ref: ../components/responses.yaml#/components/responses/NotFound

/findings/{finding_id}/guidance:
  parameters:
    - $ref: ../components/parameters.yaml#/components/parameters/FindingId
  get:
    operationId: getFindingGuidance
    tags: [Guidance]
    summary: GetFindingGuidance
    description: |
      **Standard Get** of guidance singleton sub-resource.
      Use case **GetFindingGuidance** (guidance_only doctrine).
    responses:
      "200":
        description: Guidance resource
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/components/schemas/Guidance
      "401":
        $ref: ../components/responses.yaml#/components/responses/Unauthorized
      "404":
        $ref: ../components/responses.yaml#/components/responses/NotFound
