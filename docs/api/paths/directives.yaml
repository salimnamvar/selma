# R1 Directives — AIP-121 standard methods + AIP-136 custom methods
# rest_interface (C4: api) → directives_application
# ROD use cases: CreateDirective, ListDirectives, GetDirective, UpdateDirective,
#                LifecycleTransitions (Retire|Fork|Merge|Split|Restore)
# Class: DirectiveRouter
#
# Standard (AIP-131…135): Create / List / Get / Update / Delete (soft retire)
# Custom (AIP-136): :fork :merge :split :restore
# Sub-resource Get: /revisions/{revision}

/directives:
  post:
    operationId: createDirective
    tags: [Directives]
    summary: CreateDirective
    description: |
      **Standard Create** (AIP-133). Use case **CreateDirective**.
      Capability: `directive.create`. Requires `Idempotency-Key`.
      Response **is** the `Directive` resource (same schema as Get).
    parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/components/schemas/DirectiveCreate
    responses:
      "201":
        description: Directive created (resource)
        headers:
          ETag:
            description: 'W/"{lineage_id}:{revision}"'
            schema:
              type: string
          Location:
            description: Resource name URI
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/components/schemas/Directive
      "400":
        $ref: ../components/responses.yaml#/components/responses/SchemaError
      "401":
        $ref: ../components/responses.yaml#/components/responses/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/components/responses/CapabilityDenied
      "409":
        $ref: ../components/responses.yaml#/components/responses/Conflict
      "429":
        $ref: ../components/responses.yaml#/components/responses/RateLimited
  get:
    operationId: listDirectives
    tags: [Directives]
    summary: ListDirectives
    description: |
      **Standard List** (AIP-132). Use case **ListDirectives**.
    parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/DirectiveStatusFilter
      - $ref: ../components/parameters.yaml#/components/parameters/PageSize
      - $ref: ../components/parameters.yaml#/components/parameters/PageToken
    responses:
      "200":
        description: Directive collection page
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/components/schemas/ListDirectivesResponse
      "401":
        $ref: ../components/responses.yaml#/components/responses/Unauthorized

/directives/{lineage_id}:
  parameters:
    - $ref: ../components/parameters.yaml#/components/parameters/LineageId
  get:
    operationId: getDirective
    tags: [Directives]
    summary: GetDirective
    description: |
      **Standard Get** (AIP-131). Use case **GetDirective**.
      Returns ETag `W/"{lineage_id}:{revision}"` for Update concurrency.
    responses:
      "200":
        description: Directive resource
        headers:
          ETag:
            description: 'W/"{lineage_id}:{revision}"'
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/components/schemas/Directive
      "401":
        $ref: ../components/responses.yaml#/components/responses/Unauthorized
      "404":
        $ref: ../components/responses.yaml#/components/responses/NotFound
  patch:
    operationId: updateDirective
    tags: [Directives]
    summary: UpdateDirective
    description: |
      **Standard Update** (AIP-134). Use case **UpdateDirective**.
      Creates a new co-versioned revision (same `lineage_id`).
      Capability: `directive.modify`. Prefer `If-Match`. Requires `Idempotency-Key`.
    parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/IfMatch
      - $ref: ../components/parameters.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/components/schemas/DirectiveUpdate
    responses:
      "200":
        description: Updated Directive resource
        headers:
          ETag:
            description: 'W/"{lineage_id}:{new_revision}"'
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/components/schemas/Directive
      "400":
        $ref: ../components/responses.yaml#/components/responses/SchemaError
      "401":
        $ref: ../components/responses.yaml#/components/responses/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/components/responses/CapabilityDenied
      "404":
        $ref: ../components/responses.yaml#/components/responses/NotFound
      "409":
        $ref: ../components/responses.yaml#/components/responses/Conflict
      "429":
        $ref: ../components/responses.yaml#/components/responses/RateLimited
      "503":
        $ref: ../components/responses.yaml#/components/responses/CompileQueueFull
  delete:
    operationId: retireDirective
    tags: [Directives]
    summary: LifecycleTransitions.Retire (soft Delete)
    description: |
      **Standard Delete** as soft delete (AIP-135 / soft-delete pattern):
      transitions status to deprecated/retired. Maps to
      **LifecycleTransitions.Retire**. Capability: `directive.retire`.
      Requires `Idempotency-Key`. Subsequent Get returns the resource with
      terminal lifecycle status (not hard 404 unless purged by policy).
    parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/IfMatch
      - $ref: ../components/parameters.yaml#/components/parameters/IdempotencyKey
    responses:
      "200":
        description: Directive after soft delete (retired)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/components/schemas/Directive
      "401":
        $ref: ../components/responses.yaml#/components/responses/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/components/responses/CapabilityDenied
      "404":
        $ref: ../components/responses.yaml#/components/responses/NotFound
      "409":
        $ref: ../components/responses.yaml#/components/responses/Conflict

/directives/{lineage_id}/revisions/{revision}:
  parameters:
    - $ref: ../components/parameters.yaml#/components/parameters/LineageId
    - $ref: ../components/parameters.yaml#/components/parameters/Revision
  get:
    operationId: getDirectiveRevision
    tags: [Directives]
    summary: Get DirectiveRevision
    description: |
      **Standard Get** of revision sub-resource (`DirectiveRevision` entity /
      ERD `directive_revisions`). Same dual-document `Directive` wire schema
      at that revision (AIP-121 uniform resource schema for the view).
    responses:
      "200":
        description: Directive at historical revision
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/components/schemas/Directive
      "401":
        $ref: ../components/responses.yaml#/components/responses/Unauthorized
      "404":
        $ref: ../components/responses.yaml#/components/responses/NotFound

/directives/{lineage_id}:fork:
  parameters:
    - $ref: ../components/parameters.yaml#/components/parameters/LineageId
  post:
    operationId: forkDirective
    tags: [Directives]
    summary: LifecycleTransitions.Fork
    description: |
      **Custom method** (AIP-136) `:fork`. Use case **LifecycleTransitions.Fork**.
      Capability: `directive.fork`. Requires `Idempotency-Key`.
    parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/IfMatch
      - $ref: ../components/parameters.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/components/schemas/DirectiveForkRequest
    responses:
      "200":
        description: Forked Directive resource(s)
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/components/schemas/DirectiveLifecycleResponse
      "400":
        $ref: ../components/responses.yaml#/components/responses/SchemaError
      "401":
        $ref: ../components/responses.yaml#/components/responses/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/components/responses/CapabilityDenied
      "404":
        $ref: ../components/responses.yaml#/components/responses/NotFound
      "409":
        $ref: ../components/responses.yaml#/components/responses/Conflict

