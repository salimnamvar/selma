# R5 Artifacts — AIP-121 Get/List + AIP-136 custom review
# Store: artifacts_store · Adapter: artifacts_repository
# Use case ReviewConflictArtifact (findings_application) on conflict kind
# Class: ArtifactRouter

/artifacts:
  get:
    operationId: listArtifacts
    tags: [Artifacts]
    summary: List Artifacts
    description: |
      **Standard List** (AIP-132) of write-once artifacts
      (inspection | conflict | certification | evidence).
    parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/ArtifactKindFilter
      - $ref: ../components/parameters.yaml#/components/parameters/ConflictStatusFilter
      - $ref: ../components/parameters.yaml#/components/parameters/PageSize
      - $ref: ../components/parameters.yaml#/components/parameters/PageToken
    responses:
      "200":
        description: Artifact collection page
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/components/schemas/ListArtifactsResponse
      "401":
        $ref: ../components/responses.yaml#/components/responses/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/components/responses/CapabilityDenied

/artifacts/{artifact_id}:
  parameters:
    - $ref: ../components/parameters.yaml#/components/parameters/ArtifactId
  get:
    operationId: getArtifact
    tags: [Artifacts]
    summary: Get Artifact
    description: |
      **Standard Get** (AIP-131). Inspection-scoped reads require
      `inspection.view` when applicable.
    responses:
      "200":
        description: Artifact resource
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/components/schemas/Artifact
      "401":
        $ref: ../components/responses.yaml#/components/responses/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/components/responses/CapabilityDenied
      "404":
        $ref: ../components/responses.yaml#/components/responses/NotFound

/artifacts/{artifact_id}:reviewConflictArtifact:
  parameters:
    - $ref: ../components/parameters.yaml#/components/parameters/ArtifactId
  post:
    operationId: reviewConflictArtifact
    tags: [Artifacts]
    summary: ReviewConflictArtifact
    description: |
      **Custom method** (AIP-136) `:reviewConflictArtifact`.
      Use case **ReviewConflictArtifact** (`findings_application`).
      Capability: `conflict.resolve`. Requires `Idempotency-Key`.
      Domain `ResolveConflict` is not this endpoint (not a C4 peer).
    parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/components/schemas/ReviewConflictArtifactRequest
    responses:
      "200":
        description: Conflict artifact after human resolution
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/components/schemas/ConflictArtifact
      "401":
        $ref: ../components/responses.yaml#/components/responses/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/components/responses/CapabilityDenied
      "404":
        $ref: ../components/responses.yaml#/components/responses/NotFound
      "409":
        $ref: ../components/responses.yaml#/components/responses/Conflict
