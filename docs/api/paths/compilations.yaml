# R2 Compilations — AIP-121 collection of content-addressed snapshots
# C4: compilation_application · Package dual: compiled_rules_application
# Domain resource: CgIrSnapshot (class) · Store: compiled_rules_store
# ROD: CompileDirectives (Create/custom enqueue); Get/List are standard on resource
# Class: CompilationRouter

/compilations:
  post:
    operationId: compileDirectives
    tags: [Compilations]
    summary: CompileDirectives
    description: |
      Enqueues/runs hermetic compilation (use case **CompileDirectives**).
      Prefer modeling as **Create** of a Compilation when a new snapshot is
      produced; identical content is content-addressed (dedup no-op).
      Requires `Idempotency-Key`.
    parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/components/schemas/CompilationRequest
    responses:
      "201":
        description: Compilation resource (or accepted status)
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/components/schemas/Compilation
      "400":
        $ref: ../components/responses.yaml#/components/responses/SchemaError
      "401":
        $ref: ../components/responses.yaml#/components/responses/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/components/responses/CapabilityDenied
      "404":
        $ref: ../components/responses.yaml#/components/responses/NotFound
      "409":
        $ref: ../components/responses.yaml#/components/responses/Conflict
      "503":
        $ref: ../components/responses.yaml#/components/responses/CompileQueueFull
  get:
    operationId: listCompilations
    tags: [Compilations]
    summary: List Compilations
    description: |
      **Standard List** (AIP-132) over compilation / snapshot resources.
    parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/LineageIdFilter
      - $ref: ../components/parameters.yaml#/components/parameters/PageSize
      - $ref: ../components/parameters.yaml#/components/parameters/PageToken
    responses:
      "200":
        description: Compilation collection page
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/components/schemas/ListCompilationsResponse
      "401":
        $ref: ../components/responses.yaml#/components/responses/Unauthorized

/compilations/{hash}:
  parameters:
    - $ref: ../components/parameters.yaml#/components/parameters/CompilationHash
  get:
    operationId: getCompilation
    tags: [Compilations]
    summary: Get Compilation
    description: |
      **Standard Get** (AIP-131) by content-addressed hash
      (`CgIrSnapshot.cg_ir_snapshot_hash` / ERD snapshots PK).
    responses:
      "200":
        description: Compilation / CgIrSnapshot resource
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/components/schemas/Compilation
      "401":
        $ref: ../components/responses.yaml#/components/responses/Unauthorized
      "404":
        $ref: ../components/responses.yaml#/components/responses/NotFound
