# R3 Inspections — AIP-121 standard methods on Inspection resource
# Domain: Inspection aggregate · Use cases: CreateInspection, GetInspection
# Class: InspectionRouter

/inspections:
  post:
    operationId: createInspection
    tags: [Inspections]
    summary: CreateInspection
    description: |
      **Standard Create** (AIP-133). Use case **CreateInspection**.
      Capability: `inspection.submit` (or `inspection.reinspect` for reinspect).
      Requires `Idempotency-Key`. Response **is** the `Inspection` resource.
    parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/components/schemas/TargetSubmission
    responses:
      "201":
        description: Inspection resource
        headers:
          Location:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/components/schemas/Inspection
      "400":
        $ref: ../components/responses.yaml#/components/responses/SchemaError
      "401":
        $ref: ../components/responses.yaml#/components/responses/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/components/responses/CapabilityDenied
      "409":
        $ref: ../components/responses.yaml#/components/responses/Conflict
      "429":
        $ref: ../components/responses.yaml#/components/responses/RateLimited
      "504":
        $ref: ../components/responses.yaml#/components/responses/UpstreamTimeout
  get:
    operationId: listInspections
    tags: [Inspections]
    summary: List Inspections
    description: |
      **Standard List** (AIP-132). Collection List required when more than one
      Inspection resource is possible.
    parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/TargetIdFilter
      - $ref: ../components/parameters.yaml#/components/parameters/PageSize
      - $ref: ../components/parameters.yaml#/components/parameters/PageToken
    responses:
      "200":
        description: Inspection collection page
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/components/schemas/ListInspectionsResponse
      "401":
        $ref: ../components/responses.yaml#/components/responses/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/components/responses/CapabilityDenied

/inspections/{inspection_id}:
  parameters:
    - $ref: ../components/parameters.yaml#/components/parameters/InspectionId
  get:
    operationId: getInspection
    tags: [Inspections]
    summary: GetInspection
    description: |
      **Standard Get** (AIP-131). Use case **GetInspection**.
      Capability: `inspection.view` (not `finding.view`).
    responses:
      "200":
        description: Inspection resource
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/components/schemas/Inspection
      "401":
        $ref: ../components/responses.yaml#/components/responses/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/components/responses/CapabilityDenied
      "404":
        $ref: ../components/responses.yaml#/components/responses/NotFound
