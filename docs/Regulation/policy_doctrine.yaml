# policy_doctrine.yaml
# The Absolute Essence + Self-Governance.
# Completely context-free. Governs the governors.

doctrine:
  name: universal-policy-doctrine
  version: "1.3.0"
  description: >
    Defines how to structure and write a rule document.
    Includes self-governance, hierarchy, and sanctions.
  rule_contract_version: "1.3.0"
  rule_contract_id: "universal-rule-schema"

# ─── CONTAMINATION GUARD ─────────────────────────────────────────
# This contract MUST NOT contain any machine-executable logic.
# FORBIDDEN at all levels: parameters, conditions, evaluator_hint,
# weight, depends_on, conflicts_with, status, created_at, expires_at,
# any field that a machine parser/evaluator/validator consumes.
# The ONLY machine-facing element allowed: "Machine ID" columns in
# directive tables, which serve as cross-reference labels (names),
# not execution directives.
contamination_guard:
  forbidden_fields:
    - parameters
    - conditions
    - evaluator_hint
    - weight
    - depends_on
    - conflicts_with
    - status
    - created_at
    - expires_at
    - remediation
    - target
    - technical_hints
  allowed_machine_references:
    - "Machine ID columns in directive tables (cross-reference labels only)"

# ─── WRITING PRINCIPLES ──────────────────────────────────────────
writing_principles:
  - id: WP-001
    title: "Precision over Ambiguity"
    description: "Use exact, imperative language. Avoid 'should' or 'may' when 'must' or 'must not' is intended."
  - id: WP-002
    title: "Definitions First"
    description: "Define every atomic term before using it in a rule."
  - id: WP-003
    title: "Structural Integrity"
    description: "Do not exceed 3 levels of nested sections. If you need more, split the document."
  - id: WP-004
    title: "Traceability"
    description: "Every substantive paragraph must link to a Machine ID. No orphan rules."
  - id: WP-005
    title: "Hierarchy of Authority"
    description: "Declare how conflicts are resolved (e.g., 'Newer rules override older', 'General rules defer to specific rules')."

# ─── PRIORITY HIERARCHY ─────────────────────────────────────────
# Defines the authority levels for rules. Higher levels override lower levels.
# When rules conflict, the higher-priority rule takes precedence.
priority_hierarchy:
  description: >
    Rules exist at different authority levels. When two rules conflict,
    the higher-priority rule wins. This hierarchy must be declared in
    the policy document and referenced by each rule.
  levels:
    - id: constitutional
      level: 1
      title: "Constitutional / Foundational"
      description: "Core principles that cannot be overridden by any lower-level rule."
      examples: ["Human safety over efficiency", "No rule may violate fundamental rights"]
    - id: statutory
      level: 2
      title: "Statutory / Legislative"
      description: "Rules enacted by authorized governing bodies with full authority."
      examples: ["Traffic laws", "Tax regulations", "Employment standards"]
    - id: regulatory
      level: 3
      title: "Regulatory / Administrative"
      description: "Rules created by agencies to implement statutory requirements."
      examples: ["Building codes", "Environmental standards", "Industry guidelines"]
    - id: operational
      level: 4
      title: "Operational / Procedural"
      description: "Day-to-day procedures that implement higher-level rules."
      examples: ["Code review checklists", "Deployment procedures", "Incident response"]
    - id: advisory
      level: 5
      title: "Advisory / Best Practice"
      description: "Recommendations that are not mandatory but encouraged."
      examples: ["Style guides", "Performance tips", "Architecture patterns"]

  conflict_resolution: >
    When two rules conflict:
    1. Higher priority level wins (constitutional > statutory > regulatory > operational > advisory)
    2. If same level: more specific rule wins over general rule
    3. If same specificity: newer rule wins over older rule
    4. If same age: rule with explicit conflict resolution wins

# ─── VERSIONING STRATEGY ────────────────────────────────────────
# Defines how versions are assigned and incremented for both contracts.
versioning_strategy:
  description: >
    Both policy doctrine and rule schema follow semantic versioning (MAJOR.MINOR.PATCH).
    This strategy defines when each component is incremented.
  format: "MAJOR.MINOR.PATCH"
  rules:
    major:
      description: "Breaking changes that require migration"
      examples:
        - "Removing or renaming a required section"
        - "Changing the structure of directive tables"
        - "Modifying the contamination guard incompatibly"
      when: "Existing documents will not validate without changes"
    minor:
      description: "New features that are backward-compatible"
      examples:
        - "Adding a new optional section"
        - "Adding new fields to rules (optional)"
        - "Adding new writing principles"
      when: "Existing documents continue to validate"
    patch:
      description: "Bug fixes and clarifications"
      examples:
        - "Fixing typos in guidance text"
        - "Clarifying ambiguous descriptions"
        - "Updating examples"
      when: "No functional change to validation"
  synchronization: >
    Both contracts must maintain synchronized versions:
    - policy_doctrine.yaml doctrine.version
    - rule_schema.json policy_contract_version
    - policy_doctrine.yaml doctrine.rule_contract_version
    - rule_schema.json $id (schema identifier)
    When either contract changes, both must be updated to reflect the new version.

# ─── UNIVERSAL DOCUMENT SECTIONS ────────────────────────────────
sections:
  - id: preamble
    title: "Preamble"
    required: true
    content_type: prose
    guidance: "Explain the existential need for these rules."

  - id: governance
    title: "Governance & Amendment"
    required: true
    content_type: prose
    guidance: "Define how this doctrine is changed, who has authority, and the ratification process."

  - id: definitions
    title: "Definitions"
    required: true
    content_type: table
    columns: ["Term", "Definition (What it IS)", "Exclusion (What it IS NOT)"]
    guidance: "All terms used in the document must be defined here."

  - id: principles
    title: "Foundational Principles"
    required: true
    content_type: prose_or_table
    guidance: "State the high-level morals or axioms from which all rules derive."

  - id: directives
    title: "Directives (Rules & Standards)"
    required: true
    content_type: mixed
    guidance: "List all specific obligations, prohibitions, permissions, and flexible guidelines."
    children:
      - id: specific_directives
        title: "Specific Directives"
        content_type: table
        columns: ["Type (Obligation/Prohibition/Permission)", "Description", "Machine ID", "Context / Conditions"]
      - id: flexible_standards
        title: "Flexible Standards"
        content_type: table
        columns: ["Description", "Machine ID", "Factors to Consider", "Examples"]

  - id: sanctions
    title: "Sanctions & Remedies"
    required: true
    content_type: table
    columns: ["Violation Context", "Enforcement Action", "Remediation Path"]
    guidance: "Explicitly state the consequences of non-compliance."

  - id: references
    title: "References & Annexes"
    required: false
    content_type: prose_or_table
    guidance: "External sources, historical context, or supplementary data."
