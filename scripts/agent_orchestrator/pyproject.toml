# Package metadata for the AI Agent Collaboration Orchestrator.
# Foundation-only: dependencies listed here are the approved stack.
# When integrating into the selma monorepo root, mirror these under
# [project.optional-dependencies] (e.g. orchestrator = [...]).

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "Configuration-driven CLI that coordinates multiple AI coding agents to collaboratively execute software engineering workflows"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
authors = [
  { name = "Salim Namvar", email = "salim.namvar@gmail.com" }
]
keywords = [
  "agent-orchestrator",
  "ai-agents",
  "workflow",
  "orchestration",
  "cli",
  "clean-architecture",
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "typer>=0.12",
  "rich>=13.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "pyright>=1.1",
]

[project.scripts]
agent-orchestrator = "agent_orchestrator.main:main"

[project.urls]
Documentation = "docs/architecture.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_orchestrator*"]

# NOTE: When this package lives under scripts/agent_orchestrator inside
# the selma monorepo, import path is `agent_orchestrator` with scripts/
# on PYTHONPATH (same pattern as context_builder). Root pyproject may
# later register this package explicitly; do not invent a second packaging
# strategy during implementation without an ADR.
