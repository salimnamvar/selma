# Example agent registry for the AI Agent Collaboration Orchestrator.
# Adapter names are plugin keys — the core never imports these vendors.

agents:
  techlead:
    adapter: opencode
    role: architecture
    prompt_ref: prompts.architecture
    parameters: {}

  coder:
    adapter: poolside
    role: implementation
    prompt_ref: prompts.implementation
    parameters: {}

  refactorer:
    adapter: poolside
    role: refactoring
    prompt_ref: prompts.refactoring
    parameters: {}

  reviewer:
    adapter: mimo
    role: quality_review
    prompt_ref: prompts.review
    parameters: {}
