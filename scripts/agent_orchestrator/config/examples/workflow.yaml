# Example multi-agent engineering workflow.
# Engine executes steps without code changes when steps/agents change.

workflow:
  id: collaborative_feature
  name: Collaborative Feature Delivery
  description: >
    Architecture → implementation → independent review → optional
    refactor loop → completion. Review gates enforce quality.

  steps:
    - id: architecture_design
      name: Architecture design
      task:
        id: task_arch
        name: Produce architecture plan
        description: Design approach, boundaries, and task breakdown for the change.
        agent_id: techlead
        expected_outputs: [design]
      review_gate:
        id: gate_arch
        reviewer_agent_id: reviewer
        required_decision: APPROVE
        max_iterations: 2

    - id: implementation
      name: Implementation
      depends_on: [architecture_design]
      task:
        id: task_impl
        name: Implement change
        description: Implement according to approved architecture artifacts.
        agent_id: coder
        inputs: [design]
        expected_outputs: [source, test]
      review_gate:
        id: gate_impl
        reviewer_agent_id: reviewer
        required_decision: APPROVE
        max_iterations: 3
        on_reject: implementation

    - id: refinement
      name: Refactor and enhance
      depends_on: [implementation]
      task:
        id: task_refine
        name: Refactor tests and polish
        description: Improve structure, tests, and clarity without changing intent.
        agent_id: refactorer
        inputs: [source, test]
        expected_outputs: [source, test]
      review_gate:
        id: gate_refine
        reviewer_agent_id: reviewer
        required_decision: APPROVE
        max_iterations: 2

    - id: approval
      name: Final approval
      depends_on: [refinement]
      # No task — gate-only step (engine treats as review checkpoint)
      review_gate:
        id: gate_final
        reviewer_agent_id: reviewer
        required_decision: APPROVE
        max_iterations: 1

    - id: completion
      name: Completion
      depends_on: [approval]
      # Terminal bookkeeping step — engine marks run COMPLETED
