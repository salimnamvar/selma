[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "design-common"
version = "0.1.0"
description = "Shared utilities for selma subprojects (PlantUML parsing, report models)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Salim" }]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["design_common"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
