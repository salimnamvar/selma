preamble:
  title: Preamble
  purpose: Establish human-readable obligations for SC-001 (Single-Exit Point) so authors, reviewers,
    and AI agents can reason about intent without reading evaluator configuration.
  scope: All functions in production code, tests, and AI-generated code. No exceptions.
  existential_need: Multiple exit points create invisible control flow. A reviewer must trace every path
    to understand what the function returns (or raises, or terminates). A single exit makes the
    function's outcome explicit and predictable. This applies to ALL functions — no exceptions.
governance:
  title: Governance & Amendment
  authority: Coding Doctrine / Architecture Owner. Amendments require PR review and must keep policy
    identical in intent to the paired machine rule.
  amendment_process:
  - Propose change via PR touching both this policy YAML and the paired rule JSON when semantics change.
  - Policy-only changes (examples, wording) are allowed if Machine ID intent is unchanged.
  - Never add evaluator_type/evaluator_config or other prohibited fields to this file.
  versioning: MAJOR.MINOR.PATCH aligned with policy_contract_version 8.x
  identity:
    machine_id: SC-001
    maps_to: rule.lineage_id
    paired_execution_id_note: Execution ID in schema layer is SC-001; not redefined as executable data
      here.
definitions:
  title: Definitions
  terms:
  - term: Machine ID
    definition: Immutable lineage identifier SC-001 for this directive.
    exclusion: Not an execution ID and not a runtime lookup key for evaluation.
  - term: Paired Rule
    definition: Machine-evaluable document at directive/rule/sc001_single_exit.json.
    exclusion: This policy YAML is not a lint source.
  - term: Single-Exit Point
    definition: 'Every function SHALL contain exactly one exit point. All code paths within the
      function SHALL converge to this single exit. Exit mechanisms: `return` and `raise`. The function
      SHALL NOT contain more than one of these.'
    exclusion: Not optional style preference when deontic type is Obligation or Prohibition.
principles:
  title: Foundational Principles
  description: This directive operationalizes one or more Coding Doctrine core principles.
  items:
  - id: P1
    title: Determinism Over Cleverness
    description: Every function SHALL produce the same output for the same inputs under the same documented
      conditions. No exceptions. Cleverness that sacrifices determinism is forbidden.
  - id: P2
    title: Localized Failure Handling
    description: Every function SHALL handle its own failures. A function SHALL NOT propagate exceptions
      to its caller for the caller to decide what to do. Failure handling is the responsibility of the
      layer that detects the failure.
  - id: P3
    title: Explicit Over Implicit
    description: Every contract, every side effect, every resource ownership transfer, and every state
      mutation SHALL be declared explicitly. Implicit behavior is forbidden.
  - id: P4
    title: Fail-Safe Defaults
    description: When a function encounters a condition it cannot resolve, it SHALL return a deterministic
      failure result. It SHALL NOT leave the system in a partially mutated state. It SHALL NOT raise an
      exception hoping the caller will clean up.
  - id: P5
    title: Validation as Entry Contract
    description: Every function SHALL validate its inputs before executing any logic. Validation is not
      optional. Validation is not behind feature flags. Validation runs in all environments, including
      production.
  - id: P6
    title: Resource Ownership Is Explicit
    description: Every resource SHALL have a single, documented owner. Ownership transfers SHALL be explicit.
      Every resource SHALL be released deterministically, even in failure paths.
  - id: P7
    title: Single Truth Source
    description: Every piece of data SHALL have exactly one authoritative source. Derived data SHALL be
      computed, never independently maintained.
directives:
  title: Directives (Rules & Standards)
  specific_directives:
  - type: Obligation
    description: Every function SHALL contain exactly one exit point. All code paths within the
      function SHALL converge to this single exit — exit doors are `return` and `raise`. Use a
      continue-flag pattern for conditional logic.
    machine_id: SC-001
    context_conditions: All functions — no exceptions. `yield` is a suspension point, not an exit.
      Async functions (`async def`) SHALL follow the same single-exit rules; `await` does not count as
      an exit. `break` and `continue` are loop control, not function exits.
    title: Single-Exit Point
  flexible_standards: []
sanctions:
  title: Sanctions & Remedies
  rows:
  - violation_context: Function has multiple exit doors — use single-exit pattern
    enforcement_action: Machine lint finding via sc001_single_exit.json when automatically enforceable;
      otherwise code review gate.
    remediation_path: Refactor to use a continue-flag / staged assignment pattern with one terminal exit.
guidance:
  title: Guidance, Examples, and Reasoning
  purpose: For human and AI reasoning only. Do not execute this section as a linter.
  reasoning: Multiple exit points create invisible control flow. A reviewer must trace every path to understand
    what the function returns. A single exit makes the return value the function's explicit contract.
    This applies to ALL functions — including dunders, generators, decorated methods, and nested functions.
    Exit doors are `return` and `raise`. `yield` is a suspension, not an exit — but a generator function
    must still have exactly one terminal exit point.
  explanation: The correct version uses b_continue to gate execution and a single return at the end. The
    incorrect version has multiple return statements, making control flow harder to trace.
  correct_example: |-
    def process(a_data: dict) -> Result[str]:
        b_continue = True
        result: Result[str] = INVALID_RESULT
        if not a_data:
            result = Result.failure('Empty data')
            b_continue = False
        if b_continue:
            name = a_data.get('name', '')
            if not name:
                result = Result.failure('Missing name')
                b_continue = False
        if b_continue:
            result = Result.success(name)
        return result
  incorrect_example: |-
    # Multiple returns — violates single-exit rule
    def process(a_data: dict) -> Result[str]:
        if not a_data:
            return Result.failure('Empty data')
        name = a_data.get('name', '')
        if not name:
            return Result.failure('Missing name')
        return Result.success(name)

    # Raise as exit — violates single-exit rule
    def lookup(a_key: str) -> str:
        if a_key not in cache:
            raise KeyError(a_key)
        return cache[a_key]
  related_machine_ids:
  - SC-002
  - SC-010
  - SC-011
  exceptions: None. All functions — including dunders, generators, decorated methods, and nested functions
    — MUST follow the single-exit rule. `yield` is a suspension point, not an exit; `await` is a
    suspension point, not an exit; `break` and `continue` are loop control, not function exits.
