sanctions:
  title: Sanctions & Remedies
  rows:
  - violation_context: Missing nullability check before dereference
    enforcement_action: Machine lint finding via sc033_nullability_validation.json when automatically
      enforceable; otherwise Code review gate, type checker (with `--strict`).
    remediation_path: Add explicit 'if value is not None:' guard before attribute access.
guidance:
  title: Guidance, Examples, and Reasoning
  purpose: For human and AI reasoning only. Do not execute this section as a linter.
  reasoning: '`None` is Python''s universal null. An unhandled `None` propagates through the codebase,
    causing failures at distant, unrelated points. Catching `None` at the entry point localizes the failure.'
  explanation: The correct version explicitly checks for None before accessing attributes. The incorrect
    version dereferences without checking, causing AttributeError if None.
  correct_example: |-
    def get_name(a_user: User | None) -> Result[str]:
        if a_user is None:
            return Result.failure('User is None')
        return Result.success(a_user.name)
  incorrect_example: |-
    def get_name(a_user: User | None) -> Result[str]:
        return Result.success(a_user.name)
  related_machine_ids:
  - SC-030
  - SC-031
  exceptions: None.
