  scope: All production Python under this project's safe-coding doctrine, including tests and AI-generated
    code, unless a documented exemption applies.
  existential_need: '`None` is Python''s universal null. An unhandled `None` propagates through the codebase,
    causing failures at distant, unrelated points. Catching `None` at the entry point localizes the failure.'
