preamble:
  title: Preamble
  purpose: Establish human-readable obligations for SC-121 (AI Agent Prompt Requirements) so authors,
    reviewers, and AI agents can reason about intent without reading evaluator configuration.
  scope: All production code under this coding doctrine, including tests and AI-generated
    code, unless a documented exemption applies.
  existential_need: AI agents generate code that matches the patterns in their context. If the Doctrine
    is not in the context, the agent will generate code that violates it.
