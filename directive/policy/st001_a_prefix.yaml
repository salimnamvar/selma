    and reasoning only — not machine-executable.'
  spec_version: 8.3.0
  schema_version: 8.3.0
  schema_id: universal-rule-schema
  machine_id: ST-001
  paired_rule_file: directive/rule/st001_a_prefix.json
  purpose_layer: governance_intent_guidance_examples_reasoning
  runtime_prohibition: This file MUST NOT be read during inspection, evaluation, finding FSM transitions,
    or conflict resolution at runtime. Linting sources are ONLY the JSON rules under directive/rule/.
