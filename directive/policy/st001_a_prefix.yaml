contamination_guard:
  note: 'This document MUST NOT contain machine-executable logic. Prohibited: parameters, conditions,
    evaluator_hint, evaluator_type, evaluator_config, weight, depends_on, conflicts_with, status, created_at,
    expires_at, remediation (as executable carrier), target, lineage.'
