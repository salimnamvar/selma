preamble:
  title: Preamble
  purpose: Establish human-readable obligations for ST-001 (Function arguments must use a_ prefix) so
    authors, reviewers, and AI agents can reason about intent without reading evaluator configuration.
  scope: All production code under this coding doctrine, including tests and AI-generated
    code, unless a documented exemption applies.
  existential_need: 'Consistent argument naming improves code readability and searchability. A stable
    parameter prefix distinguishes parameters from local variables at a glance. Language receivers (self,
    cls) and variadic packs (args, kwargs) are Python method conventions, not application parameters.
    Subclass overrides keep base-class parameter names for Liskov substitution — renaming them would break
    the polymorphic contract.'
governance:
  title: Governance & Amendment
  authority: Coding Doctrine / Architecture Owner. Amendments require PR review and must keep policy
    identical in intent to the paired machine rule.
  amendment_process:
  - Propose change via PR touching both this policy YAML and the paired rule JSON when semantics change.
  - Policy-only changes (examples, wording) are allowed if Machine ID intent is unchanged.
  - Never add evaluator_type/evaluator_config or other prohibited fields to this file.
  versioning: MAJOR.MINOR.PATCH aligned with policy_contract_version 8.x
  identity:
    machine_id: ST-001
    maps_to: rule.lineage_id
    paired_execution_id_note: Execution ID in schema layer is ST-001; not redefined as executable data
      here.
