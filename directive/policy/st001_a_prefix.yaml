principles:
  title: Foundational Principles
  description: This directive operationalizes one or more Coding Doctrine core principles.
  items:
  - id: P3
    title: Explicit Over Implicit
    description: Every contract, every side effect, every resource ownership transfer, and every state
      mutation SHALL be declared explicitly. Implicit behavior is forbidden.
directives:
  title: Directives (Rules & Standards)
  specific_directives:
  - type: Obligation
    description: Function arguments must use a_ prefix
    machine_id: ST-001
    context_conditions: 'Language-level exemptions only: self, cls, *args, **kwargs, dunder methods, and
      methods that override a base-class signature (structural LSP). No project- or framework-specific
      parameter name lists.'
    title: Function parameters use a stable prefix convention
  flexible_standards: []
sanctions:
  title: Sanctions & Remedies
  rows:
  - violation_context: Function parameters missing the required prefix
    enforcement_action: Machine lint finding via st001_a_prefix.json when automatically enforceable; otherwise
      See paired machine rule.
    remediation_path: 'Rename application parameters with the a_ prefix, e.g. def process(a_path: Path).
      Keep self/cls and *args/**kwargs unchanged. Keep override signatures identical to the base method.'
guidance:
  title: Guidance, Examples, and Reasoning
  purpose: For human and AI reasoning only. Do not execute this section as a linter.
  reasoning: 'Consistent argument naming improves code readability and searchability. A stable parameter
    prefix distinguishes parameters from locals. Language receivers and override contracts are structural
    language rules, not project-specific allowlists.'
  explanation: Application functions use a_ on parameters (a_value, a_multiplier). Methods that override
    a base class keep the base parameter names. Language receivers self/cls and packs args/kwargs remain
    unchanged.
  correct_example: |-
    def calculate(a_value: float, a_multiplier: float = 1.0) -> Result[float]:
        b_continue = True
        result: Result[float] = Result.failure('unreachable')
        if b_continue and not isinstance(a_value, (int, float)):
            b_continue = False
            result = Result.failure('Expected number')
        if b_continue:
            result = Result.success(float(a_value) * a_multiplier)
        return result

    class RequestFilter(logging.Filter):
        # Override keeps base signature (LSP) — base dictates parameter names.
        def filter(self, record: logging.LogRecord) -> bool:
            record.request_id = self._current_id
            return True
  incorrect_example: |-
    def calculate(value: float, multiplier: float = 1.0) -> Result[float]:
        if not isinstance(value, (int, float)):
            return Result.failure('Expected number')
        return Result.success(value * multiplier)

    class BadFilter(logging.Filter):
        # Incorrect: renamed override parameters break the base contract.
        def filter(self, a_record: logging.LogRecord) -> bool:
            a_record.request_id = self._current_id
            return True
  related_machine_ids: []
  exceptions: 'Language-level only: self/cls/args/kwargs, dunder methods, and methods overriding a base
    class signature (LSP). No project- or product-specific name lists.'
