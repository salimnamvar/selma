preamble:
  title: Preamble
  purpose: Establish human-readable obligations for SC-007 (No Assert for Validation) so authors, reviewers,
    and AI agents can reason about intent without reading evaluator configuration.
  scope: All production code under this coding doctrine, including tests and AI-generated
    code, unless a documented exemption applies.
  existential_need: '`assert` statements are stripped when Python runs with `-O` (optimized mode). Using
    them for validation means validation disappears in production. Runtime validation must use explicit
    `if` checks that raise or return error results unconditionally.'
governance:
  title: Governance & Amendment
  authority: Coding Doctrine / Architecture Owner. Amendments require PR review and must keep policy
