    maps_to: rule.lineage_id
    paired_execution_id_note: Execution ID in schema layer is SC-007; not redefined as executable data
      here.
definitions:
  title: Definitions
  terms:
  - term: Machine ID
    definition: Immutable lineage identifier SC-007 for this directive.
    exclusion: Not an execution ID and not a runtime lookup key for evaluation.
  - term: Paired Rule
    definition: Machine-evaluable document at directive/rule/sc007_no_assert_validation.json.
    exclusion: This policy YAML is not a lint source.
  - term: No Assert for Validation
    definition: The `assert` statement SHALL NOT be used for input validation or runtime checks. `assert`
      statements SHALL be used exclusively for internal invariants — conditions that, if false, indicate
      a defect in the function's own logic, not in the caller's inputs.
    exclusion: Not optional style preference when deontic type is Obligation or Prohibition.
principles:
  title: Foundational Principles
  description: This directive operationalizes one or more Coding Doctrine core principles.
  items:
  - id: P1
    title: Determinism Over Cleverness
    description: Every function SHALL produce the same output for the same inputs under the same documented
      conditions. No exceptions. Cleverness that sacrifices determinism is forbidden.
  - id: P2
    title: Localized Failure Handling
    description: Every function SHALL handle its own failures. A function SHALL NOT propagate exceptions
      to its caller for the caller to decide what to do. Failure handling is the responsibility of the
      layer that detects the failure.
  - id: P3
    title: Explicit Over Implicit
    description: Every contract, every side effect, every resource ownership transfer, and every state
      mutation SHALL be declared explicitly. Implicit behavior is forbidden.
  - id: P4
    title: Fail-Safe Defaults
    description: When a function encounters a condition it cannot resolve, it SHALL return a deterministic
      failure result. It SHALL NOT leave the system in a partially mutated state. It SHALL NOT raise an
      exception hoping the caller will clean up.
  - id: P5
    title: Validation as Entry Contract
    description: Every function SHALL validate its inputs before executing any logic. Validation is not
      optional. Validation is not behind feature flags. Validation runs in all environments, including
      production.
  - id: P6
    title: Resource Ownership Is Explicit
    description: Every resource SHALL have a single, documented owner. Ownership transfers SHALL be explicit.
      Every resource SHALL be released deterministically, even in failure paths.
  - id: P7
    title: Single Truth Source
    description: Every piece of data SHALL have exactly one authoritative source. Derived data SHALL be
      computed, never independently maintained.
directives:
  title: Directives (Rules & Standards)
  specific_directives:
  - type: Prohibition
    description: The `assert` statement SHALL NOT be used for input validation or runtime checks. `assert`
      statements SHALL be used exclusively for internal invariants — conditions that, if false, indicate
      a defect in the function's own logic, not in the caller's inputs.
    machine_id: SC-007
    context_conditions: None.
    title: No Assert for Validation
  flexible_standards: []
sanctions:
  title: Sanctions & Remedies
  rows:
  - violation_context: Assert used for validation — raise ValueError or use Result.failure()
    enforcement_action: Machine lint finding via sc007_no_assert_validation.json when automatically enforceable;
      otherwise Lint rule (`pylint:assert-used`), code review gate.
    remediation_path: Replace assert with explicit if/raise or Result.failure() with descriptive message.
guidance:
  title: Guidance, Examples, and Reasoning
  purpose: For human and AI reasoning only. Do not execute this section as a linter.
  reasoning: '`assert` statements are stripped when Python runs with `-O` (optimized mode). Using them
    for validation means validation disappears in production. Runtime validation must use explicit `if`
    checks that raise or return error results unconditionally.'
  explanation: The correct version uses if checks that always run. The incorrect version uses assert which
    is stripped in optimized mode (-O), making validation disappear in production.
  correct_example: |-
    def calculate(a_value: float) -> Result[float]:
        if not isinstance(a_value, (int, float)):
            return Result.failure(f'Expected number, got {type(a_value).__name__}')
        if a_value < 0:
            return Result.failure('Value must be non-negative')
        return Result.success(a_value * 2)
  incorrect_example: |-
    def calculate(a_value: float) -> float:
        assert isinstance(a_value, (int, float)), 'Expected number'
        assert a_value >= 0, 'Value must be non-negative'
        return a_value * 2
  related_machine_ids:
  - SC-009
  - SC-010
  - SC-020
  exceptions: None.
