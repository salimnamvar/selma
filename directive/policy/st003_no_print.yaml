contamination_guard:
  note: 'This document MUST NOT contain machine-executable logic. Prohibited: parameters, conditions,
    evaluator_hint, evaluator_type, evaluator_config, weight, depends_on, conflicts_with, status, created_at,
    expires_at, remediation (as executable carrier), target, lineage.'
  allowed_machine_references:
  - Machine ID ST-003 (cross-reference to rule.lineage_id only)
preamble:
  title: Preamble
  purpose: Establish human-readable obligations for ST-003 (print() used in production code) so authors,
    reviewers, and AI agents can reason about intent without reading evaluator configuration.
  scope: All production Python under this project's safe-coding doctrine, including tests and AI-generated
    code, unless a documented exemption applies.
  existential_need: print() has no log levels, no structured output, and no configurability. It cannot
    be filtered, routed, or analyzed in production.
governance:
  title: Governance & Amendment
  authority: Safe Coding Doctrine / Architecture Owner. Amendments require PR review and must keep policy
    identical in intent to the paired machine rule.
  amendment_process:
  - Propose change via PR touching both this policy YAML and the paired rule JSON when semantics change.
  - Policy-only changes (examples, wording) are allowed if Machine ID intent is unchanged.
  - Never add evaluator_type/evaluator_config or other prohibited fields to this file.
  versioning: MAJOR.MINOR.PATCH aligned with policy_contract_version 8.x
  identity:
    machine_id: ST-003
    maps_to: rule.lineage_id
    paired_execution_id_note: Execution ID in schema layer is ST-003; not redefined as executable data
      here.
definitions:
  title: Definitions
  terms:
  - term: Machine ID
    definition: Immutable lineage identifier ST-003 for this directive.
    exclusion: Not an execution ID and not a runtime lookup key for evaluation.
  - term: Paired Rule
    definition: Machine-evaluable document at directive/rule/st003_no_print.json.
    exclusion: This policy YAML is not a lint source.
  - term: print() used in production code
    definition: print() used in production code
    exclusion: Not optional style preference when deontic type is Obligation or Prohibition.
principles:
  title: Foundational Principles
  description: This directive operationalizes one or more Safe Coding Doctrine core principles.
  items:
  - id: P3
    title: Explicit Over Implicit
    description: Every contract, every side effect, every resource ownership transfer, and every state
      mutation SHALL be declared explicitly. Implicit behavior is forbidden.
directives:
  title: Directives (Rules & Standards)
  specific_directives:
  - type: Prohibition
    description: print() used in production code
    machine_id: ST-003
    context_conditions: See rule JSON exemptions if any.
    title: print() used in production code
  flexible_standards: []
sanctions:
  title: Sanctions & Remedies
  rows:
  - violation_context: print() used in production code
    enforcement_action: Machine lint finding via st003_no_print.json when automatically enforceable; otherwise
      See paired machine rule.
    remediation_path: Replace with structlog.info() or logging.info().
guidance:
  title: Guidance, Examples, and Reasoning
  purpose: For human and AI reasoning only. Do not execute this section as a linter.
  reasoning: print() has no log levels, no structured output, and no configurability. It cannot be filtered,
    routed, or analyzed in production.
  explanation: The correct version uses structlog with structured output. The incorrect version uses print()
    which has no log levels and cannot be configured in production.
  correct_example: |-
    import structlog
    logger = structlog.get_logger()

    def process(a_data: dict) -> Result[str]:
        logger.info('processing', keys=list(a_data.keys()))
        return Result.success('done')
  incorrect_example: |-
    def process(a_data: dict) -> Result[str]:
        print(f'Processing {a_data}')
        return Result.success('done')
  related_machine_ids:
  - SC-060
  - SC-061
  exceptions: See rule JSON exemptions if any.
references:
  title: References & Annexes
  source_doctrine: .nasim/rules/code/safe-coding.md
