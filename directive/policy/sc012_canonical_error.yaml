preamble:
  title: Preamble
  purpose: Establish human-readable obligations for SC-012 (Canonical Error Handling Pattern) so authors,
    reviewers, and AI agents can reason about intent without reading evaluator configuration.
  scope: All production code under this coding doctrine, including tests and AI-generated
    code, unless a documented exemption applies.
  existential_need: 'The canonical pattern ensures every function: (a) validates inputs, (b) handles exceptions
    locally, (c) cleans up resources, (d) returns a structured result, and (e) has a single exit point.
    Deviation from this pattern creates inconsistency and increases the likelihood of missed error handling.'
governance:
  title: Governance & Amendment
  authority: Coding Doctrine / Architecture Owner. Amendments require PR review and must keep policy
    identical in intent to the paired machine rule.
  amendment_process:
  - Propose change via PR touching both this policy YAML and the paired rule JSON when semantics change.
  - Policy-only changes (examples, wording) are allowed if Machine ID intent is unchanged.
  - Never add evaluator_type/evaluator_config or other prohibited fields to this file.
  versioning: MAJOR.MINOR.PATCH aligned with policy_contract_version 8.x
  identity:
    machine_id: SC-012
    maps_to: rule.lineage_id
    paired_execution_id_note: Execution ID in schema layer is SC-012; not redefined as executable data
      here.
definitions:
  title: Definitions
  terms:
  - term: Machine ID
    definition: Immutable lineage identifier SC-012 for this directive.
    exclusion: Not an execution ID and not a runtime lookup key for evaluation.
  - term: Paired Rule
    definition: Machine-evaluable document at directive/rule/sc012_canonical_error.json.
    exclusion: This policy YAML is not a lint source.
  - term: Canonical Error Handling Pattern
    definition: 'All functions SHALL follow the canonical error handling pattern: ```python def function_name(param:
      Type) -> Result[ReturnType]: result: Result[ReturnType] = INVALID_RESULT b_continue = True # Phase
      1: Input validation if not isinstance(param, ExpectedType): message = f"Invalid type: expected {ExpectedType.__name__},
      got {type(param).__name__}" result = Result(is_success=False, value=None, message=message) b_continue
      = False # Phase 2: Business logic (only if b_continue is True) if b_continue: try: # ... core logic
      ... result = Result(is_success=True, value=computed_value, message="Success") except SpecificException
      as e: message = f"Operation failed: {e}" result = Result(is_success=False, value=None, message=message)
      b_continue = False finally: # Resource cleanup resource.release() # Phase 3: Single return return
      result ```'
    exclusion: Not optional style preference when deontic type is Obligation or Prohibition.
principles:
  title: Foundational Principles
  description: This directive operationalizes one or more Coding Doctrine core principles.
  items:
  - id: P1
    title: Determinism Over Cleverness
    description: Every function SHALL produce the same output for the same inputs under the same documented
      conditions. No exceptions. Cleverness that sacrifices determinism is forbidden.
  - id: P2
    title: Localized Failure Handling
    description: Every function SHALL handle its own failures. A function SHALL NOT propagate exceptions
      to its caller for the caller to decide what to do. Failure handling is the responsibility of the
      layer that detects the failure.
  - id: P3
    title: Explicit Over Implicit
    description: Every contract, every side effect, every resource ownership transfer, and every state
      mutation SHALL be declared explicitly. Implicit behavior is forbidden.
  - id: P4
    title: Fail-Safe Defaults
    description: When a function encounters a condition it cannot resolve, it SHALL return a deterministic
      failure result. It SHALL NOT leave the system in a partially mutated state. It SHALL NOT raise an
      exception hoping the caller will clean up.
  - id: P5
    title: Validation as Entry Contract
    description: Every function SHALL validate its inputs before executing any logic. Validation is not
      optional. Validation is not behind feature flags. Validation runs in all environments, including
      production.
  - id: P6
    title: Resource Ownership Is Explicit
    description: Every resource SHALL have a single, documented owner. Ownership transfers SHALL be explicit.
      Every resource SHALL be released deterministically, even in failure paths.
  - id: P7
    title: Single Truth Source
    description: Every piece of data SHALL have exactly one authoritative source. Derived data SHALL be
      computed, never independently maintained.
directives:
  title: Directives (Rules & Standards)
  specific_directives:
  - type: Obligation
    description: 'All functions SHALL follow the canonical error handling pattern: ```python def function_name(param:
      Type) -> Result[ReturnType]: result: Result[ReturnType] = INVALID_RESULT b_continue = True # Phase
      1: Input validation if not isinstance(param, ExpectedType): message = f"Invalid type: expected {ExpectedType.__name__},
      got {type(param).__name__}" result = Result(is_success=False, value=None, message=message) b_continue
      = False # Phase 2: Business logic (only if b_continue is True) if b_continue: try: # ... core logic
      ... result = Result(is_success=True, value=computed_value, message="Success") except SpecificException
      as e: message = f"Operation failed: {e}" result = Result(is_success=False, value=None, message=message)
      b_continue = False finally: # Resource cleanup resource.release() # Phase 3: Single return return
      result ```'
    machine_id: SC-012
    context_conditions: Pure functions with no state mutation or resource usage may omit the `finally`
      block and `b_continue` if they have no exception-throwing operations.
    title: Canonical Error Handling Pattern
  flexible_standards: []
sanctions:
  title: Sanctions & Remedies
  rows:
