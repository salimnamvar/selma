    maps_to: rule.lineage_id
    paired_execution_id_note: Execution ID in schema layer is SC-090; not redefined as executable data
      here.
definitions:
  title: Definitions
  terms:
  - term: Machine ID
    definition: Immutable lineage identifier SC-090 for this directive.
    exclusion: Not an execution ID and not a runtime lookup key for evaluation.
  - term: Paired Rule
    definition: Machine-evaluable document at directive/rule/sc090_shared_state.json.
    exclusion: This policy YAML is not a lint source.
  - term: Shared State Protection
    definition: All shared mutable state accessed by concurrent execution paths SHALL be protected by
      appropriate synchronization mechanisms (locks, semaphores, atomic operations, or concurrent-safe
      data structures).
    exclusion: Not optional style preference when deontic type is Obligation or Prohibition.
principles:
  title: Foundational Principles
  description: This directive operationalizes one or more Coding Doctrine core principles.
  items:
  - id: P1
    title: Determinism Over Cleverness
    description: Every function SHALL produce the same output for the same inputs under the same documented
      conditions. No exceptions. Cleverness that sacrifices determinism is forbidden.
  - id: P2
    title: Localized Failure Handling
    description: Every function SHALL handle its own failures. A function SHALL NOT propagate exceptions
      to its caller for the caller to decide what to do. Failure handling is the responsibility of the
      layer that detects the failure.
  - id: P3
    title: Explicit Over Implicit
    description: Every contract, every side effect, every resource ownership transfer, and every state
      mutation SHALL be declared explicitly. Implicit behavior is forbidden.
  - id: P4
    title: Fail-Safe Defaults
    description: When a function encounters a condition it cannot resolve, it SHALL return a deterministic
      failure result. It SHALL NOT leave the system in a partially mutated state. It SHALL NOT raise an
      exception hoping the caller will clean up.
  - id: P5
    title: Validation as Entry Contract
    description: Every function SHALL validate its inputs before executing any logic. Validation is not
      optional. Validation is not behind feature flags. Validation runs in all environments, including
      production.
  - id: P6
    title: Resource Ownership Is Explicit
    description: Every resource SHALL have a single, documented owner. Ownership transfers SHALL be explicit.
      Every resource SHALL be released deterministically, even in failure paths.
  - id: P7
    title: Single Truth Source
    description: Every piece of data SHALL have exactly one authoritative source. Derived data SHALL be
      computed, never independently maintained.
directives:
  title: Directives (Rules & Standards)
  specific_directives:
  - type: Prohibition
    description: All shared mutable state accessed by concurrent execution paths SHALL be protected by
      appropriate synchronization mechanisms (locks, semaphores, atomic operations, or concurrent-safe
      data structures).
    machine_id: SC-090
    context_conditions: None.
    title: Shared State Protection
  flexible_standards: []
sanctions:
  title: Sanctions & Remedies
  rows:
  - violation_context: Mutable shared state detected — use thread-safe patterns
    enforcement_action: Machine lint finding via sc090_shared_state.json when automatically enforceable;
      otherwise Code review gate, concurrency testing.
    remediation_path: Use threading.Lock, queue.Queue, or immutable data structures to protect shared
      state.
guidance:
  title: Guidance, Examples, and Reasoning
  purpose: For human and AI reasoning only. Do not execute this section as a linter.
  reasoning: Unprotected shared state under concurrent access causes data races, torn reads, and corrupted
    state. These failures are non-deterministic and nearly impossible to reproduce.
  explanation: The correct version uses a threading.Lock to synchronize access. The incorrect version
    uses a global mutable variable without synchronization, creating data races.
  correct_example: |-
    import threading

    class Counter:
        def __init__(self):
            self._count = 0
            self._lock = threading.Lock()

        def increment(self) -> Result[int]:
            with self._lock:
                self._count += 1
                return Result.success(self._count)
  incorrect_example: |-
    counter = 0

    def increment() -> Result[int]:
        global counter
        counter += 1
        return Result.success(counter)
  related_machine_ids:
  - SC-070
  - SC-073
  exceptions: None.
