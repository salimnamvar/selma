preamble:
  title: Preamble
  purpose: Establish human-readable obligations for SC-090 (Shared State Protection) so authors, reviewers,
    and AI agents can reason about intent without reading evaluator configuration.
  scope: All production code under this coding doctrine, including tests and AI-generated
    code, unless a documented exemption applies.
  existential_need: Unprotected shared state under concurrent access causes data races, torn reads, and
    corrupted state. These failures are non-deterministic and nearly impossible to reproduce.
