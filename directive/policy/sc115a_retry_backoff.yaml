preamble:
  title: Preamble
  purpose: Establish human-readable obligations for SC-115A (Retry and Backoff) so authors, reviewers,
    and AI agents can reason about intent without reading evaluator configuration.
  scope: All production code under this coding doctrine, including tests and AI-generated
    code, unless a documented exemption applies.
  existential_need: Unbounded retries amplify failures. No retries make the system brittle on transient
    issues. Bounded retry with backoff balances resilience with safety.
