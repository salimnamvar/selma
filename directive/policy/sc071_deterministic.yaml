# Policy doctrine — governance intent, guidance, examples, reasoning ONLY.
# MUST NOT be used for linting/evaluation at runtime.
# Machine lint source: matching file under directive/rule/*.json
# Schema contract: schema/policy_doctrine.yaml
# Normative source: doctrinal-source.md

doctrine:
  name: sc-071-sc071_deterministic
  version: 8.2.4
  description: 'Human governance doctrine for SC-071: Deterministic Execution. Guidance and reasoning
    only — not machine-executable.'
  spec_version: 8.2.4
  schema_version: 8.2.4
  schema_id: universal-rule-schema
  machine_id: SC-071
  paired_rule_file: directive/rule/sc071_deterministic.json
  purpose_layer: governance_intent_guidance_examples_reasoning
  runtime_prohibition: This file MUST NOT be read during inspection, evaluation, finding FSM transitions,
    or conflict resolution at runtime. Linting sources are ONLY the JSON rules under directive/rule/.
cross_layer_binding:
  normative_source: doctrinal-source.md
  policy_purpose: Governance intent, examples, reasoning, and human guidance
  schema_purpose: Structural projection of machine-evaluable invariants
  lint_source: directive/rule/sc071_deterministic.json
  enforcement: Policy influences humans and authoring tools only. Compile-time/runtime evaluation uses
    JSON rules exclusively.
contamination_guard:
  note: 'This document MUST NOT contain machine-executable logic. Prohibited: parameters, conditions,
    evaluator_hint, evaluator_type, evaluator_config, weight, depends_on, conflicts_with, status, created_at,
    expires_at, remediation (as executable carrier), target, lineage.'
  allowed_machine_references:
  - Machine ID SC-071 (cross-reference to rule.lineage_id only)
preamble:
  title: Preamble
  purpose: Establish human-readable obligations for SC-071 (Deterministic Execution) so authors, reviewers,
    and AI agents can reason about intent without reading evaluator configuration.
  scope: All production code under this coding doctrine, including tests and AI-generated
    code, unless a documented exemption applies.
  existential_need: Non-deterministic code is untestable and unreproducible. A test that passes sometimes
    and fails sometimes is a test that tells you nothing.
governance:
  title: Governance & Amendment
  authority: Coding Doctrine / Architecture Owner. Amendments require PR review and must keep policy
    identical in intent to the paired machine rule.
  amendment_process:
  - Propose change via PR touching both this policy YAML and the paired rule JSON when semantics change.
  - Policy-only changes (examples, wording) are allowed if Machine ID intent is unchanged.
  - Never add evaluator_type/evaluator_config or other prohibited fields to this file.
  versioning: MAJOR.MINOR.PATCH aligned with policy_contract_version 8.x
  identity:
    machine_id: SC-071
    maps_to: rule.lineage_id
    paired_execution_id_note: Execution ID in schema layer is SC-071; not redefined as executable data
      here.
definitions:
  title: Definitions
  terms:
  - term: Machine ID
    definition: Immutable lineage identifier SC-071 for this directive.
    exclusion: Not an execution ID and not a runtime lookup key for evaluation.
  - term: Paired Rule
    definition: Machine-evaluable document at directive/rule/sc071_deterministic.json.
    exclusion: This policy YAML is not a lint source.
  - term: Deterministic Execution
    definition: 'Business logic SHALL NOT depend on: `datetime.now()`, `time.time()`, `random.random()`
      without a fixed seed, UUID generation without deterministic mode, or any other source of non-determinism.
      Time-dependent logic SHALL accept a timestamp parameter. Random-dependent logic SHALL accept a seed
      parameter.'
    exclusion: Not optional style preference when deontic type is Obligation or Prohibition.
principles:
  title: Foundational Principles
  description: This directive operationalizes one or more Coding Doctrine core principles.
  items:
  - id: P1
    title: Determinism Over Cleverness
    description: Every function SHALL produce the same output for the same inputs under the same documented
      conditions. No exceptions. Cleverness that sacrifices determinism is forbidden.
  - id: P2
    title: Localized Failure Handling
    description: Every function SHALL handle its own failures. A function SHALL NOT propagate exceptions
      to its caller for the caller to decide what to do. Failure handling is the responsibility of the
      layer that detects the failure.
  - id: P3
    title: Explicit Over Implicit
    description: Every contract, every side effect, every resource ownership transfer, and every state
      mutation SHALL be declared explicitly. Implicit behavior is forbidden.
  - id: P4
    title: Fail-Safe Defaults
    description: When a function encounters a condition it cannot resolve, it SHALL return a deterministic
      failure result. It SHALL NOT leave the system in a partially mutated state. It SHALL NOT raise an
      exception hoping the caller will clean up.
  - id: P5
    title: Validation as Entry Contract
    description: Every function SHALL validate its inputs before executing any logic. Validation is not
      optional. Validation is not behind feature flags. Validation runs in all environments, including
      production.
  - id: P6
    title: Resource Ownership Is Explicit
    description: Every resource SHALL have a single, documented owner. Ownership transfers SHALL be explicit.
      Every resource SHALL be released deterministically, even in failure paths.
  - id: P7
    title: Single Truth Source
    description: Every piece of data SHALL have exactly one authoritative source. Derived data SHALL be
      computed, never independently maintained.
directives:
  title: Directives (Rules & Standards)
  specific_directives:
  - type: Prohibition
    description: 'Business logic SHALL NOT depend on: `datetime.now()`, `time.time()`, `random.random()`
      without a fixed seed, UUID generation without deterministic mode, or any other source of non-determinism.
      Time-dependent logic SHALL accept a timestamp parameter. Random-dependent logic SHALL accept a seed
      parameter.'
    machine_id: SC-071
    context_conditions: 'Cryptographically secure randomness SHALL ONLY be used for: (a) token generation
      (JWT, session IDs), (b) cryptographic nonce generation, (c) password reset tokens. All other randomness
      MUST be deterministic or injected as a parameter. Functions using cryptographic RNG MUST document
      the security justification in their contract. Database drivers, logging frameworks, and metric emitters
      are exempt from this rule, as their non-determinism is an accepted infrastructure contract.'
    title: Deterministic Execution
  flexible_standards: []
sanctions:
  title: Sanctions & Remedies
  rows:
  - violation_context: Non-deterministic call forbidden — inject time/random source
    enforcement_action: Machine lint finding via sc071_deterministic.json when automatically enforceable;
      otherwise Code review gate, static analysis.
    remediation_path: Inject time/random as parameters. Use datetime.datetime for timestamps, random.Random
      with seed for random values.
guidance:
  title: Guidance, Examples, and Reasoning
  purpose: For human and AI reasoning only. Do not execute this section as a linter.
  reasoning: Non-deterministic code is untestable and unreproducible. A test that passes sometimes and
    fails sometimes is a test that tells you nothing.
  explanation: The correct version accepts a timestamp parameter (injectable for testing) with a default
    fallback. The incorrect version calls datetime.now() directly, making the function non-deterministic
    and untestable.
  correct_example: |-
    from datetime import datetime

    def create_timestamp(a_now: datetime | None = None) -> Result[str]:
        now = a_now or datetime.now()
        return Result.success(now.isoformat())
  incorrect_example: |-
    from datetime import datetime

    def create_timestamp() -> Result[str]:
        now = datetime.now()
        return Result.success(now.isoformat())
  related_machine_ids:
  - SC-004
  - SC-023
  exceptions: 'Cryptographically secure randomness SHALL ONLY be used for: (a) token generation (JWT,
    session IDs), (b) cryptographic nonce generation, (c) password reset tokens. All other randomness
    MUST be deterministic or injected as a parameter. Functions using cryptographic RNG MUST document
    the security justification in their contract. Database drivers, logging frameworks, and metric emitters
    are exempt from this rule, as their non-determinism is an accepted infrastructure contract.'
