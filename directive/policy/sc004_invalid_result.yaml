definitions:
  title: Definitions
  terms:
  - term: Machine ID
    definition: Immutable lineage identifier SC-004 for this directive.
    exclusion: Not an execution ID and not a runtime lookup key for evaluation.
  - term: Paired Rule
    definition: Machine-evaluable document at directive/rule/sc004_invalid_result.json.
    exclusion: This policy YAML is not a lint source.
  - term: INVALID_RESULT Sentinel
    definition: Each module SHALL define a module-level `INVALID_RESULT` constant of type `Result[Any]`.
      This sentinel SHALL be returned only when the function's postcondition cannot be satisfied under
      any circumstance — when the function has exhausted all recovery paths and the result is fundamentally
      invalid. It SHALL also be used as the initial default value for the result variable in the canonical
      pattern. The sentinel is NOT a generic error — it represents irrecoverable failure. Expected validation
      failures SHALL return `Result.failure(message)` instead.
    exclusion: Not optional style preference when deontic type is Obligation or Prohibition.
principles:
  title: Foundational Principles
  description: This directive operationalizes one or more Coding Doctrine core principles.
  items:
  - id: P1
    title: Determinism Over Cleverness
    description: Every function SHALL produce the same output for the same inputs under the same documented
      conditions. No exceptions. Cleverness that sacrifices determinism is forbidden.
  - id: P2
    title: Localized Failure Handling
    description: Every function SHALL handle its own failures. A function SHALL NOT propagate exceptions
      to its caller for the caller to decide what to do. Failure handling is the responsibility of the
      layer that detects the failure.
  - id: P3
    title: Explicit Over Implicit
    description: Every contract, every side effect, every resource ownership transfer, and every state
      mutation SHALL be declared explicitly. Implicit behavior is forbidden.
  - id: P4
    title: Fail-Safe Defaults
    description: When a function encounters a condition it cannot resolve, it SHALL return a deterministic
      failure result. It SHALL NOT leave the system in a partially mutated state. It SHALL NOT raise an
      exception hoping the caller will clean up.
  - id: P5
    title: Validation as Entry Contract
    description: Every function SHALL validate its inputs before executing any logic. Validation is not
      optional. Validation is not behind feature flags. Validation runs in all environments, including
      production.
  - id: P6
    title: Resource Ownership Is Explicit
    description: Every resource SHALL have a single, documented owner. Ownership transfers SHALL be explicit.
      Every resource SHALL be released deterministically, even in failure paths.
  - id: P7
    title: Single Truth Source
    description: Every piece of data SHALL have exactly one authoritative source. Derived data SHALL be
      computed, never independently maintained.
directives:
  title: Directives (Rules & Standards)
  specific_directives:
  - type: Obligation
    description: Each module SHALL define a module-level `INVALID_RESULT` constant of type `Result[Any]`.
      This sentinel SHALL be returned only when the function's postcondition cannot be satisfied under
      any circumstance — when the function has exhausted all recovery paths and the result is fundamentally
      invalid. It SHALL also be used as the initial default value for the result variable in the canonical
      pattern. The sentinel is NOT a generic error — it represents irrecoverable failure. Expected validation
      failures SHALL return `Result.failure(message)` instead.
    machine_id: SC-004
    context_conditions: Pure functions with no state mutation (they return their result directly via the
      `value` field).
    title: INVALID_RESULT Sentinel
  flexible_standards: []
sanctions:
  title: Sanctions & Remedies
  rows:
  - violation_context: Module has functions returning Result but missing INVALID_RESULT sentinel
    enforcement_action: Machine lint finding via sc004_invalid_result.json when automatically enforceable;
      otherwise Lint rule (custom check for sentinel definition), code review gate.
    remediation_path: Define a module-level INVALID_RESULT sentinel and use it as the initial default
      for result variables.
guidance:
  title: Guidance, Examples, and Reasoning
  purpose: For human and AI reasoning only. Do not execute this section as a linter.
  reasoning: '`INVALID_RESULT` is not a generic error. It is a declaration that the function''s contract
    has been irreparably violated. It exists to prevent callers from treating a fundamentally broken state
    as a recoverable error.'
  explanation: The correct version defines a module-level INVALID_RESULT sentinel used as initial default.
    The incorrect version has no sentinel, making it unclear what result represents an unrecoverable state.
  correct_example: |-
    INVALID_RESULT: Result[Any] = Result.failure('Irrecoverable state')

    def process(a_data: dict) -> Result[str]:
        result: Result[str] = INVALID_RESULT
        b_continue = True
        if not isinstance(a_data, dict):
            result = Result.failure('Expected dict')
            b_continue = False
        if b_continue:
            result = Result.success(a_data.get('name', ''))
        return result
  incorrect_example: |-
    def process(a_data: dict) -> Result[str]:
        result = None
        if not isinstance(a_data, dict):
            return Result.failure('Expected dict')
        return Result.success(a_data.get('name', ''))
  related_machine_ids:
  - SC-003
  - SC-010
  exceptions: Pure functions with no state mutation (they return their result directly via the `value`
    field).
