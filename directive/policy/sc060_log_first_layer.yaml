    enforcement_action: Machine lint finding via sc060_log_first_layer.json when automatically enforceable;
      otherwise Lint rule (custom), code review gate.
    remediation_path: Log at the first layer that detects the failure. Higher layers only re-log if adding
      materially new context.
guidance:
  title: Guidance, Examples, and Reasoning
  purpose: For human and AI reasoning only. Do not execute this section as a linter.
  reasoning: Re-logging the same failure at multiple layers creates log noise, obscures the actual failure
    point, and wastes storage. The detection layer has the best context for a meaningful log entry.
  explanation: The correct version logs only at the detection layer. The incorrect version re-logs the
    same failure at multiple layers, creating noise and obscuring the actual failure point.
  correct_example: |-
    def fetch(a_url: str) -> Result[str]:
        b_continue = True
        result: Result[str] = INVALID_RESULT
        try:
            response = requests.get(a_url, timeout=30)
        except requests.Timeout as e:
            logger.error('Request timed out', url=a_url, error=str(e))
            result = Result.failure(f'Request timed out: {e}')
            b_continue = False
        if b_continue:
            result = Result.success(response.text)
        return result
  incorrect_example: |-
    def process(a_url: str) -> Result[str]:
        result = fetch(a_url)
        if not result.is_success():
            logger.error(f'Fetch failed: {result.message}')
        return result
    def fetch(a_url: str) -> Result[str]:
        result = do_fetch(a_url)
        if not result.is_success():
            logger.error(f'Do fetch failed: {result.message}')
        return result
  related_machine_ids:
  - SC-040
  - SC-050
  - SC-061
  exceptions: None.
