preamble:
  title: Preamble
  purpose: Establish human-readable obligations for SC-060 (Log at First Detection Layer) so authors,
    reviewers, and AI agents can reason about intent without reading evaluator configuration.
  scope: All production code under this coding doctrine, including tests and AI-generated
    code, unless a documented exemption applies.
  existential_need: Re-logging the same failure at multiple layers creates log noise, obscures the actual
    failure point, and wastes storage. The detection layer has the best context for a meaningful log entry.
