# Policy doctrine — governance intent, guidance, examples, reasoning ONLY.
# MUST NOT be used for linting/evaluation at runtime.
# Machine lint source: matching file under directive/rule/*.json
# Schema contract: schema/policy_doctrine.yaml
# Normative source: doctrinal-source.md

doctrine:
  name: st-004-st004_todo_format
  version: 8.2.4
  description: 'Human governance doctrine for ST-004: TODO/FIXME must follow format: # TODO(name): description.
    Guidance and reasoning only — not machine-executable.'
  spec_version: 8.2.4
  schema_version: 8.2.4
  schema_id: universal-rule-schema
  machine_id: ST-004
  paired_rule_file: directive/rule/st004_todo_format.json
  purpose_layer: governance_intent_guidance_examples_reasoning
  runtime_prohibition: This file MUST NOT be read during inspection, evaluation, finding FSM transitions,
    or conflict resolution at runtime. Linting sources are ONLY the JSON rules under directive/rule/.
cross_layer_binding:
  normative_source: doctrinal-source.md
  policy_purpose: Governance intent, examples, reasoning, and human guidance
  schema_purpose: Structural projection of machine-evaluable invariants
  lint_source: directive/rule/st004_todo_format.json
  enforcement: Policy influences humans and authoring tools only. Compile-time/runtime evaluation uses
    JSON rules exclusively.
contamination_guard:
  note: 'This document MUST NOT contain machine-executable logic. Prohibited: parameters, conditions,
    evaluator_hint, evaluator_type, evaluator_config, weight, depends_on, conflicts_with, status, created_at,
    expires_at, remediation (as executable carrier), target, lineage.'
  allowed_machine_references:
  - Machine ID ST-004 (cross-reference to rule.lineage_id only)
preamble:
  title: Preamble
  purpose: 'Establish human-readable obligations for ST-004 (TODO/FIXME must follow format: # TODO(name):
    description) so authors, reviewers, and AI agents can reason about intent without reading evaluator
    configuration.'
  scope: All production code under this coding doctrine, including tests and AI-generated
    code, unless a documented exemption applies.
  existential_need: Unformatted TODOs are hard to track and assign ownership. A consistent format enables
    automated tracking and assignment.
governance:
  title: Governance & Amendment
  authority: Coding Doctrine / Architecture Owner. Amendments require PR review and must keep policy
    identical in intent to the paired machine rule.
  amendment_process:
  - Propose change via PR touching both this policy YAML and the paired rule JSON when semantics change.
  - Policy-only changes (examples, wording) are allowed if Machine ID intent is unchanged.
  - Never add evaluator_type/evaluator_config or other prohibited fields to this file.
  versioning: MAJOR.MINOR.PATCH aligned with policy_contract_version 8.x
  identity:
    machine_id: ST-004
    maps_to: rule.lineage_id
    paired_execution_id_note: Execution ID in schema layer is ST-004; not redefined as executable data
      here.
definitions:
  title: Definitions
  terms:
  - term: Machine ID
    definition: Immutable lineage identifier ST-004 for this directive.
    exclusion: Not an execution ID and not a runtime lookup key for evaluation.
  - term: Paired Rule
    definition: Machine-evaluable document at directive/rule/st004_todo_format.json.
    exclusion: This policy YAML is not a lint source.
  - term: 'TODO/FIXME must follow format: # TODO(name): description'
    definition: 'TODO/FIXME must follow format: # TODO(name): description'
    exclusion: Not optional style preference when deontic type is Obligation or Prohibition.
principles:
  title: Foundational Principles
  description: This directive operationalizes one or more Coding Doctrine core principles.
  items:
  - id: P3
    title: Explicit Over Implicit
    description: Every contract, every side effect, every resource ownership transfer, and every state
      mutation SHALL be declared explicitly. Implicit behavior is forbidden.
directives:
  title: Directives (Rules & Standards)
  specific_directives:
  - type: Obligation
    description: 'TODO/FIXME must follow format: # TODO(name): description'
    machine_id: ST-004
    context_conditions: See rule JSON exemptions if any.
    title: 'TODO/FIXME must follow format: # TODO(name): description'
  flexible_standards: []
sanctions:
  title: Sanctions & Remedies
  rows:
  - violation_context: 'TODO/FIXME must follow format: # TODO(name): description'
    enforcement_action: Machine lint finding via st004_todo_format.json when automatically enforceable;
      otherwise See paired machine rule.
    remediation_path: 'Use format: # TODO(yourname): description or # FIXME(yourname): description'
guidance:
  title: Guidance, Examples, and Reasoning
  purpose: For human and AI reasoning only. Do not execute this section as a linter.
  reasoning: Unformatted TODOs are hard to track and assign ownership. A consistent format enables automated
    tracking and assignment.
  explanation: The correct version includes the author's name and a descriptive message. The incorrect
    version has no name or description, making ownership unclear.
  correct_example: |-
    # TODO(alice): Add retry logic for transient failures
    # FIXME(bob): Handle edge case when list is empty
  incorrect_example: |-
    # TODO: fix this
    # FIXME: broken
  related_machine_ids: []
  exceptions: See rule JSON exemptions if any.
references:
  title: References & Annexes
  source_doctrine: doctrinal-source.md
  policy_schema: schema/policy_doctrine.yaml
  rule_schema: schema/rule_schema.json
  paired_rule: directive/rule/st004_todo_format.json
  anchor_ref: section:directives/st004_todo_format
  related: []
