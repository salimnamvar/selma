preamble:
  title: Preamble
  purpose: Establish human-readable obligations for SC-052 (No Exception Re-Raising) so authors, reviewers,
    and AI agents can reason about intent without reading evaluator configuration.
  scope: All production Python under this project's safe-coding doctrine, including tests and AI-generated
    code, unless a documented exemption applies.
  existential_need: Re-raising is a declaration that the function chose not to handle the error. Under
    the Zero-Raise Policy, every function must handle its own errors. Re-raising violates this principle.
