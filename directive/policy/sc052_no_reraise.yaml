definitions:
  title: Definitions
  terms:
  - term: Machine ID
    definition: Immutable lineage identifier SC-052 for this directive.
    exclusion: Not an execution ID and not a runtime lookup key for evaluation.
  - term: Paired Rule
    definition: Machine-evaluable document at directive/rule/sc052_no_reraise.json.
    exclusion: This policy YAML is not a lint source.
  - term: No Exception Re-Raising
    definition: A caught exception SHALL NOT be re-raised. Once caught, it SHALL be converted to a structured
      result. The function SHALL NOT `raise` the caught exception or a new exception wrapping it.
    exclusion: Not optional style preference when deontic type is Obligation or Prohibition.
principles:
  title: Foundational Principles
  description: This directive operationalizes one or more Safe Coding Doctrine core principles.
  items:
  - id: P1
    title: Determinism Over Cleverness
    description: Every function SHALL produce the same output for the same inputs under the same documented
      conditions. No exceptions. Cleverness that sacrifices determinism is forbidden.
  - id: P2
    title: Localized Failure Handling
    description: Every function SHALL handle its own failures. A function SHALL NOT propagate exceptions
      to its caller for the caller to decide what to do. Failure handling is the responsibility of the
      layer that detects the failure.
  - id: P3
    title: Explicit Over Implicit
    description: Every contract, every side effect, every resource ownership transfer, and every state
      mutation SHALL be declared explicitly. Implicit behavior is forbidden.
  - id: P4
    title: Fail-Safe Defaults
    description: When a function encounters a condition it cannot resolve, it SHALL return a deterministic
      failure result. It SHALL NOT leave the system in a partially mutated state. It SHALL NOT raise an
      exception hoping the caller will clean up.
  - id: P5
    title: Validation as Entry Contract
    description: Every function SHALL validate its inputs before executing any logic. Validation is not
      optional. Validation is not behind feature flags. Validation runs in all environments, including
      production.
  - id: P6
    title: Resource Ownership Is Explicit
    description: Every resource SHALL have a single, documented owner. Ownership transfers SHALL be explicit.
      Every resource SHALL be released deterministically, even in failure paths.
  - id: P7
    title: Single Truth Source
    description: Every piece of data SHALL have exactly one authoritative source. Derived data SHALL be
      computed, never independently maintained.
directives:
  title: Directives (Rules & Standards)
  specific_directives:
  - type: Prohibition
    description: A caught exception SHALL NOT be re-raised. Once caught, it SHALL be converted to a structured
      result. The function SHALL NOT `raise` the caught exception or a new exception wrapping it.
    machine_id: SC-052
    context_conditions: None (see SC-002 for dunder method exemptions).
    title: No Exception Re-Raising
  flexible_standards: []
sanctions:
  title: Sanctions & Remedies
  rows:
  - violation_context: Re-raise forbidden — convert exception to Result return
    enforcement_action: Machine lint finding via sc052_no_reraise.json when automatically enforceable;
      otherwise Lint rule (custom `raise` detection), code review gate.
    remediation_path: Convert the caught exception to a structured Result.failure() return instead of
      re-raising.
guidance:
  title: Guidance, Examples, and Reasoning
  purpose: For human and AI reasoning only. Do not execute this section as a linter.
  reasoning: Re-raising is a declaration that the function chose not to handle the error. Under the Zero-Raise
    Policy, every function must handle its own errors. Re-raising violates this principle.
  explanation: The correct version converts the exception to Result.failure(). The incorrect version re-raises,
    violating the Zero-Raise Policy by transferring error handling to the caller.
  correct_example: |-
    def query(a_sql: str) -> Result[list]:
        b_continue = True
        result: Result[list] = INVALID_RESULT
        try:
            cursor.execute(a_sql)
            rows = cursor.fetchall()
        except sqlite3.OperationalError as e:
            result = Result.failure(f'SQL error: {e}')
            b_continue = False
        if b_continue:
            result = Result.success(rows)
        return result
  incorrect_example: |-
    def query(a_sql: str) -> Result[list]:
        try:
            cursor.execute(a_sql)
            rows = cursor.fetchall()
            return Result.success(rows)
        except sqlite3.OperationalError as e:
            raise RuntimeError(f'SQL failed: {e}')
  related_machine_ids:
  - SC-002
  - SC-050
  exceptions: None (see SC-002 for dunder method exemptions).
