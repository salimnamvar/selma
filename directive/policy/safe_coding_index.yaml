  name: safe-coding-policy-index
  version: 8.2.4
  description: Index of Safe Coding policy doctrines. Policy YAML is for guidance, examples, and reasoning
    only. Linting sources are ONLY directive/rule/*.json.
  spec_version: 8.2.4
  schema_version: 8.2.4
