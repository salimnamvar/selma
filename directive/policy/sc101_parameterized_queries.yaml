preamble:
  title: Preamble
  purpose: Establish human-readable obligations for SC-101 (Parameterized Queries) so authors, reviewers,
    and AI agents can reason about intent without reading evaluator configuration.
  scope: All production Python under this project's safe-coding doctrine, including tests and AI-generated
    code, unless a documented exemption applies.
  existential_need: String-formatted SQL queries are the primary vector for SQL injection attacks. Parameterized
    queries separate data from code, eliminating this class of vulnerability entirely.
