sanctions:
  title: Sanctions & Remedies
  rows:
  - violation_context: Use structured logging (structlog) instead of print/logging
    enforcement_action: Machine lint finding via sc061_structured_logging.json when automatically enforceable;
      otherwise Custom logger wrapper, code review gate.
    remediation_path: Replace print() with structlog.info() or similar structured logger.
guidance:
  title: Guidance, Examples, and Reasoning
  purpose: For human and AI reasoning only. Do not execute this section as a linter.
  reasoning: Structured logs are machine-parseable. They enable automated alerting, aggregation, and analysis.
    Unstructured log strings are unsearchable at scale.
  explanation: The correct version uses structlog with structured key-value pairs. The incorrect version
    uses print() which has no log levels, no structured output, and no configurability.
  correct_example: |-
    import structlog
    logger = structlog.get_logger()

    def process(a_data: dict) -> Result[str]:
        logger.info('processing_started', data_keys=list(a_data.keys()))
        name = a_data.get('name', '')
        logger.info('processing_complete', name=name)
        return Result.success(name)
  incorrect_example: |-
    def process(a_data: dict) -> Result[str]:
        print(f'Processing: {a_data}')
        name = a_data.get('name', '')
        print(f'Done: {name}')
        return Result.success(name)
  related_machine_ids:
  - SC-060
  - SC-062
  exceptions: None.
