principles:
  title: Foundational Principles
  description: This directive operationalizes one or more Coding Doctrine core principles.
  items:
  - id: P1
    title: Determinism Over Cleverness
    description: Every function SHALL produce the same output for the same inputs under the same documented
      conditions. No exceptions. Cleverness that sacrifices determinism is forbidden.
  - id: P4
    title: Fail-Safe Defaults
    description: When a function encounters a condition it cannot resolve, it SHALL return a deterministic
      failure result. It SHALL NOT leave the system in a partially mutated state. It SHALL NOT raise an
      exception hoping the caller will clean up.
directives:
  title: Directives (Rules & Standards)
  specific_directives:
  - type: Prohibition
    description: Mutable default argument in function signature
    machine_id: ST-002
    context_conditions: See rule JSON exemptions if any.
    title: Mutable default argument in function signature
  flexible_standards: []
sanctions:
  title: Sanctions & Remedies
  rows:
  - violation_context: Mutable default argument in function signature
    enforcement_action: Machine lint finding via st002_mutable_default.json when automatically enforceable;
      otherwise See paired machine rule.
    remediation_path: 'Use None as default and create the mutable inside: def func(a_items=None): items
      = a_items or []'
guidance:
  title: Guidance, Examples, and Reasoning
  purpose: For human and AI reasoning only. Do not execute this section as a linter.
  reasoning: Mutable default arguments are shared across all calls. The default object is created once
    at function definition time, not per call, causing subtle bugs when the mutable is modified.
  explanation: The correct version uses None as default and creates a new list inside. The incorrect version
    uses a mutable default ([]) which is shared across all calls.
  correct_example: |-
    def process(a_items: list[str] | None = None) -> Result[int]:
        items = a_items if a_items is not None else []
        return Result.success(len(items))
  incorrect_example: |-
    def process(a_items: list[str] = []) -> Result[int]:
        return Result.success(len(a_items))
  related_machine_ids: []
  exceptions: See rule JSON exemptions if any.
