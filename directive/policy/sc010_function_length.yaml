preamble:
  title: Preamble
  purpose: Establish human-readable obligations for SC-010 (Function Length Limit) so authors, reviewers,
    and AI agents can reason about intent without reading evaluator configuration.
  scope: All production code under this coding doctrine, including tests and AI-generated
    code, unless a documented exemption applies.
  existential_need: Long functions are cognitively opaque. They accumulate hidden state,隐含 multiple responsibilities,
    and resist testing. Decomposition forces clarity.
governance:
  title: Governance & Amendment
  authority: Coding Doctrine / Architecture Owner. Amendments require PR review and must keep policy
    identical in intent to the paired machine rule.
  amendment_process:
  - Propose change via PR touching both this policy YAML and the paired rule JSON when semantics change.
  - Policy-only changes (examples, wording) are allowed if Machine ID intent is unchanged.
  - Never add evaluator_type/evaluator_config or other prohibited fields to this file.
  versioning: MAJOR.MINOR.PATCH aligned with policy_contract_version 8.x
  identity:
    machine_id: SC-010
    maps_to: rule.lineage_id
    paired_execution_id_note: Execution ID in schema layer is SC-010; not redefined as executable data
      here.
definitions:
  title: Definitions
  terms:
  - term: Machine ID
    definition: Immutable lineage identifier SC-010 for this directive.
    exclusion: Not an execution ID and not a runtime lookup key for evaluation.
  - term: Paired Rule
    definition: Machine-evaluable document at directive/rule/sc010_function_length.json.
    exclusion: This policy YAML is not a lint source.
  - term: Function Length Limit
    definition: No function SHALL exceed 60 lines of executable code (excluding docstrings, comments,
      blank lines, and the function signature). Functions exceeding this limit SHALL be decomposed into
      sub-functions.
    exclusion: Not optional style preference when deontic type is Obligation or Prohibition.
principles:
  title: Foundational Principles
  description: This directive operationalizes one or more Coding Doctrine core principles.
  items:
  - id: P1
    title: Determinism Over Cleverness
    description: Every function SHALL produce the same output for the same inputs under the same documented
      conditions. No exceptions. Cleverness that sacrifices determinism is forbidden.
  - id: P2
    title: Localized Failure Handling
    description: Every function SHALL handle its own failures. A function SHALL NOT propagate exceptions
      to its caller for the caller to decide what to do. Failure handling is the responsibility of the
      layer that detects the failure.
  - id: P3
    title: Explicit Over Implicit
    description: Every contract, every side effect, every resource ownership transfer, and every state
      mutation SHALL be declared explicitly. Implicit behavior is forbidden.
  - id: P4
    title: Fail-Safe Defaults
    description: When a function encounters a condition it cannot resolve, it SHALL return a deterministic
      failure result. It SHALL NOT leave the system in a partially mutated state. It SHALL NOT raise an
      exception hoping the caller will clean up.
  - id: P5
    title: Validation as Entry Contract
    description: Every function SHALL validate its inputs before executing any logic. Validation is not
      optional. Validation is not behind feature flags. Validation runs in all environments, including
      production.
  - id: P6
    title: Resource Ownership Is Explicit
    description: Every resource SHALL have a single, documented owner. Ownership transfers SHALL be explicit.
      Every resource SHALL be released deterministically, even in failure paths.
  - id: P7
    title: Single Truth Source
    description: Every piece of data SHALL have exactly one authoritative source. Derived data SHALL be
      computed, never independently maintained.
directives:
  title: Directives (Rules & Standards)
  specific_directives:
  - type: Obligation
    description: No function SHALL exceed 60 lines of executable code (excluding docstrings, comments,
      blank lines, and the function signature). Functions exceeding this limit SHALL be decomposed into
      sub-functions.
    machine_id: SC-010
    context_conditions: Generated code (auto-generated by protocol buffers, ORM models) where the structure
      is imposed by external tooling. Boilerplate from the canonical pattern (SC-012) — including initialization,
      validation blocks, and the single return — SHALL be excluded from the 60-line count when calculating
      function length. Nested function definitions count toward the enclosing function's line count.
    title: Function Length Limit
  flexible_standards: []
sanctions:
  title: Sanctions & Remedies
  rows:
  - violation_context: Function exceeds 60 executable lines
    enforcement_action: Machine lint finding via sc010_function_length.json when automatically enforceable;
      otherwise Lint rule (custom), code review gate.
    remediation_path: Decompose into sub-functions. Each function should have a single, well-defined responsibility.
guidance:
  title: Guidance, Examples, and Reasoning
  purpose: For human and AI reasoning only. Do not execute this section as a linter.
  reasoning: Long functions are cognitively opaque. They accumulate hidden state,隐含 multiple responsibilities,
    and resist testing. Decomposition forces clarity.
  explanation: The correct version delegates to focused sub-functions, each under 60 lines. The incorrect
    version has everything in one monolithic function that is hard to test and maintain.
  correct_example: |-
    def process_order(a_order: Order) -> Result[Receipt]:
        result = validate_order(a_order)
        if not result.is_success():
            return result
        result = calculate_totals(a_order)
        if not result.is_success():
            return result
        result = charge_payment(a_order)
        if not result.is_success():
            return result
        return Result.success(Receipt.from_order(a_order))
  incorrect_example: |-
    def process_order(a_order: Order) -> Result[Receipt]:
        # 80+ lines: validate fields, check inventory,
        # calculate tax, apply discounts, charge card,
        # update stock, send email, generate receipt,
        # log everything, handle edge cases...
        pass
  related_machine_ids:
  - SC-001
  - SC-003
  exceptions: Generated code (auto-generated by protocol buffers, ORM models) where the structure is imposed
    by external tooling. Boilerplate from the canonical pattern (SC-012) — including initialization, validation
    blocks, and the single return — SHALL be excluded from the 60-line count when calculating function
    length. Nested function definitions count toward the enclosing function's line count.
