preamble:
  title: Preamble
  purpose: Establish human-readable obligations for SC-041 (Specific Exception Handling) so authors, reviewers,
    and AI agents can reason about intent without reading evaluator configuration.
  scope: All production code under this coding doctrine, including tests and AI-generated
    code, unless a documented exemption applies.
  existential_need: Specific exception catching ensures that only anticipated failures are handled gracefully.
    The safety net clause exists solely to satisfy SC-002 (Zero-Raise Policy) by preventing any exception
    from escaping the function. It must never be used for business logic recovery — only for catastrophic
    fallback. Bare except clauses are always forbidden.
