definitions:
  title: Definitions
  terms:
  - term: Machine ID
    definition: Immutable lineage identifier SC-041 for this directive.
    exclusion: Not an execution ID and not a runtime lookup key for evaluation.
  - term: Paired Rule
    definition: Machine-evaluable document at directive/rule/sc041_specific_exception.json.
    exclusion: This policy YAML is not a lint source.
  - term: Specific Exception Handling
    definition: 'All `except` clauses SHALL catch specific exception types as the primary handlers. The
      `except Exception:` clause MAY be used as a final safety net after all anticipated exceptions have
      been individually handled, to satisfy the Zero-Raise Policy (SC-002). When used as a safety net,
      it SHALL: (a) be the last except clause in the block, (b) log the full traceback at ERROR level
      with correlation ID, (c) include a message identifying the exception as unanticipated, and (d) set
      `b_continue = False` and assign `INVALID_RESULT`. Bare `except:` clauses SHALL NOT be used under
      any circumstances. Programming errors (TypeError, NameError) caught by the safety net SHALL be logged
      at CRITICAL level.'
    exclusion: Not optional style preference when deontic type is Obligation or Prohibition.
principles:
  title: Foundational Principles
  description: This directive operationalizes one or more Coding Doctrine core principles.
  items:
  - id: P1
    title: Determinism Over Cleverness
    description: Every function SHALL produce the same output for the same inputs under the same documented
      conditions. No exceptions. Cleverness that sacrifices determinism is forbidden.
  - id: P2
    title: Localized Failure Handling
    description: Every function SHALL handle its own failures. A function SHALL NOT propagate exceptions
      to its caller for the caller to decide what to do. Failure handling is the responsibility of the
      layer that detects the failure.
  - id: P3
    title: Explicit Over Implicit
    description: Every contract, every side effect, every resource ownership transfer, and every state
      mutation SHALL be declared explicitly. Implicit behavior is forbidden.
  - id: P4
    title: Fail-Safe Defaults
    description: When a function encounters a condition it cannot resolve, it SHALL return a deterministic
      failure result. It SHALL NOT leave the system in a partially mutated state. It SHALL NOT raise an
      exception hoping the caller will clean up.
  - id: P5
    title: Validation as Entry Contract
    description: Every function SHALL validate its inputs before executing any logic. Validation is not
      optional. Validation is not behind feature flags. Validation runs in all environments, including
      production.
  - id: P6
    title: Resource Ownership Is Explicit
    description: Every resource SHALL have a single, documented owner. Ownership transfers SHALL be explicit.
      Every resource SHALL be released deterministically, even in failure paths.
  - id: P7
    title: Single Truth Source
    description: Every piece of data SHALL have exactly one authoritative source. Derived data SHALL be
      computed, never independently maintained.
directives:
  title: Directives (Rules & Standards)
  specific_directives:
  - type: Obligation
    description: 'All `except` clauses SHALL catch specific exception types as the primary handlers. The
      `except Exception:` clause MAY be used as a final safety net after all anticipated exceptions have
      been individually handled, to satisfy the Zero-Raise Policy (SC-002). When used as a safety net,
      it SHALL: (a) be the last except clause in the block, (b) log the full traceback at ERROR level
      with correlation ID, (c) include a message identifying the exception as unanticipated, and (d) set
      `b_continue = False` and assign `INVALID_RESULT`. Bare `except:` clauses SHALL NOT be used under
      any circumstances. Programming errors (TypeError, NameError) caught by the safety net SHALL be logged
      at CRITICAL level.'
    machine_id: SC-041
    context_conditions: Top-level exception handlers in application entry points (e.g., `main()`, signal
      handlers) may catch `Exception` to prevent unhandled crashes. These handlers SHALL log the full
      traceback and return a non-zero exit code. Functions SHALL NOT catch `BaseException` or any of its
      subclasses (`KeyboardInterrupt`, `SystemExit`, `GeneratorExit`). These MUST be allowed to propagate.
      The only permitted catches are `Exception` subclasses.
    title: Specific Exception Handling
  flexible_standards: []
sanctions:
  title: Sanctions & Remedies
  rows:
  - violation_context: Bare except forbidden — catch specific exception types
    enforcement_action: Machine lint finding via sc041_specific_exception.json when automatically enforceable;
      otherwise Lint rule (`pylint:broad-except`), code review gate.
    remediation_path: Catch specific exception types. Use 'except Exception:' as a last-resort safety
      net only, logging at ERROR/CRITICAL level.
guidance:
  title: Guidance, Examples, and Reasoning
  purpose: For human and AI reasoning only. Do not execute this section as a linter.
  reasoning: Specific exception catching ensures that only anticipated failures are handled gracefully.
    The safety net clause exists solely to satisfy SC-002 (Zero-Raise Policy) by preventing any exception
    from escaping the function. It must never be used for business logic recovery — only for catastrophic
    fallback. Bare except clauses are always forbidden.
  explanation: The correct version catches specific exception types (Timeout, ConnectionError). The incorrect
    version uses bare except, which catches SystemExit and KeyboardInterrupt, masking real errors.
  correct_example: |-
    def fetch(a_url: str) -> Result[str]:
        b_continue = True
        result: Result[str] = INVALID_RESULT
        try:
            response = requests.get(a_url, timeout=30)
        except requests.Timeout as e:
            result = Result.failure(f'Request timed out: {e}')
            b_continue = False
        except requests.ConnectionError as e:
            result = Result.failure(f'Connection failed: {e}')
            b_continue = False
        if b_continue:
            result = Result.success(response.text)
        return result
  incorrect_example: |-
    def fetch(a_url: str) -> Result[str]:
        try:
            response = requests.get(a_url, timeout=30)
            return Result.success(response.text)
        except:
            return Result.failure('Request failed')
  related_machine_ids:
  - SC-002
  - SC-040
  exceptions: Top-level exception handlers in application entry points (e.g., `main()`, signal handlers)
    may catch `Exception` to prevent unhandled crashes. These handlers SHALL log the full traceback and
    return a non-zero exit code. Functions SHALL NOT catch `BaseException` or any of its subclasses (`KeyboardInterrupt`,
    `SystemExit`, `GeneratorExit`). These MUST be allowed to propagate. The only permitted catches are
    `Exception` subclasses.
