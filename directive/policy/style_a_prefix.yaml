preamble:
  title: Preamble
  purpose: Establish human-readable obligations for STYLE-1 (Function arguments must use a_ prefix) so
    authors, reviewers, and AI agents can reason about intent without reading evaluator configuration.
  scope: Project style conventions complementary to the Safe Coding Doctrine.
  existential_need: 'Consistent argument naming improves code readability and searchability. The a_ prefix
    distinguishes parameters from local variables at a glance. CLI entry points (Typer/Click @command/@callback/@group)
    are exempt: their parameter names are the public CLI surface (flags and positional args), not internal
    API parameters, so a_ would leak into help text and call sites.'
