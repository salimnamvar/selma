sanctions:
  title: Sanctions & Remedies
  rows:
  - violation_context: Function arguments must use a_ prefix
    enforcement_action: Machine lint finding via style_a_prefix.json when automatically enforceable; otherwise
      See paired machine rule.
    remediation_path: 'Rename arguments: def func(a_name: str, a_count: int):. Do not apply a_ to Typer/Click
      command parameters; use plain names that match the CLI interface (task, query, output).'
guidance:
  title: Guidance, Examples, and Reasoning
  purpose: For human and AI reasoning only. Do not execute this section as a linter.
  reasoning: 'Consistent argument naming improves code readability and searchability. The a_ prefix distinguishes
    parameters from local variables at a glance. CLI entry points (Typer/Click @command/@callback/@group)
    are exempt: their parameter names are the public CLI surface (flags and positional args), not internal
    API parameters, so a_ would leak into help text and call sites.'
  explanation: Internal functions use a_ on parameters (a_value, a_multiplier). CLI handlers decorated
    with @command / @callback / @group must use plain parameter names that mirror the CLI contract (task,
    query), not a_task. Built-ins self, cls, args, and kwargs remain exempt everywhere.
  correct_example: |-
    def calculate(a_value: float, a_multiplier: float = 1.0) -> Result[float]:
        if not isinstance(a_value, (int, float)):
            return Result.failure('Expected number')
        return Result.success(a_value * a_multiplier)

    @app.command()
    def context(
        task: str = typer.Option('general', '--task'),
        query: str | None = typer.Option(None, '--query', '-q'),
        paths: list[str] = typer.Argument(default=None),
    ) -> None:
        request = ContextRequest(task=task, query=query, paths=tuple(paths or ()))
  incorrect_example: |-
    def calculate(value: float, multiplier: float = 1.0) -> Result[float]:
        if not isinstance(value, (int, float)):
            return Result.failure('Expected number')
        return Result.success(value * multiplier)

    @app.command()
    def context(
        a_task: str = typer.Option('general', '--task'),
        a_query: str | None = typer.Option(None, '--query', '-q'),
    ) -> None:
        request = ContextRequest(task=a_task, query=a_query)
  related_machine_ids: []
  exceptions: See rule JSON exemptions if any.
