preamble:
  title: Preamble
  purpose: Establish human-readable obligations for SC-062 (No Sensitive Data in Logs) so authors, reviewers,
    and AI agents can reason about intent without reading evaluator configuration.
  scope: All production code under this coding doctrine, including tests and AI-generated
    code, unless a documented exemption applies.
  existential_need: Logs are stored, transmitted, and accessed by multiple systems. Sensitive data in
    logs creates a data leak vector that bypasses all access controls on the source system.
