preamble:
  title: Preamble
  purpose: Establish human-readable obligations for SC-100 (No Secrets in Source Code) so authors, reviewers,
    and AI agents can reason about intent without reading evaluator configuration.
  scope: All production Python under this project's safe-coding doctrine, including tests and AI-generated
    code, unless a documented exemption applies.
  existential_need: Secrets in source code are visible to everyone with repository access. They persist
    in git history forever. They are the most common cause of credential leakage.
