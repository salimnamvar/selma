    maps_to: rule.lineage_id
    paired_execution_id_note: Execution ID in schema layer is SC-100; not redefined as executable data
      here.
definitions:
  title: Definitions
  terms:
  - term: Machine ID
    definition: Immutable lineage identifier SC-100 for this directive.
    exclusion: Not an execution ID and not a runtime lookup key for evaluation.
  - term: Paired Rule
    definition: Machine-evaluable document at directive/rule/sc100_no_secrets.json.
    exclusion: This policy YAML is not a lint source.
  - term: No Secrets in Source Code
    definition: API keys, passwords, tokens, certificates, and any other secrets SHALL NOT appear in source
      code, configuration files committed to version control, or log entries. Secrets SHALL be injected
      via environment variables or a secrets management system.
    exclusion: Not optional style preference when deontic type is Obligation or Prohibition.
principles:
  title: Foundational Principles
  description: This directive operationalizes one or more Safe Coding Doctrine core principles.
  items:
  - id: P1
    title: Determinism Over Cleverness
    description: Every function SHALL produce the same output for the same inputs under the same documented
      conditions. No exceptions. Cleverness that sacrifices determinism is forbidden.
  - id: P2
    title: Localized Failure Handling
    description: Every function SHALL handle its own failures. A function SHALL NOT propagate exceptions
      to its caller for the caller to decide what to do. Failure handling is the responsibility of the
      layer that detects the failure.
  - id: P3
    title: Explicit Over Implicit
    description: Every contract, every side effect, every resource ownership transfer, and every state
      mutation SHALL be declared explicitly. Implicit behavior is forbidden.
  - id: P4
    title: Fail-Safe Defaults
    description: When a function encounters a condition it cannot resolve, it SHALL return a deterministic
      failure result. It SHALL NOT leave the system in a partially mutated state. It SHALL NOT raise an
      exception hoping the caller will clean up.
  - id: P5
    title: Validation as Entry Contract
    description: Every function SHALL validate its inputs before executing any logic. Validation is not
      optional. Validation is not behind feature flags. Validation runs in all environments, including
      production.
  - id: P6
    title: Resource Ownership Is Explicit
    description: Every resource SHALL have a single, documented owner. Ownership transfers SHALL be explicit.
      Every resource SHALL be released deterministically, even in failure paths.
  - id: P7
    title: Single Truth Source
    description: Every piece of data SHALL have exactly one authoritative source. Derived data SHALL be
      computed, never independently maintained.
directives:
  title: Directives (Rules & Standards)
  specific_directives:
  - type: Prohibition
    description: API keys, passwords, tokens, certificates, and any other secrets SHALL NOT appear in
      source code, configuration files committed to version control, or log entries. Secrets SHALL be
      injected via environment variables or a secrets management system.
    machine_id: SC-100
    context_conditions: None.
    title: No Secrets in Source Code
  flexible_standards: []
sanctions:
  title: Sanctions & Remedies
  rows:
  - violation_context: Possible hardcoded secret — use environment variable
    enforcement_action: Machine lint finding via sc100_no_secrets.json when automatically enforceable;
      otherwise Pre-commit hooks (secret scanning), code review gate, automated CI scanning.
    remediation_path: Use environment variables or a secrets management system. Never hardcode secrets
      in source code.
guidance:
  title: Guidance, Examples, and Reasoning
  purpose: For human and AI reasoning only. Do not execute this section as a linter.
  reasoning: Secrets in source code are visible to everyone with repository access. They persist in git
    history forever. They are the most common cause of credential leakage.
  explanation: The correct version reads secrets from environment variables. The incorrect version hardcodes
    a secret in source code, visible to everyone with repository access.
  correct_example: |-
    import os

    def get_db_password() -> Result[str]:
        password = os.environ.get('DB_PASSWORD')
        if password is None:
            return Result.failure('DB_PASSWORD environment variable not set')
        return Result.success(password)
  incorrect_example: |-
    DB_PASSWORD = 'super_secret_123'

    def get_db_password() -> Result[str]:
        return Result.success(DB_PASSWORD)
  related_machine_ids:
  - SC-062
  - SC-101
  exceptions: None.
