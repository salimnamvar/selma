preamble:
  title: Preamble
  purpose: Establish human-readable obligations for SC-011 (b_continue Rules) so authors, reviewers, and
    AI agents can reason about intent without reading evaluator configuration.
  scope: All production code under this coding doctrine, including tests and AI-generated
    code, unless a documented exemption applies.
  existential_need: 'b_continue is a local execution gate. Its semantics are clear only when it is strictly
    function-local and unidirectional. It governs execution flow across all phases of a function: validation,
    business logic, exception handling, and cleanup. Allowing False → True transitions or external mutation
    creates invisible control flow dependencies.'
