sanctions:
  title: Sanctions & Remedies
  rows:
  - violation_context: Function lacks b_continue error-gating
    enforcement_action: Machine lint finding via sc011_b_continue.json when automatically enforceable;
      otherwise Lint rule (custom AST check), code review gate.
    remediation_path: Add b_continue = True at function start. Set to False on errors, never reset to
      True. Gate phases with 'if b_continue:'.
guidance:
  title: Guidance, Examples, and Reasoning
  purpose: For human and AI reasoning only. Do not execute this section as a linter.
  reasoning: 'b_continue is a local execution gate. Its semantics are clear only when it is strictly function-local
    and unidirectional. It governs execution flow across all phases of a function: validation, business
    logic, exception handling, and cleanup. Allowing False → True transitions or external mutation creates
    invisible control flow dependencies.'
  explanation: The correct version initializes b_continue=True and uses it to gate phases. The incorrect
    version has no error-gating mechanism, making control flow implicit.
  correct_example: |-
    def process(a_data: dict) -> Result[str]:
        b_continue = True
        result: Result[str] = INVALID_RESULT
        if not isinstance(a_data, dict):
            result = Result.failure('Expected dict')
            b_continue = False
        if b_continue:
            result = Result.success(a_data.get('name', ''))
        return result
  incorrect_example: |-
    def process(a_data: dict) -> Result[str]:
        if not isinstance(a_data, dict):
            return Result.failure('Expected dict')
        return Result.success(a_data.get('name', ''))
  related_machine_ids:
  - SC-001
  - SC-002
  - SC-006
  exceptions: None.
