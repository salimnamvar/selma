    maps_to: rule.lineage_id
    paired_execution_id_note: Execution ID in schema layer is SC-003; not redefined as executable data
      here.
definitions:
  title: Definitions
  terms:
  - term: Machine ID
    definition: Immutable lineage identifier SC-003 for this directive.
    exclusion: Not an execution ID and not a runtime lookup key for evaluation.
  - term: Paired Rule
    definition: Machine-evaluable document at directive/rule/sc003_result_return.json.
    exclusion: This policy YAML is not a lint source.
  - term: Structured Result Return
    definition: 'Every function SHALL return a typed `Result[T]` with the following fields: - `is_success()
      -> bool`: Whether the operation completed successfully. - `value: T | None`: The result value, present
      only when `is_success()` is `True`. - `message: str`: A human-readable description of the outcome,
      always present.'
    exclusion: Not optional style preference when deontic type is Obligation or Prohibition.
principles:
  title: Foundational Principles
  description: This directive operationalizes one or more Coding Doctrine core principles.
  items:
  - id: P1
    title: Determinism Over Cleverness
    description: Every function SHALL produce the same output for the same inputs under the same documented
      conditions. No exceptions. Cleverness that sacrifices determinism is forbidden.
  - id: P2
    title: Localized Failure Handling
    description: Every function SHALL handle its own failures. A function SHALL NOT propagate exceptions
      to its caller for the caller to decide what to do. Failure handling is the responsibility of the
      layer that detects the failure.
  - id: P3
    title: Explicit Over Implicit
    description: Every contract, every side effect, every resource ownership transfer, and every state
      mutation SHALL be declared explicitly. Implicit behavior is forbidden.
  - id: P4
    title: Fail-Safe Defaults
    description: When a function encounters a condition it cannot resolve, it SHALL return a deterministic
      failure result. It SHALL NOT leave the system in a partially mutated state. It SHALL NOT raise an
      exception hoping the caller will clean up.
  - id: P5
    title: Validation as Entry Contract
    description: Every function SHALL validate its inputs before executing any logic. Validation is not
      optional. Validation is not behind feature flags. Validation runs in all environments, including
      production.
  - id: P6
    title: Resource Ownership Is Explicit
    description: Every resource SHALL have a single, documented owner. Ownership transfers SHALL be explicit.
      Every resource SHALL be released deterministically, even in failure paths.
  - id: P7
    title: Single Truth Source
    description: Every piece of data SHALL have exactly one authoritative source. Derived data SHALL be
      computed, never independently maintained.
directives:
  title: Directives (Rules & Standards)
  specific_directives:
  - type: Obligation
    description: 'Every function SHALL return Result[T] (or equivalent explicit result type) with success
      discrimination, optional value, and a human-readable message. No exceptions.'
    machine_id: SC-003
    context_conditions: 'Applies to every function with a return type annotation. No exceptions.'
    title: Explicit Result for Every Function
  flexible_standards: []
sanctions:
  title: Sanctions & Remedies
  rows:
  - violation_context: Function returns values but type is not Result[T]
    enforcement_action: 'Machine lint finding via sc003_result_return.json when automatically enforceable;
      otherwise Type checker, code review gate.'
    remediation_path: Return a typed Result[T] with is_success(), value, and message fields.
guidance:
  title: Guidance, Examples, and Reasoning
  purpose: For human and AI reasoning only. Do not execute this section as a linter.
  reasoning: Tuple returns are ambiguous. Callers must remember positional semantics. Typed results are
    self-documenting and statically analyzable.
  explanation: The correct version uses a typed Result[T]. The incorrect version returns a bare tuple
    where callers must remember positional semantics.
  correct_example: |-
    def fetch_user(a_id: int) -> Result[User]:
        user = db.query(a_id)
        if user is None:
            return Result.failure(f'User {a_id} not found')
        return Result.success(user)
  incorrect_example: |-
    def fetch_user(a_id: int) -> tuple[bool, User | None, str]:
        user = db.query(a_id)
        if user is None:
            return (False, None, 'User not found')
        return (True, user, 'Success')
  related_machine_ids:
  - SC-004
  - SC-010
  exceptions: 'None. Every function SHALL return Result[T] — no exceptions.'
