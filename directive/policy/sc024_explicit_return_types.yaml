      otherwise Type checker (`mypy --strict`), code review gate.
    remediation_path: 'Add return type annotation: def foo() -> Result[int]:'
guidance:
  title: Guidance, Examples, and Reasoning
  purpose: For human and AI reasoning only. Do not execute this section as a linter.
  reasoning: Explicit return types are contracts. They tell the caller what to expect and enable static
    analysis to catch type mismatches.
  explanation: The correct version has an explicit return type annotation (-> Result[int]). The incorrect
    version omits it, preventing static analysis from catching type errors.
  correct_example: |-
    def calculate(a_value: int) -> Result[int]:
        if a_value < 0:
            return Result.failure('Value must be non-negative')
        return Result.success(a_value * 2)
  incorrect_example: |-
    def calculate(a_value: int):
        if a_value < 0:
            return Result.failure('Value must be non-negative')
        return Result.success(a_value * 2)
